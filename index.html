<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地域限定旅行業務取扱管理者 過去問クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --field:#E2E0D5;
  --card:#FDFCF8;
  --ink:#17243A;
  --ink-soft:#586377;
  --rule:#D8D2C2;
  --indigo:#1F3459;
  --indigo-soft:#31507F;
  --graphite:#2E3238;
  --ok:#2C7357;
  --ng:#9E3B36;
  --gold:#B8862F;
  --shadow:0 1px 0 rgba(23,36,58,.08), 0 10px 24px -18px rgba(23,36,58,.55);
  --sans:"Noto Sans JP",system-ui,sans-serif;
  --serif:"Noto Serif JP",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --field:#10161F;
    --card:#1A2331;
    --ink:#E7E3D8;
    --ink-soft:#9AA3B2;
    --rule:#2E3A4B;
    --indigo:#9BB6E3;
    --indigo-soft:#7E9BCD;
    --graphite:#C9CEd6;
    --ok:#68C79B;
    --ng:#E08A84;
    --gold:#D9AF5A;
    --shadow:0 10px 30px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --field:#10161F; --card:#1A2331; --ink:#E7E3D8; --ink-soft:#9AA3B2; --rule:#2E3A4B;
  --indigo:#9BB6E3; --indigo-soft:#7E9BCD; --graphite:#C9CED6; --ok:#68C79B; --ng:#E08A84; --gold:#D9AF5A;
  --shadow:0 10px 30px -20px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--field);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.75;letter-spacing:.01em;
}
.wrap{max-width:660px;margin:0 auto;padding:0 14px 132px}

/* ---- header ---- */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--field) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
}
.hbar{max-width:660px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.htitle{font-size:12.5px;color:var(--ink-soft);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{
  border:1px solid var(--rule);background:transparent;color:var(--ink-soft);
  font-family:var(--sans);font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer;
}
.hbtn:hover{color:var(--ink);border-color:var(--indigo-soft)}
.rail{height:3px;background:var(--rule)}
.rail > i{display:block;height:100%;background:var(--indigo-soft);width:0;transition:width .35s ease}

/* ---- home ---- */
.hero{
  margin:22px 0 10px;padding:26px 22px 22px;background:var(--card);border-radius:3px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:8px;
  background:repeating-linear-gradient(90deg,var(--indigo-soft) 0 14px,transparent 14px 22px);opacity:.5;
}
.kicker{font-size:12px;color:var(--gold);letter-spacing:.14em}
.hero h1{
  font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.35;margin:.35em 0 .3em;
}
.hero p{margin:0;color:var(--ink-soft);font-size:13.5px}
.sub{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.sub div{font-size:12px;color:var(--ink-soft)}
.sub b{display:block;font-family:var(--serif);font-size:21px;color:var(--ink);font-weight:600}

h2.sec{font-size:13px;color:var(--ink-soft);font-weight:500;margin:26px 0 8px}
.years{display:flex;gap:8px;flex-wrap:wrap}
.ybtn{
  flex:1 1 30%;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:11px 8px;
  font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink-soft);cursor:pointer;line-height:1.3;
}
.ybtn span{display:block;font-family:var(--sans);font-size:11px;font-weight:400;margin-top:3px}
.ybtn.on{color:var(--card);background:var(--indigo);border-color:var(--indigo)}
:root[data-theme="dark"] .ybtn.on{color:var(--field)}
.ybtn:focus-visible{outline:2px solid var(--indigo-soft);outline-offset:2px}
.menu{display:flex;flex-direction:column;gap:8px}
.mrow{
  width:100%;text-align:left;background:var(--card);border:1px solid transparent;border-left:3px solid var(--indigo-soft);
  border-radius:3px;padding:14px 16px;cursor:pointer;font-family:var(--sans);color:var(--ink);
  box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;
}
.mrow:hover{border-color:var(--indigo-soft)}
.mrow .t{flex:1;min-width:0}
.mrow .t b{display:block;font-size:15px;font-weight:500}
.mrow .t span{font-size:12px;color:var(--ink-soft)}
.mrow .n{font-family:var(--serif);font-size:13px;color:var(--ink-soft);text-align:right;white-space:nowrap}
.mrow .n em{font-style:normal;font-size:20px;color:var(--ok)}
.mrow[disabled]{opacity:.45;cursor:default}
.note{font-size:11.5px;color:var(--ink-soft);margin:18px 2px 0;line-height:1.7}

/* ---- question ---- */
.qcard{background:var(--card);border-radius:3px;box-shadow:var(--shadow);margin:16px 0;padding:18px 18px 20px}
.qhead{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.qno{
  font-family:var(--serif);font-weight:600;font-size:13px;color:var(--card);background:var(--indigo);
  padding:3px 9px;border-radius:2px;
}
:root[data-theme="dark"] .qno,@media (prefers-color-scheme:dark){}
.qtag{font-size:11px;color:var(--gold);border:1px solid var(--gold);padding:1px 7px;border-radius:999px}
.qgrp{font-size:11.5px;color:var(--ink-soft);margin-left:auto;text-align:right}
.qtext{font-family:var(--serif);font-size:16px;line-height:1.95;margin:0}
.material{
  margin:14px 0 0;padding:12px 14px;border:1px solid var(--rule);border-radius:2px;
  background:color-mix(in srgb,var(--indigo-soft) 7%,transparent);
  font-size:13px;line-height:1.85;white-space:pre-wrap;overflow-x:auto;
}

.choices{margin:16px 0 0;display:flex;flex-direction:column;gap:8px}
.choice{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:1px solid var(--rule);border-radius:3px;padding:11px 12px;
  font-family:var(--sans);font-size:14px;line-height:1.8;color:var(--ink);
}
.choice:hover{border-color:var(--indigo-soft)}
.choice:focus-visible{outline:2px solid var(--indigo-soft);outline-offset:2px}
.bub{
  flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--graphite);
  display:grid;place-items:center;font-family:var(--serif);font-size:13px;font-weight:600;
  color:var(--graphite);background:transparent;transition:background .15s,color .15s;
}
.choice[aria-pressed="true"] .bub{background:var(--graphite);color:var(--card)}
.choice[aria-pressed="true"]{border-color:var(--graphite)}
.choice.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.choice.correct .bub{border-color:var(--ok);background:var(--ok);color:var(--card)}
.choice.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 9%,transparent)}
.choice.wrong .bub{border-color:var(--ng);background:var(--ng);color:var(--card)}
.choice[disabled]{cursor:default;opacity:1}
.mark{flex:none;font-size:15px;font-weight:700;margin-left:auto;padding-left:6px}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)}

.verdict{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.vhead{display:flex;align-items:baseline;gap:10px;font-family:var(--serif);font-size:16px;font-weight:600}
.vhead .res.ok{color:var(--ok)} .vhead .res.ng{color:var(--ng)}
.vhead .ans{color:var(--ink-soft);font-size:13.5px;font-family:var(--sans)}
.verdict p{margin:8px 0 0;font-size:13.5px;line-height:1.95;color:var(--ink)}
.reveal{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.rail>i{transition:none}}

/* ---- action bar ---- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--field) 92%,transparent);backdrop-filter:blur(8px);
  border-top:1px solid var(--rule);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
}
.barin{max-width:660px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{
  flex:1;background:var(--indigo);color:var(--card);border:none;border-radius:3px;
  font-family:var(--sans);font-size:15px;font-weight:500;padding:13px 16px;cursor:pointer;
}
:root[data-theme="dark"] .btn,:root .btn{}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{flex:none;background:transparent;color:var(--ink-soft);border:1px solid var(--rule)}
.hint{font-size:11.5px;color:var(--ink-soft);text-align:center;max-width:660px;margin:6px auto 0}

/* ---- result ---- */
.score{background:var(--card);border-radius:3px;box-shadow:var(--shadow);padding:22px;margin:20px 0}
.score h2{font-family:var(--serif);font-size:22px;margin:0 0 4px;font-weight:600}
.score .big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1.1}
.score .big span{font-size:16px;color:var(--ink-soft)}
.brk{margin-top:18px;border-top:1px solid var(--rule)}
.brk div{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}
.brk div b{font-weight:500;flex:1}
.brk .pt{font-family:var(--serif);font-size:16px}
.brk .pass{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.brk .pass.y{color:var(--ok)} .brk .pass.n{color:var(--ng)}
.rvw{background:var(--card);border-radius:3px;box-shadow:var(--shadow);padding:6px 18px;margin:14px 0}
.rvw details{border-bottom:1px solid var(--rule)}
.rvw details:last-child{border-bottom:none}
.rvw summary{cursor:pointer;padding:12px 0;font-size:13.5px;list-style:none;display:flex;gap:10px}
.rvw summary::-webkit-details-marker{display:none}
.rvw summary .n{font-family:var(--serif);color:var(--ng);flex:none}
.rvw .body{font-size:13px;color:var(--ink-soft);padding:0 0 14px;line-height:1.9}
.rvw .body b{color:var(--ink)}
footer{text-align:center;font-size:11px;color:var(--ink-soft);padding:24px 8px 8px;line-height:1.8}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="htitle" id="htitle">地域限定旅行業務取扱管理者　令和7年度 過去問</div>
    <button class="hbtn" id="quitBtn" hidden>やめる</button>
  </div>
  <div class="rail"><i id="rail"></i></div>
</header>

<main class="wrap" id="view"></main>

<div class="bar" id="bar" hidden>
  <div class="barin">
    <button class="btn ghost" id="skipBtn" type="button">とばす</button>
    <button class="btn" id="mainBtn" type="button">採点する</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<script id="quizdata" type="application/json">{"R7":[[{"no":"(1)","prompt":"次の記述のうち、法第1条「目的」に定められているものをすべて選びなさい。","choices":{"ア":"旅行業等を営む者の業務を通じた訪日外国人旅行の誘致と国際交流の促進","イ":"旅行業等を営む者の組織する団体の適正な活動の促進","ウ":"旅行業等を営む者の利便の増進","エ":"旅行業等を営む者について登録制度の実施"},"answer":["イ","エ"],"explain":"法第1条は、登録制度の実施、旅行業等を営む者の業務の適正な運営の確保、旅行業等を営む者の組織する団体の適正な活動の促進、営業保証金制度の実施により、取引の公正、旅行の安全、旅行者の利便を増進することを目的としています。ウは「旅行者の利便」であって営む者の利便ではありません。アは目的規定にありません。"},{"no":"(2)","prompt":"報酬を得て、次の行為を事業として行う場合、旅行業の登録を要するものをすべて選びなさい。","choices":{"ア":"全国通訳案内士が、訪日外国人旅行者からの依頼に基づき、他人が経営する運送機関及び宿泊機関の手配を行う行為","イ":"予備校が、受験生に対し、受験指導合宿を行うため、他人の経営する宿泊機関や運送機関を自ら手配する行為","ウ":"宿泊機関が、自ら経営する旅館の宿泊プランと他人の経営する観光バスによる市内観光をセットにして旅行者に販売する行為","エ":"観光タクシー会社が、自ら所有するタクシーを使い、旅行者のために観光施設の入場と昼食をセットにした日帰り旅行を販売する行為"},"answer":["ア","イ","ウ"],"explain":"報酬を得て、事業として「他人の経営する」運送・宿泊機関のサービス提供を手配すれば旅行業の登録が必要です。通訳案内士や予備校、宿泊機関であっても例外はありません。エは運送事業者が自ら行う運送サービスに付随して行う行為で、旅行業の登録は不要とされています。"},{"no":"(3)","prompt":"旅行業及び旅行業者代理業の登録に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"第2種旅行業の新規登録の申請をしようとする者は、主たる営業所の所在地を管轄する都道府県知事に新規登録申請書を提出しなければならない。","イ":"第3種旅行業の更新登録の申請をしようとする者は、主たる営業所の所在地を管轄する都道府県知事に更新登録申請書を提出しなければならない。この場合、有効期間の満了の日の2月前までに提出するものとする。","ウ":"第1種旅行業の新規登録の申請をしようとする者は、観光庁長官に新規登録申請書を提出しなければならない。","エ":"旅行業者代理業の更新登録の申請をしようとする者は、有効期間の満了の日の2月前までに主たる営業所の所在地を管轄する都道府県知事に更新登録申請書を提出しなければならない。"},"answer":["エ"],"explain":"旅行業の登録には5年の有効期間がありますが、旅行業者代理業の登録には有効期間がなく、更新登録という制度自体がありません。ア・イ・ウは正しく、第1種は観光庁長官、それ以外は主たる営業所の所在地を管轄する都道府県知事が登録行政庁です。"},{"no":"(4)","prompt":"登録業務範囲に関する次の記述のうち、誤っているものを1つ選びなさい（いずれも旅行業務取扱管理者の選任要件は満たされているものとする。）。","choices":{"ア":"第3種旅行業者は、訪日外国人旅行者を対象にした本邦内の企画旅行（参加する旅行者の募集をすることにより実施するものであって、一の企画旅行ごとに一の拠点区域内において実施されるものに限る。）を実施することができる。","イ":"第1種旅行業者は、すべての旅行業務を取り扱うことができる。","ウ":"第2種旅行業者は、本邦外の企画旅行（参加する旅行者の募集をすることにより実施するものに限る。）を実施することができない。","エ":"地域限定旅行業者は、本邦外の旅行に関する相談に応ずることができない。"},"answer":["エ"],"explain":"登録業務範囲の制限は企画旅行・手配旅行の実施に関するもので、旅行相談業務には範囲の制限がありません。地域限定旅行業者でも海外旅行の相談に応じることができます。"},{"no":"(5)","prompt":"次の記述のうち、旅行業又は旅行業者代理業の登録の拒否事由に該当しないものを1つ選びなさい。","choices":{"ア":"法人であって、その役員が暴力団員による不当な行為の防止等に関する法律第2条第6号に規定する暴力団員でなくなった日から5年を経過していない者","イ":"旅行業者代理業を営もうとする者であって、その代理する旅行業を営む者が2以上あるもの","ウ":"法人であって、その役員が道路交通法に違反して罰金の刑に処せられ、その執行が終わった日から5年を経過していない者","エ":"第2種旅行業を営もうとする者であって、その基準資産額が300万円であるもの"},"answer":["ウ"],"explain":"拒否事由となる罰金刑は、旅行業法違反や暴力団関係の一定の罪などに限られ、道路交通法違反の罰金は該当しません。イは代理業者が所属できる旅行業者は1社のみという原則、エは第2種の基準資産額700万円以上の要件に反するため、いずれも拒否事由です。"},{"no":"(6)","prompt":"変更登録等に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"第1種旅行業者は、業務の範囲を第3種旅行業へ変更しようとするときは、主たる営業所の所在地を管轄する都道府県知事に変更登録申請書を提出しなければならない。","イ":"第3種旅行業者は、主たる営業所の所在地を都道府県の区域を異にする所在地に変更しようとするときは、変更後の主たる営業所の所在地を管轄する都道府県知事に変更登録申請書を提出しなければならない。","ウ":"第2種旅行業者は、業務の範囲を第1種旅行業へ変更しようとするときは、主たる営業所の所在地を管轄する都道府県知事に変更登録申請書を提出しなければならない。","エ":"旅行業者代理業者は、業務の範囲を第3種旅行業へ変更しようとするときは、主たる営業所の所在地を管轄する都道府県知事に変更登録申請書を提出しなければならない。"},"answer":["ア"],"explain":"業務範囲の変更登録は、変更後の業務範囲に応じた登録行政庁に申請します。第1種から第3種への変更は都道府県知事、第2種から第1種への変更は観光庁長官です（ウは誤り）。イは変更登録ではなく変更届出の対象、エは代理業者が旅行業者になるには新規登録が必要です。"},{"no":"(7)","prompt":"営業保証金に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者が供託すべき営業保証金の額は、当該旅行業者の前事業年度における旅行業務に関する旅行者及び運送等サービス提供機関との取引の額に応じ、業務の範囲の別ごとに国土交通省令で定めるところにより算定した額である。","イ":"営業保証金は、国債証券、地方債証券、その他の国土交通省令で定める有価証券をもって、これに充てることができる。","ウ":"旅行業者代理業者は、所属旅行業者の主たる営業所の最寄りの供託所に営業保証金を供託しなければならない。","エ":"旅行業者は、営業保証金を供託し、供託物受入れの記載のある供託書を受領したときは、直ちにその事業を開始することができる。"},"answer":["イ"],"explain":"営業保証金は有価証券で充てることができます。アは算定の基礎が「旅行者との取引の額」であり、サービス提供機関との取引額は含みません。ウは代理業者に供託義務はありません。エは供託後、その旨を登録行政庁に届け出た後でなければ事業を開始できません。"},{"no":"(8)","prompt":"法第11条の2「旅行業務取扱管理者の選任」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者等は、旅行業務に従事した経験が1年未満である者を、旅行業務取扱管理者として選任することができる。","イ":"旅行業者等は、訪日外国人旅行者の本邦内の旅行のみを取り扱う営業所においては、総合旅行業務取扱管理者試験に合格した者をその営業所の旅行業務取扱管理者として選任しなければならない。","ウ":"旅行業者等は、その営業所の旅行業務取扱管理者として選任した者の全てが欠けるに至ったときは、新たに旅行業務取扱管理者を選任するまでの間は、その営業所において旅行業務に関する契約を締結してはならない。","エ":"旅行業者等は、旅行業務を取り扱う者が1人である営業所についても、法第11条の2第1項に規定する旅行業務取扱管理者を選任しなければならない。"},"answer":["イ"],"explain":"訪日外国人旅行者向けであっても、取り扱うのが本邦内の旅行のみであれば、国内旅行業務取扱管理者（地域限定であればその区域内）で足ります。総合の資格までは要求されません。"},{"no":"(9)","prompt":"次の記述のうち、旅行業務取扱管理者の職務として定められていないものをすべて選びなさい。","choices":{"ア":"法第7条の規定による営業保証金の供託に関する事項","イ":"法第12条の6の規定による外務員の証明書携帯等に関する事項","ウ":"旅行に関する苦情の処理に関する事項","エ":"法第12条の9の規定による標識の掲示に関する事項"},"answer":["ア","イ","エ"],"explain":"管理者の職務は、旅行計画の作成、料金の掲示、約款の掲示・備置き、取引条件の説明、契約書面の交付、広告の表示、旅程管理措置、苦情の処理、取引記録などです。営業保証金の供託・外務員証明書の携帯・標識の掲示は職務として定められていません。"},{"no":"(10)","prompt":"旅行者から収受する旅行業務の取扱いの料金（企画旅行に係るものを除く。）に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者代理業者は、事業の開始前に、旅行業務の取扱いの料金を自ら定め、これをその営業所において旅行者に見やすいように掲示しなければならない。","イ":"旅行業者は、事業の開始前に、旅行業務の取扱いの料金を定め、これをその営業所において旅行者に見やすいように掲示しなければならない。","ウ":"旅行業務の取扱いの料金は、契約の種類及び内容にかかわらず、定額により定められ、旅行者にとって明確なものでなければならない。","エ":"旅行業者は、旅行業務の取扱いの料金を変更したときは、その旨を直ちに登録行政庁に届け出なければならない。"},"answer":["イ"],"explain":"料金は事業開始前に定めて営業所に掲示します。アは代理業者が自ら定めるのではなく所属旅行業者の料金によります。ウは定額である必要はなく、契約の種類・内容に応じて定率等でも明確であれば足ります。エの届出義務はありません。"},{"no":"(11)","prompt":"旅行業約款に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者等は、旅行業約款をその営業所において、旅行者に見やすいように掲示し、旅行業務に関し契約を締結しようとするときは、旅行業約款の写しを旅行者に交付しなければならない。","イ":"委託旅行業者と受託旅行業者が標準旅行業約款と同一の旅行業約款を定めているときは、当該委託旅行業者を代理して企画旅行契約を締結する受託旅行業者の営業所には、当該受託旅行業者の旅行業約款を備え置くことで足りる。","ウ":"旅行業者は、旅行業約款について国土交通省令・内閣府令で定める軽微な変更をしようとするときは、登録行政庁の認可を受けることを要しない。","エ":"旅行業者代理業者は、自ら旅行業約款を定め、登録行政庁の認可を受けなければならない。"},"answer":["ウ"],"explain":"軽微な変更については認可が不要です。アは掲示又は備置きで足り、写しの交付義務はありません。エは代理業者は所属旅行業者の約款によるため、自ら定めて認可を受けることはありません。"},{"no":"(12)","prompt":"旅行業者等が旅行業務に関し旅行者と契約を締結しようとするときの取引条件の説明及びその際に交付する書面に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、旅行に関する相談に応ずる行為に係る旅行業務について契約を締結する場合にあっては、旅行者が旅行業者に支払うべき対価及びその収受方法について説明しなければならない。","イ":"旅行業者等は、書面の交付に代えて、政令で定めるところにより、旅行者の承諾を得て、当該書面に記載すべき事項を国土交通省令・内閣府令で定める情報通信の技術を利用する方法により提供することができる。","ウ":"旅行業者等は、企画旅行契約を締結しようとする場合にあっては、当該旅行について、旅程管理業務を行う者の同行の有無にかかわらず、旅行地における企画者との連絡方法について、書面に記載しなければならない。","エ":"旅行業者等は、企画旅行契約を締結しようとする場合にあっては、旅行の目的地を勘案して、旅行者が取得することが望ましい安全及び衛生に関する情報があるときは、その旨及び当該情報を書面に記載しなければならない。"},"answer":["ウ"],"explain":"旅行地における企画者との連絡方法は、旅程管理業務を行う者が同行しない場合に記載すべき事項です。同行の有無にかかわらず必要とする点が誤りです。"},{"no":"(13)","prompt":"次の記述のうち、旅行業者等が旅行者と企画旅行契約を締結したときに交付する国土交通省令・内閣府令で定める書面の記載事項として定められているものをすべて選びなさい。","choices":{"ア":"契約の変更及び解除に関する事項","イ":"企画旅行（参加する旅行者の募集をすることにより実施するものに限る。）の参加者数があらかじめ企画者が定める人員数を下回った場合に当該企画旅行を実施しないこととするときは、その旨及び当該人員数","ウ":"旅行に参加する資格を定める場合にあっては、その旨及び当該資格","エ":"契約の申込方法及び契約の成立に関する事項"},"answer":["ア","イ","ウ"],"explain":"エの「契約の申込方法及び契約の成立に関する事項」は、契約締結前に交付する取引条件説明書面の記載事項であり、契約締結後に交付する契約書面の記載事項ではありません。"},{"no":"(14)","prompt":"旅行業務取扱管理者の証明書の提示、外務員の証明書携帯等に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"外務員は、その業務を行うときは、国土交通省令で定める様式による外務員の証明書を提示しなければならない。","イ":"旅行業者代理業者の外務員の証明書は、必ず当該旅行業者代理業者の所属旅行業者が発行しなければならない。","ウ":"旅行業務取扱管理者は、旅行業務について旅行者と契約を締結しようとするときは、旅行者に対し、国土交通省令で定める様式による旅行業務取扱管理者の証明書を必ず提示しなければならない。","エ":"外務員とは、勧誘員、販売員、外交員その他いかなる名称を有する者であるかを問わず、旅行業者等のために営業所以外の場所で旅行業務について取引を行う使用人のことで、役員は除かれる。"},"answer":["ア"],"explain":"外務員は業務を行うときに証明書を提示しなければなりません。これに対し管理者の証明書は、旅行者から請求があったときに提示すれば足ります（ウは誤り）。イは代理業者自身が発行します。エは役員も外務員に含まれます。"},{"no":"(15)","prompt":"旅行業者等が、企画旅行に参加する旅行者を募集するための広告に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行者が提供を受けることができる運送等サービスに専ら企画旅行の実施のために提供される運送サービスが含まれる場合にあっては、当該運送サービスの内容を勘案して、広告には、旅行者が取得することが望ましい輸送の安全に関する情報を表示しなければならない。","イ":"広告には、企画者の氏名又は名称及び住所並びに登録番号を表示しなければならない。","ウ":"旅行者が旅行業者等に支払うべき対価が当該企画旅行の出発日により異なる場合において、広告にその最低額を表示するときは、併せてその最高額を表示しなければならない。","エ":"広告には、契約の申込方法及び契約の成立に関する事項を表示しなければならない。"},"answer":["エ"],"explain":"募集広告の表示事項は、企画者の氏名等、旅行の目的地及び日程、サービスの内容、旅行代金、旅程管理業務を行う者の同行の有無、最少催行人員などです。契約の申込方法・成立に関する事項は表示事項に含まれません。"},{"no":"(16)","prompt":"標識に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者代理業者は、標識に所属旅行業者の登録番号及び登録年月日並びに氏名又は名称を記載しなければならない。","イ":"旅行業者等以外の者は、国土交通省令で定める様式の標識又はこれに類似する標識を掲示してはならない。","ウ":"旅行業者等は、営業所において、国土交通省令で定める様式の標識を、公衆に見やすいように掲示するか閲覧できるよう備え置かなければならない。","エ":"旅行業者等は、標識に営業所の名称、住所及び旅行業務取扱管理者の氏名を記載しなければならない。"},"answer":["イ"],"explain":"旅行業者等以外の者が標識や類似標識を掲示することは禁止されています。ウは備置きでは足りず「掲示」が必要です。ア・エは標識の様式に定められた記載事項と異なります。"},{"no":"(17)","prompt":"企画旅行の円滑な実施のための措置に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者は、本邦内の旅行であって、契約の締結の前に旅行者に対し、代替サービスの手配等の措置を講じない旨を説明し、かつ、その旨を表示した書面を交付した場合は、当該措置を講じることを要しない。","イ":"旅行業者は、旅行に関する計画における2人以上の旅行者が同一の日程により行動することを要する区間における円滑な旅行の実施を確保するために、必要な集合時刻、集合場所その他の事項に関する旅行者に対する指示を行わなければならない。","ウ":"旅行業者は、旅行に関する計画に定めるサービスの旅行者への確実な提供を確保するために旅行の募集開始前に必要な予約の完了その他の措置を講じなければならない。","エ":"旅行業者は、旅行者からの依頼により旅行に関する計画を作成し、これにより実施する本邦内の企画旅行においては、旅行地において旅行に関する計画に定めるサービスの提供を受けるために必要な手続の実施その他の措置を講じることを要しない。"},"answer":["イ"],"explain":"集合時刻・集合場所等の指示は旅程管理措置として必ず講じなければならない事項です。アのように説明と書面交付で免除される仕組みはなく、ウは「旅行開始前」、エの受注型企画旅行でも手続の実施等の措置は必要です。"},{"no":"(18)","prompt":"旅程管理業務を行う者に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"企画旅行に参加する旅行者に同行して、旅程管理業務を行う者として旅行業者によって選任される者が複数の場合は、当該同行する者のすべてが旅程管理業務を行う主任の者の資格要件を満たす者でなければならない。","イ":"本邦外の企画旅行に参加する旅行者に同行して旅程管理業務を行う主任の者に選任されるために必要な実務の経験には、本邦内の企画旅行に同行して旅程管理業務に従事した経験も含まれる。","ウ":"国土交通省令で定める旅程管理業務に関する実務の経験は、登録研修機関が実施する旅程管理研修の課程を修了した日の前後1年以内に1回以上又は当該研修の課程を修了した日から3年以内に2回以上の旅程管理業務に従事した経験をいう。","エ":"旅行業者は、旅行業務又は旅行サービス手配業務に関し不正な行為をした者については、その行為が行われた時期に関わらず、旅程管理業務を行う主任の者として選任することはできない。"},"answer":["ウ"],"explain":"実務経験の要件は、研修修了日の前後1年以内に1回以上、又は修了日から3年以内に2回以上です。アは主任の者以外は資格要件不要、イは海外の主任の者には海外の企画旅行での経験が必要、エは不正行為から5年を経過しない者が対象です。"},{"no":"(19)","prompt":"法第13条「禁止行為」及び法第14条「名義利用等の禁止」に関する次の記述のうち、誤っているものをすべて選びなさい。","choices":{"ア":"旅行業者等は、旅行者と書面による特約を交わした場合を除き、営業所に掲示した旅行業務の取扱いの料金を超えて料金を収受することはできない。","イ":"旅行業者等は、その名義を他人に旅行業又は旅行業者代理業のため利用させてはならない。","ウ":"旅行業者等が、旅行者に対し旅行地において施行されている法令に違反する行為を行うことをあっせんし、又はその行為を行うことに関し便宜の供与を行う旨の広告をした場合であっても、実際にあっせん、あるいは便宜を供与しなければ禁止行為に該当しない。","エ":"旅行業者等又はその代理人、使用人その他の従業者は、旅行者に対し、旅行地において特定のサービスの提供を受けること又は特定の物品を購入することを強要する行為をしてはならない。"},"answer":["ア","ウ"],"explain":"アは特約の有無にかかわらず、掲示した料金を超えて収受することはできません。ウは「あっせんし、又は便宜の供与を行う旨の広告をすること」自体が禁止行為に当たるため、実際に行わなくても該当します。"},{"no":"(20)","prompt":"受託契約に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、受託契約を締結すれば、旅行業者代理業の登録を受けなくても、委託旅行業者が実施する企画旅行（募集型に限る。）について、当該委託旅行業者を代理して企画旅行契約を締結することができる。","イ":"地域限定旅行業者は、第1種旅行業者を委託旅行業者として受託契約を締結することができる。","ウ":"旅行業者代理業者は、所属旅行業者以外の他の旅行業者と自ら受託契約を締結し、当該他の旅行業者を代理して企画旅行契約を販売することはできない。","エ":"委託旅行業者及び受託旅行業者は、受託契約において、委託旅行業者を代理して企画旅行契約（募集型に限る。）を締結することができる受託旅行業者又はその受託旅行業者代理業者については、主たる営業所のみを定めておくことで足りる。"},"answer":["エ"],"explain":"受託契約では、代理して契約を締結できる受託旅行業者等の営業所を定めておく必要があります。主たる営業所のみを定めれば足りるわけではありません。"},{"no":"(21)","prompt":"旅行業者代理業者に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者代理業者は、旅行業務に関し取引をしようとするときは、所属旅行業者の氏名又は名称及び登録番号並びに旅行業者代理業者である旨を取引の相手方に明示しなければならない。","イ":"旅行業者代理業の登録は、所属旅行業者のために旅行業務を取り扱うことを内容とする契約が効力を失ったとき、又は所属旅行業者が旅行業の登録を抹消されたときは、その効力を失う。","ウ":"旅行業者代理業者は、所属旅行業者の承諾がある場合に限り、その行う営業が旅行業であるとの広告をすることができる。","エ":"所属旅行業者は、旅行業者代理業者への旅行業務の委託につき相当の注意をしていたときは、当該旅行業者代理業者が旅行業務につき旅行者に重大な損害を加えた場合を除き、その損害を賠償する責めに任じない。"},"answer":["イ"],"explain":"代理業の登録は、所属旅行業者との契約が失効したとき等に効力を失います。アは明示すべきは所属旅行業者の氏名又は名称と代理業者である旨で、登録番号は含まれません。ウは承諾があっても旅行業を営む旨の広告はできません。エは所属旅行業者は原則として賠償責任を負います。"},{"no":"(22)","prompt":"法第19条「登録の取消し等」に関する次の記述のうち、正しいものをすべて選びなさい。","choices":{"ア":"登録行政庁は、旅行業者等が法人であって、登録当時、その役員のうちに暴力団員でなくなった日から5年を経過していない者があったことが判明したときは、6月以内の期間を定めて業務の全部若しくは一部の停止を命じ、又は登録を取り消すことができる。","イ":"登録行政庁は、旅行業者が営業保証金の供託を登録行政庁に届け出る前にその事業を開始したことが判明したときは、当該旅行業者に対し6月以内の期間を定めて業務の全部若しくは一部の停止を命じ、又は登録を取り消すことができる。","ウ":"登録行政庁は、旅行業者等が登録を受けてから6月以内に事業を開始せず、又は引き続き6月以上事業を行っていないと認められるときは、当該旅行業者等の登録を取り消すことができる。","エ":"登録行政庁は、旅行業者が不正の手段により有効期間の更新の登録を受けたときは、当該旅行業者に対し6月以内の期間を定めて業務の全部若しくは一部の停止を命じ、又は登録を取り消すことができる。"},"answer":["ア","イ","エ"],"explain":"ウは「6月」ではなく「1年」です。登録を受けてから1年以内に事業を開始せず、又は引き続き1年以上事業を行っていないと認めるときに登録を取り消すことができます。"},{"no":"(23)","prompt":"旅行サービス手配業に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行サービス手配業者は、旅行サービス手配業務を他人に委託する場合においては、他の旅行サービス手配業者以外の者に委託してはならない。","イ":"旅行サービス手配業の更新登録の申請をしようとする者は、主たる営業所の所在地を管轄する都道府県知事に、更新登録申請書を提出しなければならない。","ウ":"旅行サービス手配業者又はその代理人、使用人その他の従業者は、その取り扱う旅行サービス手配業務に関連して、旅行サービス手配業の信用を失墜させるものとして、取引をする者に対し、法令に違反する行為を行うことをあっせんし、又はその行為を行うことに関し便宜を供与する行為を行ってはならない。","エ":"旅行サービス手配業者は、旅行サービス手配業務を取り扱う者が1人である営業所についても旅行サービス手配業務取扱管理者を選任しなければならないが、当該選任された者は、他の営業所の旅行サービス手配業務取扱管理者を兼任することができる。"},"answer":["ウ"],"explain":"ウは禁止行為として定められています。イは旅行サービス手配業の登録に有効期間はなく、更新登録の制度がありません。エは原則として他の営業所との兼任はできません。アのように委託先を他の旅行サービス手配業者に限る定めはありません。"},{"no":"(24)","prompt":"次の記述のうち、旅行業協会が適正かつ確実に実施しなければならない業務として定められていないものを1つ選びなさい。","choices":{"ア":"旅行業務及び旅行サービス手配業務に関する取引の公正の確保又は旅行業、旅行業者代理業及び旅行サービス手配業の健全な発達を図るための調査、研究及び広報","イ":"旅行業務又は旅行サービス手配業務の適切な運営を確保するための旅行業者等又は旅行サービス手配業者に対する監査及び聴聞","ウ":"旅行業務に関し社員である旅行業者又は当該旅行業者を所属旅行業者とする旅行業者代理業者と取引をした旅行者に対しその取引によって生じた債権に関し弁済をする業務","エ":"旅行者及び旅行に関するサービスを提供する者からの旅行業者等又は旅行サービス手配業者の取り扱った旅行業務又は旅行サービス手配業務に対する苦情の解決"},"answer":["イ"],"explain":"旅行業協会の業務は、苦情の解決、研修、弁済業務、調査・研究・広報、そして「指導」です。監査及び聴聞は定められていません。"},{"no":"(25)","prompt":"旅行業協会が行う苦情の解決に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業協会は、旅行者又はサービスを提供する者から社員が取り扱った旅行業務に関する苦情について解決の申出があったときは、当該社員に対し、その解決のための方法を明示しなければならない。","イ":"旅行業協会は、苦情の解決についての申出、当該苦情に係る事情及びその解決の結果が重要なものである場合には、社員だけでなく社員以外の旅行業者等及び旅行サービス手配業者にも周知させなければならない。","ウ":"旅行業協会に苦情の解決の申出があった全ての旅行業者等又は旅行サービス手配業者は、旅行業協会から文書若しくは口頭による説明又は資料の提出の求めがあったときは、正当な理由がないのに、これを拒んではならない。","エ":"旅行業協会は、旅行者から申出があった旅行業者等が取り扱った旅行業務に関する苦情の解決について必要があると認めるときは、当該旅行業務を取り扱った旅行業者等に対し、文書若しくは口頭による説明を求め、又は資料の提出を求めることができる。"},"answer":["エ"],"explain":"協会は必要と認めるときに説明や資料の提出を求めることができます。アは解決方法の明示ではなく苦情の内容を通知して迅速な処理を求めるもの、イの周知は社員に対して行うもの、ウの拒んではならない義務を負うのは社員である旅行業者等です。"}],[{"no":"(1)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「適用範囲」「用語の定義」に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者が法令に反せず、かつ、旅行者の不利にならない範囲で口頭のみにより特約を結んだときは、その特約は約款に優先して適用される。","イ":"「国内旅行」とは、本邦内のみの旅行をいい、「海外旅行」とは、本邦外の旅行のみをいう。","ウ":"旅行業者が旅行者との間で締結する契約は、約款の定めるところによるが、約款に定めのない事項については、法令又は一般に確立された慣習による。","エ":"「通信契約」とは、旅行業者が提携するクレジットカード会社のカード会員である旅行者が、インターネットを使用して旅行契約の申込みを行い、旅行業者の営業所においてクレジットカードを利用して伝票に署名して旅行代金を支払う契約をいう。"},"answer":["ウ"],"explain":"アは特約は書面によることが必要です。イの「海外旅行」は国内旅行以外の旅行をいい、本邦内と本邦外にまたがる旅行も含みます。エの通信契約は、カード利用日に伝票への署名なしで旅行代金を支払う契約です。"},{"no":"(2)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行契約の内容」「手配代行者」「契約の申込み」に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行の参加に際し、特別な配慮を必要とする旨の申し出が旅行者から契約の申込時にあったときは、旅行業者は可能な範囲内でこれに応じ、この申出に基づき旅行業者が講じた特別な措置に要する費用は、旅行者の負担とする。","イ":"旅行業者は、国内旅行の契約の履行に当たって、手配の全部又は一部を手配を業として行う者に代行させることはできない。","ウ":"通信契約の申込みをしようとする旅行者は、申込みをしようとする旅行の名称、旅行開始日、会員番号その他の事項を旅行業者に通知し、旅行業者所定の申込書に記入の上、提出しなければならない。","エ":"旅行業者は、契約において、旅行者が旅行日程に従ってサービスの提供を受けることができるように手配するが、旅程を管理することは引き受けない。"},"answer":["ア"],"explain":"特別な措置に要する費用は旅行者負担です。イは国内・海外を問わず手配代行者に代行させることができます。ウは通信契約では申込書の提出は不要です。エは手配に加えて旅程管理も引き受けます。"},{"no":"(3)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「電話等による予約」「契約締結の拒否」「契約の成立時期」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"通信契約は、旅行業者が契約の締結を承諾する旨の通知を旅行者に発した時に成立する。","イ":"旅行者が、風説を流布し、偽計を用い若しくは威力を用いて旅行業者の信用を毀損し若しくは業務を妨害する行為又はこれらに準ずる行為を行ったときは、旅行業者は、契約の締結に応じないことがある。","ウ":"旅行業者が電話による契約の予約を受け付け、予約の承諾の旨を通知した場合において、旅行者が所定の期間内に申込金を提出しない場合又は会員番号等を通知しない場合は、旅行業者は、予約がなかったものとして取り扱う。","エ":"通信契約を締結しようとする場合であって、旅行者の有するクレジットカードが無効である等、旅行代金等に係る債務を提携会社のカード会員規約に従って決済できないときは、旅行業者は、契約の締結に応じないことがある。"},"answer":["ア"],"explain":"通信契約は、承諾する旨の通知が旅行者に到達した時（電子承諾通知の場合は旅行者の使用する通信機器に記録された時）に成立します。「発した時」ではありません。"},{"no":"(4)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「契約書面の交付」「確定書面」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、確定書面を交付する場合において、旅行者から旅行開始日の前日から起算してさかのぼって7日目に当たる日以降に契約の申込みがなされた場合、旅行開始日までの契約書面に定める日までに、確定書面を旅行者に交付する。","イ":"旅行業者は、契約書面に確定された旅行日程、運送若しくは宿泊機関の名称のすべてを記載した場合は、あらためて確定書面を交付することを要しない。","ウ":"契約書面とは、旅行業者が旅行者と契約を締結しようとするときに、当該旅行者に対して交付する書面をいう。","エ":"旅行業者が旅行者に確定書面を交付した場合には、旅行業者が契約により手配し旅程を管理する義務を負う旅行サービスの範囲は、当該確定書面に記載するところに特定される。"},"answer":["ウ"],"explain":"契約書面は「契約を締結したとき、速やかに」交付する書面です。締結しようとするときに交付するのは取引条件説明書面です。"},{"no":"(5)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「契約内容の変更」「旅行代金の額の変更」「旅行者の交替」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"利用する運送機関の運賃・料金が、著しい経済情勢の変化等により、旅行の募集の際に明示した時点の適用運賃・料金に比べて、通常想定される程度を大幅に超えて増額される場合においては、旅行業者は、その増額される金額の範囲内で旅行代金の額を増加することができる。","イ":"A市からB市への移動に際し、契約書面に記載した利用予定の航空便が運休になり、旅行の安全かつ円滑な実施を図るためやむを得ずA市に宿泊することになった場合において、費用の増加が生じたときは、旅行業者は、理由を説明し、その増加する費用の範囲内において旅行代金の額を変更することがある。","ウ":"旅行業者の承諾を得て、契約上の地位を譲り受けた第三者は、当該旅行者の契約に関する一切の権利及び義務を承継するものとする。","エ":"旅行業者の関与し得ない事由が生じた場合において、旅行の安全かつ円滑な実施を図るためやむを得ないときは、旅行業者は、旅行者にあらかじめ速やかに理由等を説明し、かつ、旅行者の承諾を得た後でなければ契約の内容を変更することができない。"},"answer":["エ"],"explain":"関与し得ない事由による契約内容の変更には旅行者の承諾は不要です。あらかじめ説明する余裕がないときは、変更後に速やかに説明すれば足ります。"},{"no":"(6)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行者の解除権」に関する次の記述のうち、旅行者が旅行開始前に契約を解除するに当たって、取消料の支払いを要するものをすべて選びなさい（いずれも取消料の支払いを要する期間内の解除とする。）。","choices":{"ア":"旅行者が集合場所へ向かうために利用した交通機関が大幅に遅延したことにより、確定書面記載の出発時刻に間に合わず参加が不可能となったことから、遅延証明書の交付を受け、旅行業者に申し出たとき。","イ":"東京駅から新大阪駅までの利用列車として「新幹線のぞみ号 グリーン車利用」と契約書面に記載されていたが、旅行業者の手配ミスにより、「新幹線のぞみ号 普通車指定席」に変更されたとき。","ウ":"契約書面に「Aレストランでイタリア料理の昼食」と記載されていたが、旅行業者によって「Bレストランでイタリア料理の昼食」に変更されたとき。","エ":"契約書面には「A航空 羽田空港発 宮古空港行き 直行便利用」と記載されていたが、直行便が運航中止になり、確定書面では、同じA航空の羽田空港発 那覇空港乗継ぎ 宮古空港行きに変更されたとき。"},"answer":["ア","エ"],"explain":"契約内容の重要な変更（別表第二に掲げる変更）があった場合は取消料なしで解除できます。イは運送機関の等級・設備のより低いものへの変更、ウはレストランを含む目的地の変更で、いずれも重要な変更に当たります。エは出発地・到着地の空港も航空会社も同じで重要な変更に当たらず、アは旅行者側の事情のため、いずれも取消料が必要です。"},{"no":"(7)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の解除権等－旅行開始前の解除」に関する次の記述のうち、旅行開始前に解除できないものを1つ選びなさい（いずれも解除に係る旅行者への理由の説明は行うものとする。）。","choices":{"ア":"スキーを目的とする国内旅行における必要な降雪量等の旅行実施条件であって契約の締結の際に明示したものが成就しないおそれが極めて大きいとき。","イ":"旅行者が病気、必要な介助者の不在その他の事由により、当該旅行に耐えられないと認められるとき。","ウ":"1泊2日の国内旅行において、参加する旅行者の数が契約書面に記載した最少催行人員に達しなかったため、当該旅行を中止する旨を旅行開始日の前日から起算してさかのぼって13日目に当たる日に旅行者に通知したとき。","エ":"天災地変等、旅行業者の関与し得ない事由が生じた場合において、契約書面に記載した旅行日程に従った旅行の安全かつ円滑な実施が不可能となり、又は不可能となるおそれが極めて大きいとき。"},"answer":["ウ"],"explain":"最少催行人員に達しない場合の中止通知は、宿泊を伴う国内旅行では旅行開始日の前日から起算してさかのぼって13日目に当たる日より前（日帰りは3日目に当たる日より前）に行う必要があります。13日目当日の通知では解除できません。"},{"no":"(8)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の解除権－旅行開始後の解除」に関する次の記述のうち、誤っているものを1つ選びなさい（いずれも解除に係る旅行者への理由説明は行うものとする。）。","choices":{"ア":"旅行業者は、天災地変等の関与し得ない事由により旅行の継続が不可能となったことから契約の一部を解除したときは、旅行代金のうち旅行者がいまだ提供を受けていない旅行サービスに係る金額から、既に支払い又は支払わなければならない取消料等を差し引いたものを旅行者に払い戻す。","イ":"旅行業者は、航空機の欠航により旅行の継続が不可能となったときは、契約の一部を解除することがある。","ウ":"旅行業者は、旅行者が病気、必要な介助者の不在その他の事由により旅行の継続に耐えられないときは、契約の一部を解除することがある。","エ":"旅行者が添乗員その他の者による旅行業者の指示への違背により団体行動の規律を乱し、旅行の安全かつ円滑な実施を妨げる場合において、旅行業者が契約の一部を解除したときは、旅行者がいまだ提供を受けていない旅行サービスに関する旅行業者の債務については、有効な弁済がなされたものとする。"},"answer":["エ"],"explain":"旅行者の責めに帰すべき事由による旅行開始後の解除であっても、いまだ提供を受けていない旅行サービス分は取消料等を差し引いて払い戻されます。債務が有効に弁済されたものとみなす規定はありません。"},{"no":"(9)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行代金の払戻し」「契約解除後の帰路手配」に関する次の記述のうち、正しいものをすべて選びなさい。","choices":{"ア":"旅行開始後に旅行業者が契約の一部を解除した場合において、払い戻すべき金額が生じたときは、旅行業者は、契約書面に記載した旅行終了日の翌日から起算して30日以内に旅行者に対し当該金額を払い戻す。","イ":"旅行業者は、旅行者が病気、必要な介助者の不在その他の事由によって旅行開始後に契約を解除したときは、旅行者の求めに応じて出発地に戻るために必要な旅行サービスの手配を引き受けるが、この場合、出発地に戻るための旅行に要する一切の費用は旅行者の負担とする。","ウ":"旅行業者の過失により契約書面に記載した旅行日程に従った旅行の実施が不可能になり旅行者が旅行開始前に契約を解除したとき、旅行業者は、既に収受している旅行代金を所定の期日までに払い戻すことにより、損害賠償責任を免れる。","エ":"旅行業者は、通信契約が解除された場合であって払い戻すべき金額が生じたときは、カード会員規約に従って払い戻すが、旅行開始後の解除による払戻しにあっては旅行終了日の翌日から起算して30日以内に払い戻すべき額を通知するものとし、当該通知を行った日をカード利用日とする。"},"answer":["ア","イ","エ"],"explain":"ウは、旅行代金を払い戻しても旅行業者の責任に基づく損害賠償責任は免れません。ア・イ・エはいずれも約款どおりの取扱いです。"},{"no":"(10)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅程管理」「旅行業者の指示」「添乗員等の業務」「保護措置」に関する次の記述のうち、誤っているものをすべて選びなさい。","choices":{"ア":"旅行者は、旅行開始後旅行終了までの間において、団体で行動するときは、旅行を安全かつ円滑に実施するための旅行業者の指示に従わなければならない。","イ":"旅行業者は、宿泊を伴うすべての国内旅行に添乗員その他の者を同行させ、旅程管理業務その他当該旅行に付随して旅行業者が必要と認める業務の全部又は一部を行わせなければならない。","ウ":"旅行業者は、旅行中の旅行者が、疾病、傷害等により保護を要する状態にあると認めたときは、必要な措置を講ずることがある。この場合において、当該措置に要した費用は、旅行業者の責任の有無にかかわらず、旅行業者が負担する。","エ":"旅行業者は、旅程管理の措置を講じたにもかかわらず契約内容を変更せざるを得ないときは代替サービスの手配を行うが、変更後の旅行サービスが当初のものと同様となるよう努める等、契約内容の変更を最小限にとどめるよう努力する。"},"answer":["イ","ウ"],"explain":"イは添乗員の同行は義務ではなく、同行の有無を契約書面に記載します。ウの保護措置に要した費用は、旅行業者の責めに帰すべき事由がある場合を除き旅行者の負担です。"},{"no":"(11)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の責任」「旅行者の責任」に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者は、契約の履行に当たって、旅行業者の過失により旅行者に損害（手荷物について生じた損害を除く。）を与えたときは、損害発生の翌日から起算して1年以内に通知があったときに限り、その損害を賠償する責めに任じる。","イ":"旅行業者は、契約の履行にあたって、手配代行者の重大な過失により旅行者の手荷物に損害を与えたときは、旅行者1名につき15万円を限度として賠償する。","ウ":"旅行者の過失により旅行業者が損害を被った場合でも、その過失が重大なものでないときは、当該旅行者はその損害を賠償する責に任じない。","エ":"旅行者は、旅行開始後において、契約書面に記載された旅行サービスを円滑に受領するため、万が一契約書面と異なる旅行サービスが提供されたと認識したときは、旅行地において速やかにその旨を旅行業者、手配代行者又は当該旅行サービス提供者に申し出なければならない。"},"answer":["エ"],"explain":"アの通知期間は損害発生の翌日から起算して2年以内です。イは故意又は重大な過失がある場合は15万円の限度額が適用されません。ウは軽過失であっても旅行者は損害を賠償する責任を負います。"},{"no":"(12)","group":"標準旅行業約款（受注型企画旅行）","prompt":"受注型企画旅行契約の部に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"「企画書面」とは、旅行業者が、参加する旅行者の募集のためにあらかじめ、旅行の目的地及び日程、サービスの内容、旅行代金その他の旅行条件に関する企画の内容を記載した書面をいう。","イ":"旅行業者は、旅行中の旅行者が疾病、傷害等により保護を要する状態にあると認めたときは、必要な措置を講ずることがあるが、当該措置に要した費用は、旅行業者の責任の有無にかかわらず、旅行業者が負担する。","ウ":"宿泊を伴う国内旅行（貸切船舶を利用する場合を除く。）において、旅行業者が契約書面に旅行代金の内訳として企画料金の金額を明示した場合において、旅行者が自己都合により旅行開始日の前日から起算してさかのぼって21日目に当たる日より前に契約を解除するときは、企画料金に相当する金額の取消料を支払って契約を解除することができる。","エ":"旅行業者は、企画書面において旅行代金の内訳として企画料金の金額を明示した場合は、契約書面に当該金額の明示を要しない。"},"answer":["ウ"],"explain":"受注型では、企画料金を明示していれば、通常の取消料発生期間より前の解除についても企画料金相当額を取消料として収受できます。アの企画書面は受注型で旅行者の依頼に応じて作成する書面です。イの保護措置費用は原則旅行者負担、エは契約書面にも明示が必要です。"},{"no":"(13)","group":"標準旅行業約款（受注型企画旅行）","prompt":"受注型企画旅行契約の部に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者と契約を締結した旅行者は、旅行業者の承諾を得て、契約上の地位を第三者に譲り渡すことができる。","イ":"国内旅行で利用する旅館の宿泊料金が、著しい経済情勢の変化等により、契約を締結した時点のものに比べて、通常想定される程度を大幅に超えて増額されたときは、旅行業者は、所定の期日までにその旨を旅行者に通知して旅行代金の額を増額することができる。","ウ":"旅行者は、旅行業者に対し、旅行日程、旅行サービスの内容その他の契約の内容を変更するよう求めることができる。この場合において、旅行業者は、可能な限り旅行者の求めに応じる。","エ":"旅行業者は、団体・グループ契約において、契約責任者が構成者に対して現に負い、又は将来負うことが予測される債務又は義務については、何らの責任を負うものではない。"},"answer":["イ"],"explain":"経済情勢の変化等による旅行代金の増額が認められるのは、利用する運送機関の運賃・料金が大幅に改定された場合です。宿泊料金の値上げを理由に旅行代金を増額することはできません。"},{"no":"(14)","group":"標準旅行業約款（旅程保証）","prompt":"募集型・受注型企画旅行契約の部「旅程保証」に関する次の記述のうち、誤っているものを1つ選びなさい（変更補償金を支払う場合、その額は約款が定める最低額を上回っているものとする。）。","choices":{"ア":"旅行業者が、契約内容の重要な変更が生じたことにより変更補償金を支払った後、当該変更について旅行業者に責任が発生することが明らかになった場合には、旅行業者は当該変更に係る変更補償金に加え損害賠償金を支払わなければならない。","イ":"旅行業者が、変更補償金の支払いが必要となる契約内容の重要な変更が1件生じたことを旅行開始日に旅行者に通知した場合、旅行業者は、旅行代金に約款に定める旅行開始後の1件あたりの率を乗じた額以上の変更補償金を旅行者に対して支払う。","ウ":"旅行業者は、契約内容の重要な変更が生じた場合であって、当該変更が手配代行者の過失によるものであることが明らかなときは、旅行者に対して変更補償金を支払わない。","エ":"確定書面に記載した宿泊予定の旅館の過剰予約受付により、旅行開始前に旅行業者が当該旅館を他の旅館に変更したため、旅行者が契約を解除した場合、旅行業者は当該旅行者に対して変更補償金を支払わない。"},"answer":["ア"],"explain":"変更補償金を支払った後に旅行業者の責任が明らかになったときは、既に支払った変更補償金は損害賠償金の一部とみなされます。両方を重ねて支払うわけではありません。"},{"no":"(15)","group":"標準旅行業約款（旅程保証）","prompt":"募集型・受注型企画旅行契約の部「旅程保証」に関する次の記述のうち、変更補償金の支払いを要するものを1つ選びなさい（変更補償金を支払う場合、その額は約款が定める最低額を上回っているものとする。）。","choices":{"ア":"確定書面に「新千歳空港発 福岡空港行きA航空直行便」と記載していたが、航空会社の過剰予約受付により、「A航空の新千歳空港発羽田空港乗り継ぎで福岡空港着」に変更したとき。","イ":"確定書面に「北陸新幹線かがやき号普通車指定席」と記載していたが、旅行開始後、乗車する列車の車両故障により、後続の「北陸新幹線はくたか号自由席」に変更したとき。","ウ":"確定書面に「Aホテル」利用と記載していたが、当該ホテルが集中豪雨の影響によって建物の一部が浸水したために客室の一部が使用できなくなり、営業しているにもかかわらず客室に不足が生じ、契約書面に記載のある「Bホテル」に変更したとき。","エ":"確定書面には「第2日目：A公園を散策」と記載されていたが、実際にはA公園の散策を第3日目に変更したとき。"},"answer":["ウ"],"explain":"ウは宿泊機関の変更であり、当該ホテルが営業しているため「運送・宿泊機関等のサービス提供の中止」という免責事由にも当たらず、変更補償金の対象です。アは出発地・到着地の空港も航空会社も同じで対象となる変更に当たらず、イは車両故障による運送サービスの中止で免責、エは同一日程内の順序変更で対象外です。"},{"no":"(16)","group":"標準旅行業約款（特別補償）","prompt":"募集型・受注型企画旅行契約の部「特別補償」「特別補償規程」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、添乗員、使用人又は代理人による解散の告知が行われない場合であって、旅行日程に定める最後の運送・宿泊機関等が鉄道である場合、旅行者が列車降車後、駅改札へ向かうホームの階段で足を踏み外し傷害を被り入院したときは、特別補償規程に定める入院見舞金を支払わない。","イ":"旅行業者が損害賠償責任を負うときは、その責任に基づいて支払うべき損害賠償金の額の限度において、旅行業者が支払うべき特別補償規程に定める補償金は、当該損害賠償金とみなす。","ウ":"旅行業者が損害補償金を支払うべき携帯品の損害について、旅行者が第三者に対して損害賠償請求権を有する場合には、その損害賠償請求権は、旅行業者が支払った損害補償金の額の限度内で、旅行業者に移転する。","エ":"旅行者があらかじめ定められた企画旅行の行程から離脱する場合において、離脱及び復帰の予定日時をあらかじめ旅行業者に届け出ていたときは、離脱の時から復帰の予定の時までの間は「企画旅行参加中」とする。"},"answer":["ア"],"explain":"最後の運送機関が鉄道の場合、「企画旅行参加中」は改札口を出た時までです。ホームの階段での傷害はまだ参加中の事故に当たるため、入院見舞金の支払対象となります。"},{"no":"(17)","group":"標準旅行業約款（特別補償）","prompt":"募集型・受注型企画旅行契約の部「特別補償規程」に関する次の記述のうち、入院見舞金、通院見舞金又は携帯品損害補償金の支払いの対象となるものを1つ選びなさい。","choices":{"ア":"バスセンター待合室の座席に置き忘れて行方不明となったショルダーバック","イ":"旅行日程に定められた自由行動中に盗難にあったクレジットカード","ウ":"国内企画旅行参加中に発生した地震により被った傷害による3日間の入院","エ":"企画旅行の日程に含まれているハンググライダー搭乗中、離陸の際に発生した事故によって被った傷害の治療のための10日間の入院"},"answer":["エ"],"explain":"ハンググライダー等の危険なスポーツによる傷害は原則対象外ですが、旅行日程に含まれている場合は補償の対象になります。アの置き忘れ・紛失は対象外、イのクレジットカードや現金等は補償対象品から除外、ウの国内旅行中の地震による傷害は対象外です（海外旅行は対象）。"},{"no":"(18)","group":"標準旅行業約款（手配旅行）","prompt":"手配旅行契約の部に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行者が、旅行業者に対して暴力的な要求行為、不当な要求行為、取引に関して脅迫的な言動若しくは暴力を用いる行為を行ったときは、契約の締結に応じないことがある。","イ":"旅行業者は、団体・グループ手配において、旅行開始後に契約責任者から構成者の変更の申出があった場合、これに応じない。","ウ":"旅行業者は、手配旅行契約の履行に当たっては、本邦内の旅行サービスの手配についてのみ、手配の全部又は一部を他の旅行業者、手配を業として行う者その他の補助者に代行させることができる。","エ":"旅行業者は、運送・宿泊機関等の運賃・料金の改訂その他の事由により旅行代金を増額するときは、旅行開始日の前日から起算してさかのぼって15日目に当たる日より前に旅行者にその旨を通知しなければならない。"},"answer":["ア"],"explain":"反社会的な要求行為等は契約締結の拒否事由です。イは可能な限り構成者の変更に応じます。ウは本邦外の手配も代行させることができます。エは旅行開始前に通知すればよく、15日前という制限はありません。"},{"no":"(19)","group":"標準旅行業約款（手配旅行）","prompt":"手配旅行契約の部に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行者が所定の期日までに旅行代金を支払わないことから旅行業者が契約を解除したときは、旅行者は、取消料、違約料その他運送・宿泊機関等に支払う費用を負担するほか、旅行業者に対し、所定の取消手続料金及び旅行業者が得るはずであった旅行業務取扱料金を支払わなければならない。","イ":"「旅行代金」とは、旅行業者が旅行サービスを手配するために、運賃、宿泊料その他の運送・宿泊機関等に対して支払う費用のみをいう。","ウ":"旅行業者が善良な管理者の注意をもって宿泊サービスの手配をしたときは、手配旅行契約に基づく旅行業者の債務の履行は終了し、満員との事由によって契約を締結できなかった場合であっても、旅行者は旅行業者所定の旅行業務取扱料金を支払わなければならない。","エ":"旅行業者は、運送サービスの手配のみを目的とする契約であって、旅行代金と引換えに当該運送サービスの提供を受ける権利を表示した書面を交付するものについては、口頭による申込みを受け付けることがあり、この場合、契約は、旅行業者が契約の締結を承諾した時に成立するものとする。"},"answer":["イ"],"explain":"手配旅行の「旅行代金」には、運送・宿泊機関等に支払う費用のほか、旅行業者所定の旅行業務取扱料金（手配手数料）が含まれます。"},{"no":"(20)","group":"標準旅行業約款（旅行相談）","prompt":"旅行相談契約の部に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者は、旅行者の相談内容が旅行地において施行されている法令に違反するおそれがあるとの理由だけでは、契約の締結を拒否することはできない。","イ":"旅行業者が契約に基づき作成した旅行の計画に記載した運送・宿泊機関等について、満員等の事由によりサービスの提供を受ける契約を締結できなかった場合、旅行業者は、既に収受していた相談料金を旅行者に払い戻さなければならない。","ウ":"旅行業者が、相談料金を収受することを約して、旅行者の委託により旅行地及び運送・宿泊機関等に関する情報提供のみを行う業務を引き受けることは、旅行相談契約に該当する。","エ":"旅行業者は、契約の履行に当たって、故意又は過失により旅行者に損害を与えたときは、その損害発生の翌日から起算して3月以内に文書にて通知があったときに限り、その損害を賠償する責に任じる。"},"answer":["ウ"],"explain":"旅行に関する情報提供のみを行う業務も旅行相談契約に含まれます。アは法令違反のおそれがあるときは締結を拒否できます。イは手配の成否にかかわらず相談料金の払戻し義務はありません。エの通知期間は損害発生の翌日から起算して6月以内です。"},{"no":"2","group":"一般貸切旅客自動車運送事業標準運送約款","prompt":"一般貸切旅客自動車運送事業標準運送約款に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"バス会社は、旅行業者が手配旅行の実施のため、バス会社に旅客の運送を申し込む場合には、当該旅行業者を契約責任者として運送契約を結ぶ。","イ":"旅客が車中で泥酔し、他の旅客の迷惑となるおそれがあることから、バス会社がその後、運送の継続を拒絶したときは、バス会社は当該旅客について当該運送契約に係る運送の全部が終了したものとみなす。","ウ":"バス会社は、乗車券の券面に記載した配車日時に所定の配車をした場合において、天災その他やむを得ない事由による場合を除き、配車時刻から30分を経過しても旅客が乗車についての意思表示をしないときには、当該車両についての当該運送契約に係る運送の全部が終了したものとみなす。","エ":"バス会社は、天災その他当該バス会社の責に帰することができない事由により輸送の安全の確保のため一時的に運行中止その他の措置をしたときであっても、これにより旅客が受けた損害を賠償する責に任じる。"},"answer":["イ"],"explain":"泥酔等により運送を継続しないこととしたときは、その旅客について運送の全部が終了したものとみなされます。アは旅行業者を契約責任者とするのは企画旅行の場合です。エは自社の責に帰すことができない事由による措置について賠償責任を負いません。ウは約款が定める取扱いと異なります。"},{"no":"3","group":"フェリー標準運送約款","prompt":"海上運送法第9条第3項の規定に基づく標準運送約款（フェリーを含む一般旅客定期航路事業に関する標準運送約款）に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"フェリー会社は、旅客が指定便に係る乗船券について当該指定便の発航後に乗船船便の変更を申し出た場合には、当該乗船券の券面記載の乗船日に発航する他の船便の輸送力に余裕がある場合に限り、当該乗船券による2等船室への乗船変更の取扱いに応じる。","イ":"旅客は、海上運送法に規定する旅客名簿に、事故、災害その他の非常の場合における介助等の支援の要否を記載しなければならない。","ウ":"フェリー会社は、法令の規定によるほか、天災、火災、海難、使用船舶の故障その他のやむを得ない事由が発生した場合、予定した船便の発航の中止又は使用船舶、発着日時、航行経路若しくは発着港の変更の措置をとることがある。","エ":"フェリー会社は、旅客が、船員等の指示に従い、乗船手続き完了時から下船港の乗降施設を離れた時までの間に、その生命又は身体を害した場合は、運送人が運送に関し注意を怠らなかったことを証明した場合を除き、これにより生じた損害について賠償する責任を負う。"},"answer":["エ"],"explain":"運送人が責任を負う期間の起算点が異なります。乗船手続の完了時ではなく、旅客が乗船した時から下船した時までの間が対象です。"},{"no":"4","group":"JR旅客営業規則","prompt":"旅客鉄道会社（JR）の旅客営業規則に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"大口団体とは、専用臨時列車を一口の団体だけで利用する場合（旅客鉄道会社の定める両数以上を利用するときを含む。）の団体旅客をいい、小口団体とは大口団体以外の団体であって、当該団体の構成人員によってA小口団体とB小口団体に区分される。","イ":"旅客は、道路交通法で定める盲導犬であって、当該旅客が盲導犬使用者証を所持し当該盲導犬がハーネスをつけている場合に限って、有料手回り品として車内に随伴することができる。","ウ":"小児の寝台料金は、大人の寝台料金を折半し、10円未満のは数を切り捨てて10円単位とした額とする。","エ":"旅客鉄道会社は、団体乗車券を発売する場合、訪日観光団体については、普通旅客運賃の団体割引率を、第1期1割引、第2期1割5分引とする。"},"answer":["ア"],"explain":"イの盲導犬は無料の手回り品として車内に持ち込めます。ウの小児の寝台料金は大人と同額です。エは訪日観光団体の割引率の定めと異なります。"},{"no":"5","group":"モデル宿泊約款","prompt":"モデル宿泊約款に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"宿泊客が、宿泊中に宿泊契約締結の際に申し出ていた宿泊日を超えて宿泊の継続を申し入れた場合、ホテル（旅館）は、その申し出がなされた時点で新たな宿泊契約の申し込みがあったものとして処理する。","イ":"ホテル（旅館）が宿泊客に客室を提供し、使用が可能になったのち、宿泊客が任意に宿泊しなかった場合においても、宿泊料金を申し受ける。","ウ":"宿泊客がチェックアウトしたのち、手荷物又は携帯品がホテル（旅館）に置き忘れられていた場合において、その所有者が判明したときは、ホテル（旅館）は当該所有者に連絡をするとともにその指示を求めるものとする。ただし、所有者の指示がない場合又は所有者が判明しないときは、発見日を含め7日間保管し、その後最寄りの警察署に届ける。","エ":"宿泊客がホテル（旅館）の駐車場を利用する場合、車両のキーの寄託の如何にかかわらず、当該ホテル（旅館）は場所を貸すものであって、いかなる場合も車両の管理責任を負わない。"},"answer":["エ"],"explain":"駐車場の利用は、キーの寄託の有無にかかわらず場所を貸すものであって車両の管理責任までは負いませんが、駐車場の管理につきホテル（旅館）に故意又は過失があって損害を与えたときは賠償責任を負うため、「いかなる場合も」負わないとする点が誤りです。"}],[{"no":"1(1)①","group":"貸切バスの運賃","prompt":"次の行程（日帰り）で運行する小型車の貸切バスの運賃について、この行程における時間制運賃を求めるための時間のうち、正しいものはどれか。","material":"＜行程＞\n出庫 9:00 ／ 旅行出発（旅客乗車地点）9:35 ／ 旅行終着（旅客降車地点）15:25 ／ 帰庫 16:00\n・回送区間（出庫から乗車地点まで）　30分・15キロ\n・旅客が実際に乗車する区間　5時間50分（目的地における待機4時間10分を含む）・64キロ\n・回送区間（降車地点から帰庫まで）　30分・15キロ\n（注）旅客の乗降に要する時間はそれぞれ5分。バスは目的地で待機しており、運転者の休息期間としない。","choices":{"ア":"3時間分の時間制運賃が必要である。","イ":"5時間分の時間制運賃が必要である。","ウ":"8時間分の時間制運賃が必要である。","エ":"9時間分の時間制運賃が必要である。"},"answer":["エ"],"explain":"時間制運賃の対象時間は「出庫から帰庫まで」の時間に、出庫前の点呼等1時間と帰庫後の点呼等1時間を加えて算出します。9:00〜16:00の7時間＋2時間＝9時間です。目的地での待機時間も、運転者の休息期間としない限り含めます。"},{"no":"1(1)②","group":"貸切バスの運賃","prompt":"同じ行程について、キロ制運賃を求めるための走行距離のうち、正しいものはどれか。","material":"＜行程＞\n回送区間（出庫→乗車地点）15キロ ／ 旅客乗車区間 64キロ ／ 回送区間（降車地点→帰庫）15キロ","choices":{"ア":"64キロ分のキロ制運賃が必要である。","イ":"70キロ分のキロ制運賃が必要である。","ウ":"94キロ分のキロ制運賃が必要である。","エ":"100キロ分のキロ制運賃が必要である。"},"answer":["エ"],"explain":"キロ制運賃の対象は回送を含む出庫から帰庫までの全走行距離で、15＋64＋15＝94キロです。運賃計算に用いる距離は10キロ単位とし、端数は切り上げるため100キロ分となります。"},{"no":"1(2)","group":"貸切バスの運賃","prompt":"貸切バスによる運送に関する次の記述のうち、誤っているものはどれか（標準運送約款及び関東運輸局長公示による）。","choices":{"ア":"標準的な装備を超える特殊な設備を有する車両については、設備や購入価格等を勘案した割増率を適用する特殊車両割増料金を収受することができる。","イ":"配車日時が8月20日、配車車両数が4台、1台あたりの所定の運賃及び料金の合計額が100,000円の運送契約において、バス会社の都合により8月6日（配車日の14日前）に1台の車両の減少を伴う契約内容の変更をしたときは、当該バス会社は契約責任者に対して20,000円の違約料を支払う。","ウ":"乗船時刻が9時、下船時刻が乗船当日の19時のフェリーボートで貸切バスを航送する場合、時間制運賃を計算するための航送時間の上限は6時間である。","エ":"学校教育法による高等学校に通学する者の団体に対する運賃の割引を2割引とするバス会社において、届け出た運賃の下限額を用いて計算された運賃を所定の運賃とする貸切バスの場合、運賃の割引を適用することはできない。"},"answer":["ウ"],"explain":"フェリー航送中の時間の取扱いについて、上限を6時間とする定めはなく、公示が定める取扱いと異なります。イは配車日の14日前から8日前までの変更・解除に対する違約料20％（100,000円×20％＝20,000円）で正しく、エは下限額で計算した運賃にさらに割引を適用することはできません。"},{"no":"2","group":"フェリーの運賃","prompt":"旅客がフェリーで片道乗船する場合において、旅客が支払うべき運賃の総額について、資料に基づき、正しいものを1つ選びなさい。","material":"＜資料＞\n①車の長さ5ｍ以上6ｍ未満の自動車航送運賃（片道）1台 10,000円\n②2等船室の旅客運賃（片道）大人1人 1,000円／小児1人 500円\n③2等指定制椅子席の旅客運賃（片道）大人1人 1,800円／小児1人 900円\n④自転車の特殊手荷物運賃（片道）1台 1,200円\n（注）貸切ジャンボタクシーの長さは約5.4ｍ、運転手は1人。年齢は乗船日現在。","choices":{"ア":"自転車1台と自転車の運送申込人（大人）1人が2等指定制椅子席を利用して乗船するとき　1,200円＋1,800円＝3,000円","イ":"貸切ジャンボタクシー1台、2等指定制椅子席を5席「大人3人、3歳の小児1人、2歳の小児1人」利用、2等船室を1人「運転手」が利用して乗船するとき　10,000円＋1,800円×3人＋900円＝16,300円","ウ":"貸切ジャンボタクシー1台、2等指定制椅子席を5席「大人3人、4歳の小児1人、運転手1人」利用、座席を利用しない1歳の小児1人が乗船するとき　10,000円＋1,000円＋1,800円×3人＋900円＝17,300円","エ":"自転車1台と自転車の運送申込人（大人）1人が2等船室を利用して乗船するとき　1,200円"},"answer":["ア"],"explain":"自転車の特殊手荷物運賃には申込人の旅客運賃は含まれないため、1,200円＋2等指定制椅子席1,800円＝3,000円となります（エは旅客運賃が別に必要）。イは座席を使用する小児2人分の運賃が必要です。ウは自動車航送運賃に運転者1人分の2等船室運賃が含まれており、上級船室を使う場合はその差額のみを支払います。"},{"no":"3","group":"宿泊料金","prompt":"宿泊に関する次の記述のうち、資料に基づき、正しいものを1つ選びなさい（モデル宿泊約款による）。","material":"＜資料＞\n●旅館：基本宿泊料 大人1人1泊2食付 30,000円／サービス料10％／消費税10％／入湯税100円（12歳未満は課税免除）\n●ホテル：基本宿泊料 ツインルーム（定員2人）1室 40,000円／サービス料10％／消費税10％／宿泊税1人1泊1,000円／チェックイン14時・チェックアウト10時\n●違約金の比率：3日前 20％／前日 30％","choices":{"ア":"この旅館に大人2人の宿泊客と宿泊期間を2日とする宿泊契約が成立したときの申込金の限度は60,000円である。","イ":"このホテルのツインルームをチェックアウト日の14時まで（超過4時間）使用したときの時間外の客室使用追加料金は20,000円である（サービス料及び消費税の計算は行わない）。","ウ":"この旅館に子供用の食事と寝具の提供を伴う6歳の小学生の子供1人が1泊するとき、宿泊客が支払うべき当該子供の宿泊料金等の総額は16,650円である。","エ":"このホテルのツインルームに大人2人が8月30日に1泊する宿泊契約を、宿泊客の都合により8月29日（前日）に解除したとき、このホテルは26,400円の違約金を申し受ける。"},"answer":["イ"],"explain":"超過3時間までは室料の3分の1、6時間までは2分の1、6時間を超えると室料全額です。超過4時間なので40,000円×50％＝20,000円となります。アの申込金の限度は宿泊期間（3日を超えるときは3日）の基本宿泊料で30,000円×2人×2日＝120,000円。ウは子供料金が大人の70％（21,000円）にサービス料と消費税を加えた25,410円。エの違約金は基本宿泊料40,000円の30％＝12,000円です。"},{"no":"4(1)","group":"JR運賃・料金","prompt":"次の経路による行程で旅客が乗車する場合、大人1人がこの行程を乗車するために必要な普通乗車券に関する記述のうち、正しいものはどれか。","material":"＜行程＞\n①福山駅から岡山駅まで山陽新幹線「のぞみ（指定席）」に乗車\n②岡山駅では改札口を出ないで同日に山陽本線・伯備線「普通列車（自由席）」に乗り継ぎ、備中高梁駅まで乗車\n＜資料＞\n福山－岡山（山陽新幹線）58.3キロ／岡山－倉敷（山陽本線）15.9キロ／岡山－備中高梁（山陽本線・伯備線）49.9キロ\n（注）岡山－倉敷は「分岐駅を通過する列車に乗車する場合の特例」が適用される区間。","choices":{"ア":"「58.3キロ－15.9キロ＋49.9キロ－15.9キロ＝76.4キロ」の乗車距離による乗車券1枚が必要である。","イ":"「58.3キロ＋49.9キロ＝108.2キロ」の乗車距離による乗車券1枚が必要である。","ウ":"「58.3キロ」の乗車券1枚、「49.9キロ－15.9キロ＝34.0キロ」の乗車券1枚の計2枚が必要である。","エ":"「58.3キロ－15.9キロ＝42.4キロ」の乗車券1枚、「49.9キロ－15.9キロ＝34.0キロ」の乗車券1枚の計2枚が必要である。"},"answer":["ア"],"explain":"分岐駅を通過する列車に乗車する場合の特例により、重複する岡山－倉敷間は往復とも運賃計算から除外し、全体を1枚の通し計算にします。58.3－15.9＋49.9－15.9＝76.4キロです。"},{"no":"4(2)","group":"JR運賃・料金","prompt":"次の行程で大人1人が通常期に乗車するために必要な新幹線の特急料金の額について、資料に基づき、正しいものを選びなさい。","material":"＜行程＞\n①新青森→仙台　東北新幹線「はやぶさ（普通車指定席）」\n②仙台では新幹線改札口を出ないで「やまびこ（普通車自由席）」に乗り継ぎ、白石蔵王まで乗車\n③白石蔵王で新幹線改札口を出る\n④白石蔵王→大宮　東北新幹線「やまびこ（普通車指定席）」\n＜資料＞指定席特急料金（通常期・はやて／やまびこ／なすの）\n新青森－仙台 4,830円／新青森－白石蔵王 5,370円／新青森－大宮 6,070円\n仙台－白石蔵王 880円（自由席の特定特急料金）／仙台－大宮 4,830円／白石蔵王－大宮 4,060円\n〔はやぶさ〕新青森－仙台 5,040円","choices":{"ア":"新青森→白石蔵王 5,370円＋（5,040円－4,830円）＝5,580円、白石蔵王→大宮 4,060円、合計9,640円","イ":"新青森→仙台 5,040円、仙台→大宮 4,830円、合計9,870円","ウ":"新青森→仙台 5,040円、仙台→白石蔵王 880円、白石蔵王→大宮 4,060円、合計9,980円","エ":"新青森→大宮 6,070円＋（5,040円－4,830円）＝6,280円"},"answer":["ア"],"explain":"新幹線同士を改札口を出ずに乗り継ぐ場合は1個の列車として通し計算します。新青森－白石蔵王を通しで計算し、はやぶさ利用区間の加算額（5,040円－4,830円＝210円）を加えます。白石蔵王で改札口を出るため、そこから先は別に計算します。"},{"no":"4(3)①","group":"JR団体運賃","prompt":"大人31人、添乗員1人の計32人で構成する普通団体が通常期に次の行程で旅行した。当該団体の運賃の合計額を算出する計算式のうち正しいものはどれか。","material":"＜行程＞9月5日（金）（第2期）\n東京→新潟　上越新幹線「とき」グリーン席　営業キロ333.9キロ（幹線）\n新潟→酒田　特急「いなほ」普通車指定席　営業キロ168.2キロ（幹線）\n（注）当日乗り継ぎ、途中下車なし。団体乗車券は一葉で発売。\n＜資料＞本州3社内の幹線の普通運賃　161〜180キロ 3,080円／321〜340キロ 5,720円／501〜520キロ 8,360円","choices":{"ア":"502.1キロ→8,360円、8,360円×（1－0.1）＝7,524円→7,520円、7,520円×（32人－1人）＝233,120円","イ":"333.9キロ→5,720円、168.2キロ→3,080円、（5,720＋3,080）×（1－0.15）＝7,480円、7,480円×32人＝239,360円","ウ":"333.9キロ→5,720円、168.2キロ→3,080円、（5,720＋3,080）×（1－0.15）＝7,480円、7,480円×（32人－1人）＝231,880円","エ":"502.1キロ→8,360円、8,360円×（1－0.15）＝7,106円→7,100円、7,100円×（32人－1人）＝220,100円"},"answer":["エ"],"explain":"運賃は乗り継ぎ全区間を通した営業キロ502.1キロで計算し8,360円。普通団体（第2期）の割引率15％を適用し、10円未満は切り捨てて7,100円。31人から50人までの団体は添乗員1人が無賃扱いとなるため31人分を乗じます。"},{"no":"4(3)②","group":"JR団体運賃","prompt":"同じ団体について、料金の合計額を算出する計算式のうち正しいものはどれか。","material":"＜資料＞料金表\n東京－新潟　指定席特急料金（通常期）5,040円／グリーン料金 4,190円\n新潟－酒田　指定席特急料金（通常期）2,290円","choices":{"ア":"（5,040円－530円＋4,190円）＋2,290円＝10,990円、10,990円×（1－0.15）＝9,341.5円→9,340円、9,340円×（32人－1人）＝289,540円","イ":"（5,040円－530円＋4,190円）＋2,290円＝10,990円、10,990円×（1－0.15）＝9,341.5円→9,340円、9,340円×32人＝298,880円","ウ":"（5,040円－530円＋4,190円）＋2,290円＝10,990円、10,990円×（32人－1人）＝340,690円","エ":"（5,040円＋4,190円）＋2,290円＝11,520円、11,520円×（32人－1人）＝357,120円"},"answer":["ウ"],"explain":"団体割引が適用されるのは運賃だけで、特急料金やグリーン料金には割引がありません。グリーン車を利用する区間は指定席特急料金から530円を差し引きます。添乗員1人は料金も無賃扱いのため31人分です。"},{"no":"4(4)","group":"JR払いもどし","prompt":"JRの乗車券類の払いもどしに関する次の記述のうち、正しいものはどれか（駅で現金購入、旅客の都合による変更は一度もされていないものとする）。","choices":{"ア":"自由席特急料金が5,930円の東海道・山陽新幹線の自由席特急券を所持する旅客が、到着時刻13時05分の新幹線に乗車後、JRの都合により16時05分に到着したため払いもどしを請求した。この場合の払いもどされる額は5,710円である。","イ":"9月10日の在来線特急列車のグリーン車に乗車するための特急券とグリーン券が1枚で発行された指定券「4,800円（特急料金2,000円・グリーン料金2,800円）」を所持する旅客が、9月8日に払いもどしを請求した場合の払いもどされる額は4,120円である。","ウ":"8月25日から有効な1,320円の小児普通乗車券を8月24日に払いもどす場合の払いもどされる額は1,100円である。","エ":"使用開始後の在来線普通車指定席特急券は、不乗区間の営業キロが200キロを超えている場合に限り、収受額からすでに乗車した区間の特急料金と手数料340円を差し引いた残額が払いもどされる。"},"answer":["ウ"],"explain":"有効期間の開始前に払いもどす乗車券の手数料は220円なので、1,320円－220円＝1,100円です。アは2時間以上の延着なので特急料金は全額払いもどされます。イの指定券は乗車日の2日前までの払いもどしで手数料340円なので4,460円です。エの使用開始後の特急券は原則として払いもどしされません。"}]],"R6":[[{"no":"(1)","prompt":"次の記述のうち、法第1条「目的」に定められているものをすべて選びなさい。","choices":{"ア":"旅行業等を営む者の組織する団体の自由な活動の促進","イ":"旅行業等を営む者を通じた訪日外国人旅行者の誘致と観光立国の促進","ウ":"旅行の安全の確保","エ":"旅行業等を営む者の業務の適正な運営の確保"},"answer":["ウ","エ"],"explain":"法第1条は、登録制度の実施、業務の適正な運営の確保、団体の「適正な」活動の促進、営業保証金制度により、取引の公正、旅行の安全、旅行者の利便を増進することを目的としています。アは「自由な活動」としている点が誤りで、イは目的規定にありません。"},{"no":"(2)","prompt":"報酬を得て、次の行為を事業として行う場合、旅行業の登録を受けなければならないものを1つ選びなさい。","choices":{"ア":"観光案内所が、旅行者から依頼を受けて他人が経営する宿泊施設を手配する行為","イ":"ホテル事業者が、航空運送事業者を代理して、旅行者に対し、航空券の発券業務のみを行う行為","ウ":"イベント事業者が、外国の法令に準拠して外国において旅行業を営む者からの依頼を受け、他人が経営する旅館を手配する行為","エ":"査証の取得代行を業としている者が、旅行業者等の依頼を受けて旅行者の査証取得のための手続を代行する行為"},"answer":["ア"],"explain":"旅行者からの依頼で他人が経営する宿泊施設を手配する行為は旅行業に当たります。イは運送機関を代理して乗車券類を販売する行為で旅行業から除かれ、ウは旅行業者からの依頼による手配なので旅行サービス手配業、エは査証手続の代行のみで旅行業務に当たりません。"},{"no":"(3)","prompt":"旅行業及び旅行業者代理業の登録に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業を営もうとする者であって、その業務の範囲が第2種旅行業である者は、主たる営業所の所在地を管轄する都道府県知事に新規登録申請書を提出しなければならない。","イ":"旅行業者が更新登録の申請を行った場合において、有効期間満了の日までに登録行政庁から更新登録をした旨又は更新登録を拒否する旨の通知がないときは、旅行業者は、当該通知があるまでの間、旅行者と旅行業務についての新たな契約を締結することはできない。","ウ":"地域限定旅行業及び旅行業者代理業については、登録の有効期間は定められていない。","エ":"旅行業者代理業を営もうとする者は、その所属旅行業者が第1種旅行業者の場合は観光庁長官に新規登録申請書を提出しなければならない。"},"answer":["ア"],"explain":"第1種のみ観光庁長官、それ以外は都道府県知事が登録行政庁です。イは更新の通知があるまで従前の登録が効力を有します。ウは地域限定旅行業にも5年の有効期間があります（代理業には有効期間がありません）。エは代理業は所属旅行業者の種別にかかわらず都道府県知事です。"},{"no":"(4)","prompt":"登録業務範囲に関する次の記述のうち、誤っているものを1つ選びなさい（いずれも旅行業務取扱管理者の選任要件は満たされているものとする。）。","choices":{"ア":"第3種旅行業者は、訪日外国人旅行者を対象とした本邦内の企画旅行（募集型であって、一の企画旅行ごとに一の拠点区域内において実施されるものに限る。）を実施することができる。","イ":"第1種旅行業者は、本邦外の企画旅行（募集型に限る。）を実施することができる。","ウ":"第2種旅行業者は、本邦外の企画旅行（受注型に限る。）を実施することができる。","エ":"地域限定旅行業者は、本邦外の旅行に関する相談に応ずることはできない。"},"answer":["エ"],"explain":"登録業務範囲の制限は企画旅行・手配旅行に関するもので、旅行相談業務には制限がありません。地域限定旅行業者でも海外旅行の相談に応じられます。"},{"no":"(5)","prompt":"次の記述のうち、旅行業又は旅行業者代理業の登録の拒否事由に該当しないものを1つ選びなさい。","choices":{"ア":"旅行業者代理業を営もうとする者であって、その代理する旅行業を営む者が2以上であるもの","イ":"刑法の規定により罰金の刑に処せられ、その執行を終わり5年を経過していない者","ウ":"旅行業又は旅行業者代理業の登録を取り消され、その取消しの日から5年を経過していない者","エ":"暴力団員による不当な行為の防止等に関する法律第2条第6号に規定する暴力団員でなくなった日から5年を経過しない者"},"answer":["イ"],"explain":"拒否事由となる罰金刑は、旅行業法違反や暴力団関係の一定の罪などに限られます。刑法違反による罰金刑は該当しません。"},{"no":"(6)","prompt":"変更登録等に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"第3種旅行業者がその登録の区分を旅行業者代理業に変更しようとするときは、その主たる営業所の所在地を管轄する都道府県知事に変更登録申請書を提出しなければならない。","イ":"地域限定旅行業者がその商号を変更したときは、その日から30日以内に、登録行政庁に登録事項変更届出書を提出しなければならない。","ウ":"第1種旅行業者が業務の範囲を第2種旅行業に変更しようとするときは、観光庁長官及び当該旅行業者の主たる営業所の所在地を管轄する都道府県知事に変更登録申請書を提出しなければならない。","エ":"第2種旅行業者が主たる営業所の所在地を都道府県の区域を異にする所在地に変更したときは、変更前の主たる営業所の所在地を管轄する都道府県知事に登録事項変更届出書を提出しなければならない。"},"answer":["イ"],"explain":"商号など登録事項の変更は30日以内の変更届出です。アの旅行業から代理業への変更は変更登録の対象ではありません。ウは変更後の業務範囲に応じた登録行政庁（都道府県知事）のみに提出します。エは変更後の所在地を管轄する都道府県知事に提出します。"},{"no":"(7)","prompt":"営業保証金に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"登録行政庁は、旅行業の登録をした場合において、登録の通知を受けた日から14日以内に旅行業者が法第7条第2項の届出をしないときは、その定める7日以上の期間内にその届出をすべき旨の催告をしなければならない。","イ":"旅行業者は、毎事業年度終了後において、その供託している営業保証金の額が所定の額に不足することとなるときは、その不足額を、その終了の日の翌日から100日以内に追加して供託しなければならない。","ウ":"旅行業者は、営業保証金の供託をしたときは、供託物受入れの記載のある供託書の写しを添付して、その旨を登録行政庁に届け出た後でなければ、その事業を開始してはならない。","エ":"営業保証金の供託は、旅行業者の主たる営業所の最寄りの供託所に現金をもって供託しなければならない。"},"answer":["エ"],"explain":"営業保証金は現金のほか、国債証券や地方債証券その他の有価証券でも供託することができます。"},{"no":"(8)","prompt":"法第11条の2「旅行業務取扱管理者の選任」に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"第3種旅行業者を所属旅行業者とする旅行業者代理業者の営業所において、旅行業務を取り扱う者が1人である場合、当該所属旅行業者によって選任された旅行業務取扱管理者が、当該旅行業者代理業者の営業所の旅行業務取扱管理者を兼任することができる。","イ":"第1種旅行業者は、本邦内の旅行のみについて旅行業務を取り扱う営業所であっても、総合旅行業務取扱管理者試験に合格した者を旅行業務取扱管理者に選任しなければならない。","ウ":"旅行業者等は、その営業所の旅行業務取扱管理者として選任した者の全てが欠けるに至ったときは、新たに旅行業務取扱管理者を選任するまでの間は、その営業所では手配旅行契約以外の旅行業務に関し旅行者と契約を締結することができない。","エ":"旅行業者等は、旅行業務取扱管理者について、苦情の解決に関する講習を受けさせるよう努めなければならない。"},"answer":["エ"],"explain":"苦情の解決に関する講習を受けさせる努力義務が定められています。アは営業所ごとに選任が必要、イは国内のみなら国内（地域限定）管理者で足り、ウは手配旅行契約を含むすべての契約を締結できません。"},{"no":"(9)","prompt":"次の記述のうち、旅行業務取扱管理者の職務として定められているものをすべて選びなさい。","choices":{"ア":"旅行に関する苦情の処理に関する事項","イ":"法第12条の5の規定による書面の交付に関する事項","ウ":"法第12条の6の規定による外務員の証明書携帯等に関する事項","エ":"法第12条の2第3項の規定による旅行業約款の掲示及び備置きに関する事項"},"answer":["ア","イ","エ"],"explain":"外務員の証明書携帯は旅行業務取扱管理者の職務として定められていません。苦情処理、契約書面の交付、約款の掲示・備置きはいずれも職務です。"},{"no":"(10)","prompt":"旅行者から収受する旅行業務の取扱いの料金（企画旅行に係るものを除く。）に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者は、旅行業務の取扱いの料金を変更したときは、その日から7日以内に、登録行政庁に変更届出書を提出しなければならない。","イ":"旅行業者代理業者は、事業の開始前に、旅行者から収受する旅行業務の取扱いの料金を自ら定めなければならない。","ウ":"旅行業務の取扱いの料金は、契約の種類及び内容に応じて定率、定額その他の方法により定められ、旅行者にとって明確でなければならない。","エ":"旅行業者は、旅行業務の取扱いの料金をその営業所において旅行者が閲覧することができるように備え置かなければならない。"},"answer":["ウ"],"explain":"料金は定率・定額その他の方法で、旅行者にとって明確に定めます。アの届出義務はなく、イは代理業者は所属旅行業者の料金により、エは備置きではなく旅行者に見やすいように掲示する必要があります。"},{"no":"(11)","prompt":"旅行業約款に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者等は、旅行業約款をその営業所において、旅行者に見やすいように掲示し、又は旅行者が閲覧することができるように備え置かなければならない。","イ":"旅行業者等は、他の旅行業者を代理して企画旅行契約を締結することができる者にあっては、当該他の旅行業者の旅行業約款をその営業所において、旅行者に見やすいように掲示し、又は閲覧することができるように備え置かなければならない。","ウ":"旅行業協会の保証社員である旅行業者は、旅行業約款に記載されている弁済業務保証金からの弁済限度額を変更しようとする場合は、旅行業協会に対し当該約款の変更の届出を行う必要がある。","エ":"観光庁長官及び消費者庁長官が標準旅行業約款を定めて公示した場合において、旅行業者が、標準旅行業約款と同一の旅行業約款を定めたときは、その旅行業約款については、観光庁長官の認可を受けたものとみなす。"},"answer":["ウ"],"explain":"弁済限度額は旅行業約款の記載事項であり、その変更は登録行政庁の認可を受けるべき約款の変更に当たります。旅行業協会への届出では足りません。"},{"no":"(12)","prompt":"旅行業者等が旅行業務に関し旅行者と契約を締結しようとするときの取引条件の説明及びその際に交付する書面に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者等は、企画旅行（募集型に限る。）の参加者数があらかじめ企画者が定める人員数を下回った場合に当該企画旅行を実施しないこととするときは、その旨及び当該人員数を説明しなければならない。","イ":"旅行業者等は、旅行者に対して対価と引換えに法第12条の5に規定するサービスの提供を受ける権利を表示した書面を交付する場合は、旅行者に対し国土交通省令・内閣府令で定める事項について説明を要しない。","ウ":"旅行業者等は、企画旅行契約を締結しようとするときは、書面に当該契約に係る旅程管理業務を行う者の氏名を記載しなければならない。","エ":"旅行業者は、旅行に関する相談に応ずる行為に係る旅行業務について契約を締結しようとする場合は、旅行者に対し書面の交付を要しない。"},"answer":["ア"],"explain":"最少催行人員は取引条件の説明事項です。イは乗車券類等を交付する場合でも説明は必要（書面交付が不要になるだけ）、ウは旅程管理業務を行う者の氏名は記載事項ではなく、エは相談契約でも取引条件の説明と書面交付が必要です。"},{"no":"(13)","prompt":"次の記述のうち、旅行業者等が旅行者と企画旅行契約を締結したときに交付する書面の記載事項として定められているものをすべて選びなさい。","choices":{"ア":"旅行の目的地を勘案して、旅行者が取得することが望ましい安全及び衛生に関する情報がある場合にあっては、その旨及び当該情報","イ":"旅行に参加する資格を定める場合にあっては、その旨及び当該資格","ウ":"旅程管理業務を行う者が同行しない場合にあっては、旅行地における企画者との連絡方法","エ":"契約締結の年月日"},"answer":["ア","イ","ウ","エ"],"explain":"いずれも契約書面の記載事項として定められています。契約書面には、契約締結の年月日や旅行業務取扱管理者の氏名など、取引条件説明書面と共通する事項に加えて締結後に確定する事項も記載します。"},{"no":"(14)","prompt":"旅行業務取扱管理者の証明書の提示、外務員の証明書携帯等に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"外務員とは、勧誘員、販売員、外交員その他いかなる名称を有する者であるかを問わず、旅行業者等の役員又は使用人のうち、その営業所以外の場所でその旅行業者等のために旅行業務について取引を行う者をいう。","イ":"旅行業務取扱管理者は、旅行者から請求があったときは、国土交通省令で定める様式による証明書を提示しなければならない。","ウ":"外務員は、旅行者が悪意であったときを除き、その所属する旅行業者等に代わって、旅行者との旅行業務に関する取引についての一切の裁判外の行為を行う権限を有するものとみなされる。","エ":"第1種旅行業者以外の旅行業者等の外務員の証明書は、その主たる営業所の所在地を管轄する都道府県知事が発行する。"},"answer":["エ"],"explain":"外務員の証明書は、登録行政庁ではなく、その外務員が所属する旅行業者等が発行します。"},{"no":"(15)","prompt":"企画旅行に参加する旅行者を募集するための広告に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"企画旅行の参加者数があらかじめ企画者が定める人員数を下回った場合に当該企画旅行を実施しないこととするときは、その旨及び当該人員数を表示しなければならない。","イ":"広告には、旅程管理業務を行う者の同行の有無を表示しなければならない。","ウ":"企画者以外の者の氏名又は名称を表示する場合にあっては、文字の大きさ等に留意して、企画者の氏名又は名称の明確性を確保しなければならない。","エ":"広告には、企画旅行を実施する旅行業者が法人である場合にあっては、その代表者の氏名を表示しなければならない。"},"answer":["エ"],"explain":"広告に表示するのは企画者の氏名又は名称、住所及び登録番号で、法人の代表者の氏名は表示事項ではありません。"},{"no":"(16)","prompt":"標識に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者代理業者は、その営業所において、所属旅行業者と同一の標識を公衆に見やすいように掲示しなければならない。","イ":"旅行業者等は、標識に当該旅行業者等が法人である場合にあっては、その代表者の氏名及び選任した旅行業務取扱管理者の氏名を記載しなければならない。","ウ":"旅行業者代理業者は、標識に登録番号、登録年月日並びに登録の有効期間を記載しなければならない。","エ":"旅行業者等は、標識の受託取扱企画旅行の欄に取り扱っている企画旅行の企画者が明確となるよう記載する。"},"answer":["エ"],"explain":"標識には受託取扱企画旅行の欄があり、取り扱う企画旅行の企画者が明確になるよう記載します。アは代理業者は自らの様式の標識を掲示し、イの代表者氏名は記載事項ではなく、ウは代理業の登録には有効期間がありません。"},{"no":"(17)","prompt":"企画旅行の円滑な実施のための措置に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、本邦内の旅行にあっても、旅行地において旅行に関する計画に定めるサービスの提供を受けるために必要な手続の実施その他の措置を必ず講じなければならない。","イ":"旅行業者は、旅行に関する計画における2人以上の旅行者が同一の日程により行動することを要する区間における円滑な旅行の実施を確保するために必要な集合時刻、集合場所その他の事項に関する指示をしなければならない。","ウ":"旅行業者は、本邦外の旅行にあっては、旅行に関する計画に定めるサービスの内容の変更を必要とする事由が生じた場合は、代替サービスの手配及び当該サービスの提供を受けるために必要な手続の実施その他の措置を講じなければならない。","エ":"旅行業者は、旅行に関する計画に定めるサービスの旅行者への確実な提供を確保するために旅行の開始前に必要な予約その他の措置を講じなければならない。"},"answer":["ア"],"explain":"本邦内の旅行については、契約締結前に当該措置を講じない旨を説明し、その旨を記載した書面を交付した場合には、旅行地での手続の実施等の措置を講じなくてもよいとされています。"},{"no":"(18)","prompt":"旅程管理業務を行う者に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者は、個人情報の保護に関する法律に違反し罰金刑に処せられ、その執行を受けることがなくなった日から5年を経過していない者を旅程管理業務を行う主任の者として選任することはできない。","イ":"企画旅行に参加する旅行者に同行して、旅程管理業務を行う者として旅行業者によって選任される者が複数の場合は、当該同行する者のすべてが旅程管理業務を行う主任の者の資格要件を満たす者でなければならない。","ウ":"旅行業者によって選任された旅程管理業務を行う主任の者の指導による旅程管理業務に相当する実務の研修を受けた経験は、当該研修を受けた地域を目的地とする旅行に係る旅程管理業務に従事した経験とみなされる。","エ":"旅行業者は、未成年者を旅程管理業務を行う主任の者として企画旅行に同行させるときは、全ての参加旅行者の承諾を得なければならない。"},"answer":["ウ"],"explain":"主任の者の指導による研修を受けた経験は、その地域を目的地とする旅行の旅程管理業務に従事した経験とみなされます。イは主任の者以外に資格要件はなく、ア・エのような制限は定められていません。"},{"no":"(19)","prompt":"法第13条「禁止行為」及び法第14条「名義利用等の禁止」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者等は、営業の貸渡しその他いかなる方法をもってするかを問わず、旅行業又は旅行業者代理業を他人にその名において経営させてはならない。","イ":"旅行業者等は、旅行者から収受する旅行業務の取扱いの料金については、旅行者から事前に承諾を得たとしても営業所において掲示した料金を超えて料金を収受してはならない。","ウ":"旅行業者等は、旅行業務に関し取引をした者に対し、その取引によって生じた債務の履行をいかなる場合も遅延する行為をしてはならない。","エ":"旅行業者等は、旅行業務に関し取引をする者に対し、その取引に関する重要な事項について、故意に事実を告げず、又は不実のことを告げる行為をしてはならない。"},"answer":["ウ"],"explain":"禁止されているのは債務の履行を「不当に」遅延する行為です。正当な理由による遅延まで禁止されているわけではありません。"},{"no":"(20)","prompt":"受託契約に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者代理業者は、所属旅行業者の事前の承諾により、自ら直接、他の旅行業者と受託契約を締結することができる。","イ":"第2種旅行業者は、地域限定旅行業者の受託旅行業者となることができる。","ウ":"委託旅行業者及び受託旅行業者は、受託契約において、委託旅行業者を代理して企画旅行契約を締結することができる受託旅行業者の営業所を定めておく必要はない。","エ":"旅行業者は、委託旅行業者と受託契約を締結したときは、遅滞なく、登録行政庁にその旨を届け出なければならない。"},"answer":["イ"],"explain":"受託契約は旅行業者の種別を問わず締結でき、第2種旅行業者が地域限定旅行業者の募集型企画旅行を代理販売することもできます。アは代理業者が自ら受託契約を締結することはできず、ウは受託旅行業者の営業所を定める必要があり、エの届出義務はありません。"},{"no":"(21)","prompt":"旅行業者代理業者に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"所属旅行業者は、旅行業者代理業者が旅行業務につき旅行者に加えた損害を賠償する責めに任ずるが、当該所属旅行業者がその旅行業者代理業者への委託につき相当の注意を払えば、その責任を免れる。","イ":"登録行政庁は、旅行業者代理業者に対し、その行う営業が旅行業であると誤認させ、又は所属旅行業者を誤認させないようにするための措置をとるべきことを命ずることができる。","ウ":"旅行業者代理業者は、旅行業務に関し取引をしようとするときは、所属旅行業者の氏名又は名称及び旅行業者代理業者である旨を取引の相手方に明示しなければならない。","エ":"旅行業者代理業者の登録は、所属旅行業者の登録の有効期限が満了したことによりその登録が効力を失い、旅行業の登録が抹消されたときは、その効力を失う。"},"answer":["ア"],"explain":"所属旅行業者が責任を免れるのは、委託につき相当の注意をし、かつ、損害の発生の防止に努めたときです。相当の注意を払っただけでは免責されません。"},{"no":"(22)","prompt":"法第18条の3「業務改善命令」に関する次の記述のうち、正しいものをすべて選びなさい。","choices":{"ア":"登録行政庁は、旅行業者に対し、旅行業約款を変更することを命ずることができる。","イ":"登録行政庁は、旅行業者に対し、旅行業務取扱管理者を解任することを命ずることができる。","ウ":"登録行政庁は、旅行業者に対し、国土交通省令で定める旅程管理のための措置を確実に実施することを命ずることができる。","エ":"登録行政庁は、旅行業者に対し、旅行者に生じた損害を賠償するために必要な金額を担保することができる保険契約を締結することを命ずることができる。"},"answer":["ア","イ","ウ","エ"],"explain":"いずれも業務改善命令として定められています。このほか、旅行業務の取扱いの料金又は企画旅行の対価の変更、旅行者に生じた損害の賠償に必要な措置なども命ずることができます。"},{"no":"(23)","prompt":"法第19条「登録の取消し等」に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"登録行政庁は、旅行業者等が法人であって、その役員のうちに個人情報の保護に関する法律に違反し、罰金の刑に処せられ、その執行を終わった日から5年を経過していない者のいることが判明したときは、当該旅行業者等の登録を取り消すことができる。","イ":"登録行政庁は、旅行業者等が登録を受けてから14日以内に事業を開始しなかったときは、当該旅行業者等の登録を取り消すことができる。","ウ":"登録行政庁は、旅行業者等が登録当時、営業所ごとに旅行業務取扱管理者を確実に選任すると認められない者であることが判明したときは、当該旅行業者等に対し、6月以内の期間を定めて業務の全部若しくは一部の停止を命じ、又は登録を取り消すことができる。","エ":"登録行政庁は、旅行業者が登録申請時に営業保証金を供託していなかったことが判明したときは、当該旅行業者に対し、6月以内の期間を定めて業務の全部若しくは一部の停止を命じ、又は登録を取り消すことができる。"},"answer":["ウ"],"explain":"登録当時から登録拒否事由に該当していたことが判明した場合は、業務停止命令又は登録の取消しの対象です。アの個人情報保護法違反の罰金は拒否事由に当たらず、イは1年以内に事業を開始しないときであり、エは営業保証金は登録後に供託するものです。"},{"no":"(24)","prompt":"旅行サービス手配業に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行サービス手配業を営もうとする者は、主たる営業所の所在地を管轄する都道府県知事に国土交通省令で定める事項を記載した届出書を提出しなければならない。","イ":"旅行サービス手配業者は、旅行サービス手配業務を他人に委託する場合においては、他の旅行サービス手配業者以外の者に委託してはならない。","ウ":"登録行政庁は、旅行サービス手配業者が引き続き1年以上事業を行っていないと認めるときは、登録を取り消すことができる。","エ":"旅行サービス手配業の登録の有効期間は、登録の日から起算して5年である。"},"answer":["ウ"],"explain":"1年以上事業を行っていないと認められるときは登録を取り消すことができます。アは届出ではなく登録、イは委託先を他の旅行サービス手配業者に限る定めはなく、エは旅行サービス手配業の登録に有効期間はありません。"},{"no":"(25)","prompt":"次の記述のうち、旅行業協会が適正かつ確実に実施しなければならない業務として定められているものを1つ選びなさい。","choices":{"ア":"旅行業等を営む者の業務の適正な運営を確保するための旅行業者等又は旅行サービス手配業者に対する立入検査","イ":"旅行業務又は旅行サービス手配業務の取扱いに従事する者に対する研修","ウ":"旅行業務又は旅行サービス手配業務の適切な運営を確保するための旅行業者等又は旅行サービス手配業者に対する会計監査","エ":"旅行業務に関し社員である旅行業者若しくは当該旅行業者を所属旅行業者とする旅行業者代理業者又は旅行サービス手配業者と取引をした者に対し、その取引によって生じた債権に関し弁済をする業務"},"answer":["イ"],"explain":"研修は旅行業協会の業務です。ア・ウのような立入検査や会計監査は定められていません。エの弁済業務の対象は、社員である旅行業者等と旅行業務に関し取引をした旅行者に限られます。"}],[{"no":"(1)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「適用範囲」「用語の定義」に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"「通信契約」とは、旅行代金の決済方法にかかわらず、旅行業者が、電話、郵便、ファクシミリ、インターネットその他の通信手段による申込みを受けて締結する契約をいう。","イ":"旅行業者が法令に反せず、かつ、旅行者の不利にならない範囲で口頭で特約を結んだときは、その特約は約款に優先して適用される。","ウ":"「国内旅行」とは、本邦内のみの旅行をいい、「海外旅行」とは、「国内旅行」以外の旅行をいう。","エ":"旅行業者が旅行者との間で締結する契約において、約款に定めのない事項については、法令又は一般に確立された慣習によるが、ここでいう法令とは、旅行業法及び内閣府・国土交通省令に限られる。"},"answer":["ウ"],"explain":"海外旅行は国内旅行以外の旅行をいい、本邦内と本邦外にまたがる旅行も含みます。アの通信契約は提携カード会社のカード会員との間でカード決済を条件とする契約、イの特約は書面によることが必要、エの法令は旅行業法等に限られません。"},{"no":"(2)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行契約の内容」「手配代行者」「契約の申込み」「電話等による予約」に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者は、旅行者が契約の申込みの際に支払った申込金を、旅行代金又は取消料の一部として取り扱い、他に充当することはできない。","イ":"旅行業者は、契約において、旅行者が旅行業者の定める旅行日程に従って、運送・宿泊機関等の提供するサービスの提供を受けることができるように、手配することのみを引き受ける。","ウ":"旅行業者は、国内旅行の契約の履行に当たって、手配の全部又は一部を手配を業として行う者に代行させることはできない。","エ":"旅行業者が旅行者からインターネットにより通信契約の予約を受け付け、当該予約の承諾の旨を通知した後、旅行業者が定める期間内に、当該旅行者から会員番号等の通知があったときは、契約の締結の順位は、当該予約の受付の順位による。"},"answer":["エ"],"explain":"期間内に会員番号等の通知があれば、契約締結の順位は予約受付の順位によります。アは申込金を旅行代金・取消料・違約料の一部として取り扱い、イは手配に加えて旅程管理も引き受け、ウは国内旅行でも手配代行者に代行させることができます。"},{"no":"(3)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「契約締結の拒否」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、旅行者が他の旅行者に迷惑を及ぼし、又は団体行動の円滑な実施を妨げるおそれがあるときは、契約の締結に応じないことがある。","イ":"旅行業者は、応募旅行者数が募集予定数に達したときは、契約の締結に応じないことがある。","ウ":"旅行業者は、業務上の都合があるとの理由のみによって、契約の締結を拒否することはできない。","エ":"旅行業者は、旅行者が暴力団員、暴力団準構成員、暴力団関係者、暴力団関係企業又は総会屋等その他の反社会的勢力であると認められるときは、契約の締結に応じないことがある。"},"answer":["ウ"],"explain":"約款では「旅行業者の業務上の都合があるとき」も契約締結を拒否できる事由として定められています。"},{"no":"(4)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「契約の成立時期」「契約書面の交付」「情報通信の技術を利用する方法」に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者が契約により手配し旅程を管理する義務を負う旅行サービスの範囲は、契約書面に記載するところによる。","イ":"旅行業者は、旅行者の承諾を得ることなく、契約書面又は確定書面の交付に代えて、情報通信の技術を利用する方法により当該書面に記載すべき事項を提供することができる。","ウ":"契約は、通信契約の場合を除き、旅行業者が契約の締結を承諾し、旅行者から旅行業者所定の申込書を受理した時に成立する。","エ":"通信契約は、旅行業者が契約の締結を承諾する旨の通知を旅行者に発した時に成立する。"},"answer":["ア"],"explain":"手配し旅程を管理する義務を負う範囲は契約書面（確定書面を交付したときは確定書面）に記載するところによります。イは旅行者の承諾が必要、ウは申込金を受理した時に成立、エの通信契約は承諾の通知が旅行者に到達した時に成立します。"},{"no":"(5)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行代金」「契約内容の変更」「旅行代金の額の変更」に関する次の記述のうち、正しいものをすべて選びなさい。","choices":{"ア":"旅行業者は、利用する宿泊機関について適用を受ける料金が、著しい経済情勢の変化等により、旅行の募集の際に明示した時点の料金に比べて通常想定される程度を大幅に超えて増額又は減額される場合においては、その範囲内で旅行代金の額を増加し、又は減少することができる。","イ":"旅行業者は、旅行業者の関与し得ない事由が生じた場合において、旅行の安全かつ円滑な実施を図るためやむを得ないときは、旅行者にあらかじめ速やかに理由及び因果関係を説明して、契約の内容を変更することがある。ただし、緊急の場合においてやむを得ないときは、変更後に説明する。","ウ":"旅行業者は、通信契約を締結したときは、提携会社のカードにより所定の伝票への旅行者の署名なくして契約書面に記載する金額の旅行代金の支払いを受ける。また、カード利用日は旅行契約成立日とする。","エ":"旅行業者は、運送・宿泊機関等の利用人員により旅行代金が異なる旨を契約書面に記載した場合において、契約の成立後に旅行業者の責に帰すべき事由によらず当該利用人員が変更になったときは、契約書面に記載したところにより旅行代金の額を変更することがある。"},"answer":["イ","ウ","エ"],"explain":"経済情勢の変化等を理由に旅行代金を変更できるのは、利用する運送機関の運賃・料金が大幅に改定された場合です。宿泊機関の料金の変動は旅行代金の変更事由になりません。"},{"no":"(6)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行者の解除権」に関する次の記述のうち、旅行者が旅行開始前に契約を解除するに当たって、取消料の支払いを要するものを1つ選びなさい（いずれも取消料の支払いを要する期間内の解除とする。）。","choices":{"ア":"旅行目的地において集中豪雨による洪水が発生し、旅行の安全かつ円滑な実施が不可能となったとき。","イ":"確定書面に記載されていたA旅館の過剰予約受付により当該旅館に宿泊できなくなったため、契約書面において利用予定の宿泊機関として限定して列挙されていたB旅館に変更になったとき。","ウ":"旅行者が足を骨折して入院したため、旅行に参加できなくなったとき。","エ":"旅行業者が旅行者に対し確定書面を交付すべき場合において、所定の期日までに、確定書面を交付しなかったとき。"},"answer":["ウ"],"explain":"旅行者自身の病気やけがは、取消料なしで解除できる事由として約款に列挙されていません。アは天災地変等、エは確定書面の不交付、イは契約内容の重要な変更に当たり、いずれも取消料なしで解除できます。"},{"no":"(7)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の解除権等－旅行開始前の解除」に関する次の記述のうち、誤っているものを1つ選びなさい（いずれも解除に係る旅行者への説明は行うものとする。）。","choices":{"ア":"旅行業者は、花見を目的とする日帰りの国内旅行において、異常気象により開花が遅れ、旅行実施条件として契約締結の際に明示した花見そのものができないおそれが極めて大きいときは、契約を解除することがある。","イ":"9月3日を旅行開始日とする宿泊を伴う国内旅行において、参加する旅行者の数が契約書面に記載した最少催行人員に達しなかったことから旅行業者が契約を解除しようとするときは、旅行者に当該旅行を中止する旨を遅くとも8月20日までに通知する。","ウ":"旅行業者は、旅行者が、契約内容に関し合理的な範囲を超える負担を求めたときは、契約を解除することがある。","エ":"旅行者が契約書面に記載する期日までに旅行代金を支払わないときは、旅行業者は、当該期日において旅行者が契約を解除したものとする。"},"answer":["エ"],"explain":"旅行代金が期日までに支払われないときは、その期日の「翌日」において旅行者が契約を解除したものとされます。イの宿泊を伴う国内旅行は13日目に当たる日（8月21日）より前、つまり8月20日までの通知で正しい取扱いです。"},{"no":"(8)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の解除権－旅行開始後の解除」に関する次の記述のうち、誤っているものを1つ選びなさい（いずれも解除に係る旅行者への理由説明は行うものとする。）。","choices":{"ア":"旅行業者は、運送・宿泊機関等の旅行サービス提供の中止が生じた場合であって、旅行の継続が不可能となったときは、契約の一部を解除することがある。","イ":"旅行業者は、旅行地で発生した天災地変により契約の一部を解除した場合において、旅行代金のうち旅行者がいまだ提供を受けていない旅行サービスに係る金額から、取消料、違約料その他の既に支払い又は支払わなければならない費用を差し引いたものを旅行者に払い戻す。","ウ":"旅行者が必要な介助者の不在により旅行の継続に耐えられないため、旅行業者が契約の一部を解除したときは、契約関係は将来に向かってのみ消滅する。この場合、旅行者が既に提供を受けた旅行サービスに関する旅行業者の債務については、有効な弁済がなされたものとする。","エ":"旅行業者は、旅行者に同行する添乗員が病気になったため、当該添乗員による旅程管理業務の遂行が不可能となったときは、契約の一部を解除することがある。"},"answer":["エ"],"explain":"添乗員の病気は旅行業者側の事情であり、旅行開始後の解除事由として定められていません。旅行業者は代替の措置を講じる必要があります。"},{"no":"(9)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行代金の払戻し」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、通信契約が解除された場合において、旅行者に対し払い戻すべき金額が生じたときは、提携するクレジットカード会社のカード会員規約に従って、当該旅行者に対し当該金額を払い戻す。","イ":"旅行開始日の前日に、旅行者の都合による契約解除の申出があり、旅行者に払い戻すべき金額が生じたときは、通信契約を締結していた場合を除き、旅行業者は、当該金額を解除の翌日から起算して7日以内に払い戻す。","ウ":"旅行開始前に、旅行業者の責に帰すべき事由により旅行の実施が不可能となったことから旅行者が契約を解除した場合において、旅行業者が既に収受している旅行代金の全額を約款に定める期日までに払い戻した場合であっても、旅行者が損害賠償請求権を行使することを妨げるものではない。","エ":"旅行中における大地震の発生で、契約書面に記載のあった旅行終了日を前日に繰り上げ旅行日程を変更する措置を講じたため旅行業者が契約の一部を解除した場合において、旅行代金が減額になったときは、通信契約を締結していた場合を除き、旅行業者は、変更された旅行終了日の翌日から起算して30日以内に当該減額した金額を払い戻す。"},"answer":["エ"],"explain":"旅行開始後の解除等による払戻しの期限は、実際の旅行終了日ではなく「契約書面に記載した旅行終了日」の翌日から起算して30日以内です。"},{"no":"(10)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅程管理」「旅行業者の指示」「添乗員等の業務」「保護措置」に関する次の記述のうち、誤っているものをすべて選びなさい。","choices":{"ア":"添乗員その他の者が旅程管理業務その他旅行に付随して旅行業者が必要と認める業務に従事する時間帯は、原則として9時から17時までとする。","イ":"旅行者は、旅行開始後旅行終了までの間において、団体で行動するときは、旅行を安全かつ円滑に実施するための旅行業者の指示に従わなければならない。","ウ":"旅行業者は、旅行者が旅行中旅行サービスを受けることができないおそれがあると認められるときは、契約に従った旅行サービスの提供を確実に受けられるために必要な措置を講ずる。","エ":"旅行業者は、旅行中の旅行者が、疾病、傷害等により保護を要する状態にあると認めたときは、必要な措置を講ずることがある。この場合において、これが当該旅行業者の責に帰すべき事由によるものでなくとも、当該措置に要した費用は、当該旅行業者の負担とする。"},"answer":["ア","エ"],"explain":"添乗員等の業務時間帯は原則として8時から20時までです。また保護措置に要した費用は、旅行業者の責に帰すべき事由による場合を除き旅行者の負担となります。"},{"no":"(11)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の責任」「旅行者の責任」に関する記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"旅行業者は、契約の履行に当たって、旅行業者の故意又は過失により旅行者に損害（手荷物について生じた損害を除く。）を与えたときは、損害発生の翌日から起算して2年以内に当該旅行者から旅行業者に対して通知があったときに限り、その損害を賠償する責に任じる。","イ":"旅行者は、旅行開始後において、契約書面に記載された旅行サービスを円滑に受領するため、万が一契約書面と異なる旅行サービスが提供されたと認識したときは、旅行地において、その旨を記載した書面により旅行業者に通知しなければならない。","ウ":"旅行者の過失により旅行業者が損害を被った場合でも、その過失が重大なものでないときは、当該旅行者はその責に任じない。","エ":"旅行業者は、運送機関の運送サービス提供の中止により旅行者が損害を被ったときは、いかなる場合においてもその損害を賠償する責任を負わない。"},"answer":["ア"],"explain":"手荷物以外の損害の通知期間は損害発生の翌日から起算して2年以内です。イは旅行地で速やかに申し出れば足り書面は不要、ウは軽過失でも旅行者は賠償責任を負い、エも旅行業者に故意又は過失があれば責任を負います。"},{"no":"(12)","group":"標準旅行業約款（受注型企画旅行）","prompt":"受注型企画旅行契約の部に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"「受注型企画旅行」とは、旅行業者が、旅行者からの依頼により、旅行の目的地及び日程、運送又は宿泊のサービスの内容並びに旅行代金の額を定めた旅行に関する計画を作成し、これにより実施する旅行をいう。","イ":"旅行業者は、契約責任者と受注型企画旅行契約を締結する場合において、申込金の支払いを受けることなく契約の締結を承諾することがある。","ウ":"旅行者は、旅行業者に対し、旅行日程、旅行サービスの内容その他の契約の内容を変更するよう求めることができる。この場合において、旅行業者は、可能な限り旅行者の求めに応じる。","エ":"旅行業者が旅行代金の内訳として企画料金の金額を明示した企画書面を旅行者に交付した場合において、旅行者が当該書面に記載された企画の内容に関して契約の申込みをしないときであっても、旅行者は、旅行業者に対し、当該企画料金に相当する金額を支払わなければならない。"},"answer":["エ"],"explain":"企画書面を交付しただけでは契約は成立しておらず、申込みがない段階で企画料金を収受することはできません。"},{"no":"(13)","group":"標準旅行業約款（受注型企画旅行）","prompt":"受注型企画旅行契約の部に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"団体・グループ契約において、契約責任者は、旅行業者が定める日までに、構成者の人数を旅行業者に通知すれば、構成者の名簿を提出することを要しない。","イ":"旅行者が旅行開始日までの契約書面に記載する期日までに旅行代金を支払わないときは、当該期日の翌日において旅行者が旅行契約を解除したものとする。","ウ":"旅行業者は、団体・グループ契約において、申込金の支払いを受けることなく契約を締結する場合には、契約責任者にその旨を記載した書面を交付し、当該契約は、旅行業者が当該書面を交付した時に成立する。","エ":"旅行業者は、通信契約を締結しようとする場合であって、旅行者の有するクレジットカードが無効である等、旅行代金等に係る債務を提携会社のカード会員規約に従って決済できないときは、契約の締結に応じないことがある。"},"answer":["ア"],"explain":"受注型企画旅行の団体・グループ契約では、契約責任者は旅行業者が定める日までに構成者の名簿を提出しなければなりません。人数の通知で名簿の提出に代えられるのは、添乗員を同行させない場合など約款が定める場合に限られます。"},{"no":"(14)","group":"標準旅行業約款（旅程保証）","prompt":"募集型・受注型企画旅行契約の部「旅程保証」に関する次の記述のうち、誤っているものを1つ選びなさい（変更補償金を支払う場合、その額は約款に定める最低額を上回っているものとする。）。","choices":{"ア":"旅行業者は、契約内容の重要な変更が生じた場合において、当該変更が旅行業者又は手配代行者の明らかな過失によるものであるときは、旅行者に変更補償金を支払わない。","イ":"旅行業者は、契約内容の重要な変更が生じた場合において、変更補償金を支払うこととなったときは、旅行終了日の翌日から起算して30日以内に当該変更補償金を旅行者に支払う。","ウ":"変更補償金の支払いが必要となる変更について、旅行業者が当該変更を旅行開始日の前日までに旅行者に通知した場合と、旅行開始当日以降に旅行者に通知した場合とでは変更補償金の1件当たりの率は異なる。","エ":"旅行業者は、旅行者1名に対して1企画旅行につき支払うべき変更補償金の額が1,000円であるときは、変更補償金を支払わない。"},"answer":["エ"],"explain":"変更補償金を支払わないのは、その額が1,000円「未満」のときです。1,000円であれば支払う必要があります。"},{"no":"(15)","group":"標準旅行業約款（旅程保証）","prompt":"募集型・受注型企画旅行契約の部「旅程保証」に関する次の記述のうち、変更補償金の支払いを要するものを1つ選びなさい（変更補償金を支払う場合、その額は約款が定める最低額を上回っているものとする。）。","choices":{"ア":"確定書面には、「第2日目：A公園を散策」と記載されていたが、実際にはA公園の散策が第3日目に変更となったとき。","イ":"確定書面に「Aホテルの海の見えるスタンダードツインルームに宿泊」と記載されていたが、Aホテルの過剰予約受付のため、Aホテルの海の見えないスイートルームに変更になったとき。","ウ":"契約書面に利用航空会社として「A航空」と記載されていたが、旅行開始後「A航空」の利用予定便が欠航となったため、B航空に変更となったとき。","エ":"確定書面には、A美術館で「絵画鑑賞2時間」と記載されていたが、観光バスが交通事故に起因する渋滞に巻き込まれたことにより、実際には絵画鑑賞が1時間に変更となったとき。"},"answer":["イ"],"explain":"宿泊機関の客室の種類・設備等の変更は補償対象で、過剰予約受付が原因のときは免責されません。アは同一日程内の順序変更、ウは運送サービスの中止による免責、エは滞在時間の短縮で、いずれも対象外です。"},{"no":"(16)","group":"標準旅行業約款（特別補償）","prompt":"募集型・受注型企画旅行契約の部「特別補償」「特別補償規程」に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行者が事故により被った身体の損害について、旅行業者が補償金等を支払った後に、当該損害について旅行業者が損害賠償責任を負うことが明らかになった場合、旅行業者は、補償金等に加えて損害賠償金を支払う。","イ":"「サービスの提供を受けることを開始した時」とは、添乗員、旅行業者の使用人又は代理人による受付が行われない場合において、旅行者がサービスの提供を受ける最初の運送・宿泊機関等が航空機であるときは、乗客のみが入場できる飛行場構内における手荷物の検査等の完了時をいう。","ウ":"旅行業者の企画旅行参加中の旅行者を対象として、別途の旅行代金を収受して当該旅行業者が実施する募集型企画旅行については、主たる企画旅行契約の内容の一部として取り扱う。","エ":"旅行業者が補償金等を支払った場合でも、旅行者又はその法定相続人が旅行者の被った傷害について第三者に対して有する損害賠償請求権は、旅行業者に移転しない。"},"answer":["ア"],"explain":"支払うべき損害賠償金の額の限度において、既に支払った補償金等は損害賠償金とみなされます。補償金等と損害賠償金を重ねて支払うわけではありません。"},{"no":"(17)","group":"標準旅行業約款（特別補償）","prompt":"募集型・受注型企画旅行契約の部「特別補償規程」に関する次の記述のうち、入院見舞金又は携帯品損害補償金の支払いの対象とならないものを1つ選びなさい。","choices":{"ア":"国内旅行において、地震の発生に伴って旅館から避難する際、混乱に巻き込まれたことにより壊れてしまった旅行者のデジタルカメラ","イ":"ホテルのロビーで盗難にあった旅行者のハンドバッグ","ウ":"旅行者が旅館の夕食で出された天然ふぐ料理のふぐ毒を原因とする食物中毒に罹患したことによる3日間の入院","エ":"バッグの中に入れていた香水の容器から中身が漏れたことにより、機能に支障をきたした旅行者のスマートフォン"},"answer":["ア"],"explain":"国内旅行中の地震・噴火・津波による損害は、特別補償の対象外とされています（海外旅行は対象）。イの盗難、ウのふぐ毒による食物中毒、エの携帯品の損害はいずれも対象です。"},{"no":"(18)","group":"標準旅行業約款（手配旅行）","prompt":"手配旅行契約の部に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者が善良な管理者の注意をもって宿泊サービスの手配をしたときは、手配旅行契約に基づく債務の履行は終了し、満員との事由によって契約を締結できなかった場合であっても、旅行者は、旅行業者所定の旅行業務取扱料金を支払わなければならない。","イ":"「手配旅行契約」とは、旅行業者が旅行者の委託により、旅行者のために代理、媒介又は取次をすること等により旅行者が運送・宿泊機関等の提供するサービスの提供を受けることができるように、手配し、旅程を管理することを引き受ける契約をいう。","ウ":"旅行者は、いつでも手配旅行契約の全部又は一部を解除することができる。","エ":"旅行業者は、旅行サービスを手配するために運送・宿泊機関等に対して支払った費用で旅行者の負担に帰すべきもの及び取扱料金が旅行代金として既に収受した金額に満たないときは、旅行終了後、速やかに旅行者にその差額を払い戻す。"},"answer":["イ"],"explain":"手配旅行契約は手配することを引き受ける契約であり、旅程管理は引き受けません（旅程管理を引き受けるのは企画旅行契約です）。"},{"no":"(19)","group":"標準旅行業約款（手配旅行）","prompt":"手配旅行契約の部に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、書面による特約をもって、申込金の支払いを受けることなく、契約の締結の承諾のみにより契約を成立させることがあるが、この場合において契約の成立時期は、当該書面に明示する。","イ":"「旅行代金」とは、旅行業者が旅行サービスを手配するために、運賃、宿泊料その他の運送・宿泊機関等に対して支払う費用及び旅行業者所定の旅行業務取扱料金（変更手続料金及び取消手続料金を除く。）をいう。","ウ":"旅行業者は、旅行開始前において、運送・宿泊機関等の運賃・料金の改訂、為替相場の変動その他の事由により旅行代金の変動を生じた場合は、当該旅行代金を変更することがある。この場合において、旅行代金の増加又は減少は旅行者に帰属する。","エ":"旅行業者は、手配旅行契約の履行に当たっては、本邦内の旅行サービスの手配についてのみ、手配の全部又は一部を他の旅行業者、手配を業として行う者その他の補助者に代行させることができる。"},"answer":["エ"],"explain":"手配の代行は本邦内に限られず、本邦外の旅行サービスの手配についても代行させることができます。"},{"no":"(20)","group":"標準旅行業約款（旅行相談）","prompt":"旅行相談契約の部に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅行業者は、契約の履行に当たって、故意又は過失により旅行者に損害を与えたときは、その損害発生の翌日から起算して6月以内に当該旅行業者に対して通知があったときに限り、その損害を賠償する責に任じる。","イ":"旅行業者が契約に基づく業務を行ったときは、旅行者は、旅行業者に対し、旅行業者が定める期日までに、旅行業者所定の相談料金を支払わなければならない。","ウ":"旅行業者が旅行者の委託により、相談料金を収受することを約して、旅行地及び運送・宿泊機関等に関する情報提供のみを引き受けることは、旅行相談契約の業務には該当しない。","エ":"旅行業者は、申込書の提出を受けることなく電話、郵便、ファクシミリ、インターネットその他の通信手段による契約の申込みを受け付けることがある。この場合において、契約は、旅行業者が契約の締結を承諾した時に成立するものとする。"},"answer":["ウ"],"explain":"旅行地や運送・宿泊機関等に関する情報提供のみを行う業務も、旅行相談契約の業務に含まれます。"},{"no":"2","group":"一般貸切旅客自動車運送事業標準運送約款","prompt":"一般貸切旅客自動車運送事業標準運送約款に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"バス会社は、契約責任者から運送申込書の提出時に所定の運賃及び料金の20％以上の支払いがあったときには、特別の定めをしたときを除き、所定の事項を記載したバス会社所定の乗車券を発行し、これを契約責任者に交付する。","イ":"バス会社は、旅行業者が手配旅行の実施のため、バス会社に旅客の運送を申し込む場合には、当該旅行業者を契約責任者として運送契約を結ぶ。","ウ":"旅客は、バス会社の運転者、車掌その他の係員が運送の安全確保と車内秩序の維持のために行う職務上の指示に従わなければならない。","エ":"バス会社が収受する運賃及び料金は、乗車時において地方運輸局長に届け出て実施しているものによる。"},"answer":["イ"],"explain":"旅行業者を契約責任者として運送契約を結ぶのは、旅行業者が「企画旅行」の実施のために申し込む場合です。手配旅行の場合は旅行業者は旅行者の代理人として申し込みます。"},{"no":"3","group":"フェリー標準運送約款","prompt":"海上運送法第9条第3項の規定に基づく標準運送約款（フェリーを含む一般旅客定期航路事業に関する標準運送約款）に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"フェリー会社は、旅客の乗船後に乗船券の通用期間が経過した場合は、そのまま継続して乗船する間に限り、当該乗船券の通用期間は、その間延長されたものとみなす。","イ":"旅客は、手回り品（旅客が使用する車いす及び身体障害者補助犬を除く。）を2個に限り、船室に持ち込むことができる。ただし、フェリー会社が支障ないと認めたときは、2個を超えて持ち込むことができる。","ウ":"旅客が乗船後に乗船券の券面に記載の乗船区間について乗越しを申し出た場合には、フェリー会社は、その輸送力に余裕がある場合に限り、その変更の取扱いに応じる。この場合には、変更後の乗船区間に対応する運賃及び料金と既に収受した額との差額を申し受ける。","エ":"フェリー会社は、旅客が、船員等の指示に従い、乗船手続き完了時から下船港の乗降施設を離れた時までの間に、その生命又は身体を害した場合は、運送人が運送に関し注意を怠らなかったことを証明した場合を除き、これにより生じた損害について賠償する責任を負う。"},"answer":["エ"],"explain":"運送人が責任を負う期間の起算点が異なります。乗船手続の完了時ではなく、旅客が乗船した時から下船した時までの間が対象です。"},{"no":"4","group":"JR旅客営業規則","prompt":"旅客鉄道会社（JR）の旅客営業規則に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"旅客が無料で車内に持ち込める自転車は、解体して専用の袋に収納したもの又は折りたたみ式自転車であって、折りたたんで専用の袋に収納し、3辺の最大の和が250センチメートル以内、重量が30キログラム以内のものに限る。","イ":"団体乗車券を所持する旅客の使用開始後における指定券に関する変更については、原団体乗車券に表示された列車が乗車駅を出発する時刻の2時間前までに係員に申し出て、その承諾を受けた場合であって、かつ、輸送上の支障がない場合に限り、1回に限って取り扱われる。","ウ":"訪日観光団体とは、訪日観光客7人以上又はこれと同行する旅行業者（ガイドを含む。）とによって構成された団体で、責任のある代表者が引率するものをいう。","エ":"小口団体（普通団体）に対する運送の申込みの受付期間は、当該団体の始発駅出発日の9箇月前の日から14日前の日までである。ただし、別に定める場合は、12日前の日まで受け付けることがある。"},"answer":["ウ"],"explain":"訪日観光団体の構成人員の要件が異なります（7人以上ではありません）。人数要件を満たす訪日観光客とこれに同行する旅行業者等で構成され、責任ある代表者が引率する団体をいいます。"},{"no":"5","group":"モデル宿泊約款","prompt":"モデル宿泊約款に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"ホテル（旅館）は、宿泊客がチェックインした後に、火災予防上必要な利用規則の禁止事項に従わないため宿泊契約を解除したときは、宿泊客がいまだ提供を受けていない宿泊サービス等の料金は収受しない。","イ":"宿泊客がホテル（旅館）の駐車場を利用する場合において、当該ホテル（旅館）が車両のキーを預かっているときに限り、ホテル（旅館）は車両の管理責任を負う。","ウ":"ホテル（旅館）は、宿泊客が連絡をしないで宿泊日当日の所定の時刻、又はあらかじめ明示された到着予定時刻を一定時間経過しても到着しないときは、その宿泊契約は当該宿泊客により解除されたものとみなして処理することがある。","エ":"ホテル（旅館）が宿泊客との間で締結する宿泊契約及びこれに関連する契約は、約款の定めるところによるものとし、約款に定めのない事項については、法令等又は一般に確立された慣習によるものとする。"},"answer":["イ"],"explain":"駐車場の利用は、キーの寄託の有無にかかわらず場所を貸すものであって、ホテル（旅館）は車両の管理責任までは負いません。ただし駐車場の管理にホテル（旅館）の故意又は過失があったときは賠償責任を負います。"}],[{"no":"1(1)","group":"貸切バスの運賃・料金","prompt":"次の行程で運行する大型車の貸切バスの運賃・料金に関する次の記述のうち、正しいものはどれか。","material":"＜行程＞\n・2日にわたる運行で宿泊を伴う利用\n・1日目：出庫8時、走行時間6時間、宿泊場所到着14時、走行距離200キロ（到着から翌日出発まで走行しない）\n・2日目：宿泊場所出発16時、走行時間6時間、帰庫22時、走行距離200キロ\n・2日にわたる回送時間の合計は2時間、回送距離の合計は50キロ\n（注）運賃の割引・特殊車両割増料金の適用なし。運転者1人。","choices":{"ア":"運賃は「12時間分の時間制運賃」と「350キロ分のキロ制運賃」の合計額、料金は「2時間分の深夜早朝運行料金」が必要である。","イ":"運賃は「14時間分の時間制運賃」と「400キロ分のキロ制運賃」の合計額、料金は「2時間分の深夜早朝運行料金」が必要である。","ウ":"運賃は「10時間分の時間制運賃」と「350キロ分のキロ制運賃」の合計額、料金は「1時間分の深夜早朝運行料金」が必要である。","エ":"運賃は「16時間分の時間制運賃」と「400キロ分のキロ制運賃」の合計額、料金は「1時間分の深夜早朝運行料金」が必要である。"},"answer":["エ"],"explain":"宿泊を伴う運行では、1日あたりの時間制運賃の対象時間は最低8時間として計算するため、2日間で16時間となります。キロ制運賃は回送を含む全走行距離400キロ。帰庫後の点呼等の時間が22時以降にかかるため、深夜早朝運行料金が1時間分必要です。"},{"no":"1(2)","group":"貸切バスの運賃・料金","prompt":"貸切バスによる運送に関する次の記述のうち、正しいものはどれか（標準運送約款及び関東運輸局長公示による）。","choices":{"ア":"配車日が9月1日、配車車両数が1台、1台あたりの所定の運賃及び料金の合計額が100,000円の運送契約において、契約責任者の都合により8月12日（配車日の20日前）に運送契約を解除したときの違約料は20,000円である。","イ":"交替運転者配置料金は、バス会社が運行日の別により定めた交替運転者1人あたりの額を適用する。","ウ":"配車日が9月1日、配車車両数が3台の運送契約において、8月18日（配車日の14日前）に1台の車両の減少を伴う運送契約の内容を変更したときの違約料は不要である。","エ":"標準的な装備を超える特殊な設備を有する車両については、設備や購入価格等を勘案した割増率を適用する特殊車両割増料金を収受することができる。"},"answer":["エ"],"explain":"特殊な設備を有する車両には特殊車両割増料金を適用できます。アは配車日の20日前の解除なので違約料は不要、ウは配車日の14日前の変更なので違約料が必要です。イの交替運転者配置料金は、時間制運賃・キロ制運賃と同様の方法で算出します。"},{"no":"2","group":"フェリーの運賃","prompt":"フェリーによる運送に関する次の記述のうち、正しいものを1つ選びなさい（年齢は乗船日現在）。","choices":{"ア":"車長4ｍ～5ｍ未満の自動車航送運賃が10,000円、2等船室の旅客運賃が大人1,000円、1等船室が大人2,000円のフェリーに、当該自動車1台と運転者1人が1等船室に乗船する場合、運賃の合計額は12,000円である。","イ":"750ccの自動二輪の特殊手荷物運賃が5,000円、2等船室の旅客運賃が大人1,000円、1等船室が大人2,000円のフェリーに、当該自動二輪1台と運送申込人1人が1等船室に乗船する場合、運賃の合計額は6,000円である。","ウ":"指定制の座席ではない2等船室の旅客運賃が大人1,000円、小児500円のフェリーに、大人1人と4歳と3歳の小児の計3人が当該2等船室に乗船する場合、運賃の合計額は1,500円である。","エ":"旅客運賃1,000円、特別急行料金1,000円を収受する急行便が、所定の所要時間以内の時間でフェリー会社が定める時間以上遅延して到着した場合において、旅客が払戻しの請求をしたときは、フェリー会社は合計額の2,000円を払い戻す。"},"answer":["ウ"],"explain":"大人1人に同伴される小学校入学前の小児1人は無料となるため、大人1,000円＋小児1人分500円＝1,500円です。アは航送運賃に運転者1人の2等運賃が含まれるため差額1,000円を加えた11,000円、イは特殊手荷物運賃に旅客運賃は含まれないため7,000円、エは遅延の場合に払い戻されるのは特別急行料金です。"},{"no":"3","group":"宿泊料金","prompt":"宿泊に関する次の記述のうち、資料に基づき、正しいものを1つ選びなさい（モデル宿泊約款による）。","material":"＜資料＞\n●旅館：基本宿泊料 大人1人1泊2食付 20,000円／サービス料15％／消費税10％／入湯税100円（12歳未満は課税免除）／3日前解除の違約金の比率10％\n●ホテル：基本宿泊料 トリプルルーム（定員3人）1室 30,000円／サービス料10％／チェックイン14:00・チェックアウト10:00／前々日解除20％・前日解除30％","choices":{"ア":"この旅館に大人1人と子供用の食事と寝具の提供を伴う8歳の小学生1人の計2人が1泊するとき、宿泊客が支払うべき宿泊料金等の総額は38,060円である。","イ":"このホテルのトリプルルームをチェックアウト日の11:00まで使用したときの時間外の客室使用追加料金は10,000円である（サービス料及び消費税の計算は行わない）。","ウ":"この旅館に大人1人が7月10日に1泊する宿泊契約を、宿泊客の都合により7月7日に解除したとき、この旅館は2,300円の違約金を申し受ける。","エ":"このホテルのトリプルルームに、宿泊客と宿泊期間を3日とする宿泊契約が成立したときの申込金の限度は60,000円である。"},"answer":["イ"],"explain":"超過1時間（3時間まで）は室料の3分の1なので、30,000円÷3＝10,000円です。アの子供料金は大人の70％（14,000円）にサービス料・消費税を加えた額、ウの違約金は基本宿泊料20,000円の10％＝2,000円、エの申込金の限度は宿泊期間（最大3日）の基本宿泊料30,000円×3日＝90,000円です。"},{"no":"4(1)","group":"JR運賃","prompt":"次の行程で大人1人が乗車するとき、片道普通旅客運賃の計算に関する次の記述のうち、正しいものを選びなさい。","material":"＜行程＞\n四日市駅―（関西本線・幹線 6.9キロ）―河原田駅―（伊勢鉄道・通過連絡運輸扱い 22.3キロ）―津駅―（紀勢本線・幹線 27.0キロ）―多気駅―（参宮線・地方交通線 営業キロ15.0キロ／賃率換算キロ16.5キロ）―伊勢市駅\n（注）途中駅では当日乗り継ぎ、途中下車なし。","choices":{"ア":"JR線の「6.9キロ＋22.3キロ＋27.0キロ＋16.5キロ＝72.7キロ」の乗車距離による運賃額となる。","イ":"JR線の「6.9キロ」の運賃額と、伊勢鉄道の「22.3キロ」の運賃額と、JR線の「27.0キロ＋15.0キロ＝42.0キロ」の運賃額の合計額となる。","ウ":"JR線の「6.9キロ＋27.0キロ＋16.5キロ＝50.4キロ」の運賃額と、伊勢鉄道の「22.3キロ」の運賃額の合計額となる。","エ":"JR線の「6.9キロ＋27.0キロ＋15.0キロ＝48.9キロ」の運賃額と、伊勢鉄道の「22.3キロ」の運賃額の合計額となる。"},"answer":["ウ"],"explain":"通過連絡運輸では、第三セクター（伊勢鉄道）の区間を除いたJR線の区間を通算して運賃を計算し、伊勢鉄道分は別に計算します。JR線に地方交通線が含まれるため、参宮線は賃率換算キロ16.5キロを使います。"},{"no":"4(2)","group":"JR料金","prompt":"閑散期に次の行程で大人1人が乗車するとき、新幹線の特急料金とグリーン料金の組合せについて、資料に基づき正しいものを選びなさい。","material":"＜行程＞9月3日（火）閑散期\n岡山駅―「さくら」グリーン車（営業キロ180.3キロ）―新大阪駅―「ひかり」グリーン車（営業キロ106.7キロ）―米原駅\n（注）新大阪駅では新幹線の改札口を出ないで乗り継ぐ。\n＜資料＞指定席特急料金（通常期）岡山―新大阪 3,060円／岡山―米原 3,930円／新大阪―米原 3,060円\nグリーン料金 100キロまで1,300円／200キロまで2,800円／400キロまで4,190円","choices":{"ア":"特急料金 3,060円＋3,060円－530円＝5,590円、グリーン料金 2,800円＋2,800円－200円＝5,400円","イ":"特急料金 3,930円－530円＝3,400円、グリーン料金 4,190円－200円＝3,990円","ウ":"特急料金 3,060円＋3,060円－200円－530円＝5,390円、グリーン料金 2,800円＋2,800円＝5,600円","エ":"特急料金 3,930円－200円－530円＝3,200円、グリーン料金 4,190円"},"answer":["エ"],"explain":"改札口を出ずに新幹線同士を乗り継ぐ場合は1個の列車として通し計算します。岡山－米原の通常期指定席特急料金3,930円から閑散期200円引き、さらにグリーン車利用のため530円を差し引きます。グリーン料金は通算営業キロ287キロで4,190円、季節による増減はありません。"},{"no":"4(3)①","group":"JR乗車券","prompt":"次の行程で大人1人が乗車するために必要な乗車券に関する次の記述のうち、正しいものはどれか。","material":"＜行程＞\n7月5日 金沢駅―「つるぎ」北陸新幹線（幹線 営業キロ125.1キロ）―敦賀駅―普通列車 小浜線（地方交通線 営業キロ84.3キロ／賃率換算キロ92.7キロ）―東舞鶴駅（敦賀駅では改札口から出場して観光、東舞鶴に1泊）\n7月6日 東舞鶴駅―特急「まいづる」舞鶴線（地方交通線 営業キロ26.4キロ／賃率換算キロ29.0キロ）―(綾部駅)―山陰本線（幹線 76.2キロ）―京都駅―奈良線（幹線 1.1キロ）―東福寺駅（京都駅では改札口から出場しない）\n（注）行程は同一方向に連続し後戻りなし。東福寺駅は京都市内の駅で、中心駅は京都駅。","choices":{"ア":"7月5日分として「125.1＋84.3＝209.4キロ」の乗車券1枚、7月6日分として「26.4＋76.2＋1.1＝103.7キロ」の乗車券1枚の計2枚が必要である。","イ":"7月5日と7月6日の全乗車区間分として「125.1＋92.7＋29.0＋76.2＋1.1＝324.1キロ」の乗車券1枚が必要である。","ウ":"7月5日分として「125.1＋84.3＝209.4キロ」の乗車券1枚、7月6日分として「26.4＋76.2＝102.6キロ」の乗車券1枚の計2枚が必要である。","エ":"7月5日と7月6日の全乗車区間分として「125.1＋92.7＋29.0＋76.2＝323.0キロ」の乗車券1枚が必要である。"},"answer":["エ"],"explain":"片道乗車券として全区間を通して計算します。幹線と地方交通線をまたがる場合、地方交通線は賃率換算キロを用います。また営業キロが200キロを超え着駅が京都市内の駅であるため、運賃は中心駅の京都駅までで計算します（敦賀駅での出場は途中下車）。"},{"no":"4(3)②","group":"JR運賃・料金","prompt":"同じ行程について、大人に同伴された4歳の幼児1人が乗車するために必要な運賃と料金に関する次の記述のうち、正しいものはどれか（幼児は一つの指定席を1人で利用する）。","choices":{"ア":"運賃は大人の額の半額が必要、料金は不要である。","イ":"運賃は大人の額の半額が必要、「つるぎ」と「まいづる」の料金は大人の額の半額が必要である。","ウ":"運賃は不要、「つるぎ」と「まいづる」の料金は大人と同額が必要である。","エ":"運賃は不要、「つるぎ」と「まいづる」の料金は大人の額の半額が必要である。"},"answer":["イ"],"explain":"幼児は大人に同伴されていれば無賃ですが、指定席を1人で使用する場合は小児と同じ扱いとなり、小児運賃と小児の指定席特急料金（いずれも大人の半額）が必要です。"},{"no":"4(4)","group":"JR","prompt":"旅客鉄道会社（JR）に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"新幹線の普通車指定席を利用する団体旅客が102人で構成される普通団体の場合、99人分の運賃と特急料金が収受される。","イ":"自由席特急券の有効期間は、有効期間の開始日とその翌日の2日である。","ウ":"東海道・山陽・九州・西九州新幹線の一部の列車について、タテ・ヨコ・高さの合計が160センチメートルを超え250センチメートル以内の物品を車内に持ち込む場合、特大荷物スペースとセットで発売する座席の指定券を乗車前に購入したときは、追加の料金は不要である。","エ":"7月31日に始発駅を出発する新幹線の普通車指定席券は、7月1日午前10時から発売される。"},"answer":["イ"],"explain":"自由席特急券の有効期間は原則として1日です。指定席特急券も券面に表示された列車に限り有効です。"},{"no":"4(5)","group":"JR寝台列車","prompt":"特急サンライズ出雲に乗車する場合において、この乗車に必要な運賃及び料金の組合せに関する次の記述のうち、正しいものはどれか。","choices":{"ア":"大人1人と12歳の小学生1人が、シングルデラックス（A寝台個室）に乗車して1つの寝台を利用する場合に必要な運賃及び料金は、「1人分の大人運賃、1人分の大人特急料金と1人分の寝台料金」、「1人分の小児運賃と1人分の小児特急料金」である。","イ":"大人1人、12歳の小学生1人、3歳の幼児1人の計3人のうち、大人1人が1台の寝台（ソロ／B寝台個室）を、小学生1人と幼児1人が1台の寝台（ソロ）を利用す
