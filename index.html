る場合に必要な運賃及び料金は、「1人分の大人運賃、1人分の大人特急料金と1人分の寝台料金」、「1人分の小児運賃、2人分の小児特急料金と1人分の寝台料金」である。","ウ":"大人1人と小学校入学前の6歳の幼児1人が、それぞれノビノビ座席（普通車指定席）を使用する場合に必要な運賃及び料金は、「1人分の大人運賃と1人分の大人指定席特急料金」、「1人分の小児運賃」である。","エ":"大人2人が、シングルツイン（B寝台個室）に乗車して補助ベッドを使用する場合に必要な運賃及び料金は、「2人分の大人運賃、2人分の大人特急料金と1人分の寝台料金」である。"},"answer":["ア"],"explain":"寝台料金は1台につき1人分ですが、運賃と特急料金は利用する人ごとに必要です（小学生は小児）。ウは座席を使用する幼児には小児運賃に加えて小児の指定席特急料金も必要、エは補助ベッドの使用分の寝台料金が必要になります。"}]],"R5":[[{"no":"(1)","prompt":"次の記述から、法第1条「目的」に定められているもののみをすべて選んでいるものはどれか。","material":"ａ．旅行業等を営む者の業務の適正な運営の確保\nｂ．旅行業等を営む者を通じた訪日外国人旅行の誘致と国際交流の促進\nｃ．旅行者の利便の増進\nｄ．旅行業務に関する取引の公正の維持","choices":{"ア":"ａ，ｂ","イ":"ａ，ｃ，ｄ","ウ":"ｂ，ｃ，ｄ","エ":"ａ，ｂ，ｃ，ｄ"},"answer":["イ"],"explain":"法第1条の目的は、登録制度の実施、業務の適正な運営の確保、団体の適正な活動の促進、営業保証金制度により、取引の公正の維持、旅行の安全の確保、旅行者の利便の増進を図ることです。ｂの訪日外国人旅行の誘致は目的規定にありません。"},{"no":"(2)","prompt":"報酬を得て、次の行為を事業として行う場合、旅行業の登録を要しないものはどれか。","choices":{"ア":"宿泊事業者が、徒歩のみの日帰り花見ハイキングツアーを販売する行為","イ":"観光協会が、旅行者からの依頼を受けて他人の経営する旅館を手配する行為","ウ":"コンビニエンスストアが、旅行に関する相談に応ずる行為","エ":"全国通訳案内士が、旅行者からの依頼に基づき、新幹線の乗車券類を手配する行為"},"answer":["ア"],"explain":"徒歩のみのツアーは運送・宿泊機関等のサービスの手配を伴わないため旅行業に当たりません。イ・エは手配行為、ウは旅行相談で、いずれも旅行業務として登録が必要です。"},{"no":"(3)","prompt":"登録業務範囲に関する次の記述のうち、誤っているものはどれか（いずれも総合旅行業務取扱管理者を選任しているものとする。）。","choices":{"ア":"第2種旅行業者は、本邦外の企画旅行（受注型に限る。）を実施することができない。","イ":"第3種旅行業者は、本邦内の企画旅行（募集型であって、一の企画旅行ごとに一の拠点区域内において実施されるものに限る。）を実施することができる。","ウ":"地域限定旅行業者は、訪日外国人旅行者を対象とした本邦内の企画旅行（募集型であって、一の企画旅行ごとに一の拠点区域内において実施されるものに限る。）を実施することができる。","エ":"地域限定旅行業者は、法第14条の2第1項の規定により、第1種旅行業者が実施する本邦外の企画旅行（募集型に限る。）について、当該第1種旅行業者を代理して企画旅行契約を締結することができる。"},"answer":["ア"],"explain":"第2種旅行業者が実施できないのは本邦外の募集型企画旅行だけで、本邦外の受注型企画旅行は実施できます。エの受託契約による代理販売は登録業務範囲の制限を受けません。"},{"no":"(4)","prompt":"次の記述のうち、旅行業又は旅行業者代理業の登録の拒否事由に該当しないものはどれか。","choices":{"ア":"刑法の規定により罰金の刑に処せられ、その執行を終わり5年を経過していない者","イ":"暴力団員による不当な行為の防止等に関する法律第2条第6号に規定する暴力団員でなくなった日から5年を経過していない者","ウ":"申請前5年以内に旅行業務に関し不正な行為をした者","エ":"旅行業者代理業を営もうとする者であって、その代理する旅行業を営む者が2以上であるもの"},"answer":["ア"],"explain":"拒否事由となる罰金刑は、旅行業法違反や暴力団関係の一定の罪などに限られます。刑法違反による罰金刑は該当しません。"},{"no":"(5)","prompt":"変更登録等に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者等は、法人である場合であって、その代表者の氏名に変更があったときは、その日から30日以内に、登録行政庁に変更登録申請書を提出しなければならない。","イ":"旅行業者代理業者が地域限定旅行業への変更登録の申請をしようとするときは、その主たる営業所の所在地を管轄する都道府県知事に変更登録申請書を提出しなければならない。","ウ":"第2種旅行業者は、主たる営業所の名称及び所在地について変更があったときは、その日から30日以内に、その主たる営業所の所在地を管轄する都道府県知事に変更登録申請書を提出しなければならない。","エ":"第3種旅行業者が第1種旅行業への変更登録の申請をしようとするときは、観光庁長官に変更登録申請書を提出しなければならない。"},"answer":["エ"],"explain":"業務範囲の変更登録は変更後の業務範囲に応じた登録行政庁に申請するため、第1種への変更は観光庁長官です。ア・ウは変更登録ではなく30日以内の変更届出、イは旅行業者代理業から旅行業になるには新規登録が必要です。"},{"no":"(6)","prompt":"営業保証金に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者は、営業保証金を供託し、供託物受入れの記載のある供託書を受領したときは、直ちにその事業を開始することができる。","イ":"旅行業者が新たに営業所を設置したときは、その日から14日以内に営業保証金を追加して供託しなければならない。","ウ":"地域限定旅行業者が新規登録を受けたことにより営業保証金を供託する場合、国債証券について、その額面金額をもって、営業保証金に充てることができる。","エ":"旅行業者代理業者は、所属旅行業者の主たる営業所の最寄りの供託所に営業保証金を供託しなければならない。"},"answer":["ウ"],"explain":"国債証券は額面金額で営業保証金に充てることができます（地方債・政府保証債は額面の90％、その他は80％）。アは供託した旨を登録行政庁に届け出た後でなければ事業を開始できず、エは代理業者に供託義務はありません。"},{"no":"(7)","prompt":"旅行業務取扱管理者の選任に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者等は、訪日外国人旅行者の本邦内の旅行のみを取り扱う営業所においては、総合旅行業務取扱管理者試験に合格した者を旅行業務取扱管理者として選任しなければならない。","イ":"旅行業者等は、本邦外の旅行について旅行業務を取り扱う営業所においては、総合旅行業務取扱管理者試験に合格した者を旅行業務取扱管理者として選任しなければならない。","ウ":"第3種旅行業者は、拠点区域内の企画旅行（募集型に限る。）のみを取り扱う営業所においては、地域限定旅行業務取扱管理者試験（当該営業所の所在する地域に係るものに限る。）に合格した者を旅行業務取扱管理者として選任しなければならない。","エ":"旅行業者等は、旅行業務に従事した経験が1年未満である者を旅行業務取扱管理者として選任することはできない。"},"answer":["イ"],"explain":"海外旅行を取り扱う営業所には総合旅行業務取扱管理者が必要です。アは本邦内の旅行のみなら国内（地域限定）で足り、ウは国内又は総合の合格者でも選任でき、エのような実務経験年数の要件はありません。"},{"no":"(8)","prompt":"次の記述から、旅行業務取扱管理者の職務として定められているもののみをすべて選んでいるものはどれか。","material":"ａ．法第12条の7及び法第12条の8の規定による広告に関する事項\nｂ．法第6条の4第3項の規定による登録事項の変更の届出に関する事項\nｃ．法第12条の4の規定による取引条件の説明に関する事項\nｄ．法第12条の10の規定による企画旅行の円滑な実施のための措置に関する事項","choices":{"ア":"ａ，ｂ","イ":"ａ，ｃ，ｄ","ウ":"ｂ，ｃ，ｄ","エ":"ａ，ｂ，ｃ，ｄ"},"answer":["イ"],"explain":"登録事項の変更の届出は旅行業者としての手続で、旅行業務取扱管理者の職務としては定められていません。"},{"no":"(9)","prompt":"旅行者から収受する旅行業務の取扱いの料金（企画旅行に係るものを除く。）に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者は、事業の開始後速やかに、旅行者から収受する旅行業務の取扱いの料金を定め、これをその営業所において旅行者に見やすいように掲示しなければならない。","イ":"旅行業者代理業者は、その営業所において、自ら定めた旅行業務の取扱いの料金を旅行者に見やすいように掲示しなければならない。","ウ":"旅行業者は、旅行業務の取扱いの料金を変更しようとするときは、登録行政庁の認可を受けなければならない。","エ":"旅行業務の取扱いの料金は、契約の種類及び内容に応じて定率、定額その他の方法により定められ、旅行者にとって明確でなければならない。"},"answer":["エ"],"explain":"料金は契約の種類・内容に応じて定率、定額その他の方法により明確に定めます。アは事業の開始「前」、イは所属旅行業者が定めた料金、ウは認可も届出も不要です。"},{"no":"(10)","prompt":"旅行業約款に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者が、観光庁長官及び消費者庁長官が定めて公示した標準旅行業約款と同一の旅行業約款を定めたときは、その旨を登録行政庁に届け出なければならない。","イ":"旅行業者等は、旅行業約款をその営業所において、旅行者に見やすいように掲示し、旅行業務に関し契約を締結しようとするときは、旅行業約款の写しを旅行者に交付しなければならない。","ウ":"旅行業者は、旅行業約款について国土交通省令・内閣府令で定める軽微な変更をしようとするときは、登録行政庁の認可を受けることを要しない。","エ":"旅行業者が、観光庁長官及び消費者庁長官が定めて公示した標準旅行業約款よりも旅行者に有利な旅行業約款を定めたときは、当該旅行業約款については、登録行政庁の認可を受けることを要しない。"},"answer":["ウ"],"explain":"軽微な変更には認可が不要です。アは標準旅行業約款と同一であれば認可を受けたものとみなされ、届出も不要。イは掲示又は備置きで足り写しの交付義務はなく、エは旅行者に有利でも認可が必要です。"},{"no":"(11)","prompt":"旅行業者等が旅行業務に関し旅行者と企画旅行契約を締結しようとするときの取引条件の説明及びその際に交付する書面に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者等は、旅行者と契約を締結しようとするときは、旅行者が依頼しようとする旅行業務の内容を確認した上、国土交通省令・内閣府令で定めるところにより、その取引の条件について旅行者に説明しなければならない。","イ":"旅行業者等は、旅行者と契約を締結しようとするときは、当該契約に係る旅行業務取扱管理者の氏名及び旅行者の依頼があれば当該旅行業務取扱管理者が最終的には説明を行う旨を、書面に記載しなければならない。","ウ":"旅行業者等は、旅行者に対し取引条件の説明をするときは、対価と引換えに法第12条の5に規定するサービスの提供を受ける権利を表示した書面を交付する場合であっても、国土交通省令・内閣府令で定める事項を記載した書面を交付しなければならない。","エ":"旅行業者等は、旅行者と契約を締結しようとするときは、旅行の目的地を勘案して、旅行者が取得することが望ましい安全及び衛生に関する情報がある場合にあっては、その旨及び当該情報を書面に記載しなければならない。"},"answer":["ウ"],"explain":"乗車券類など、対価と引換えにサービスの提供を受ける権利を表示した書面を交付する場合には、取引条件説明書面の交付は不要です（説明自体は必要）。"},{"no":"(12)","prompt":"次の記述から、旅行業者等が旅行者と企画旅行契約を締結したときに交付する書面の記載事項として、定められているもののみをすべて選んでいるものはどれか。","material":"ａ．契約の変更及び解除に関する事項\nｂ．企画者の氏名又は名称及び住所並びに登録番号\nｃ．旅行に参加する資格を定める場合にあっては、その旨及び当該資格\nｄ．旅行者の損害の補償に関する事項","choices":{"ア":"ａ，ｂ","イ":"ｃ，ｄ","ウ":"ｂ，ｃ，ｄ","エ":"ａ，ｂ，ｃ，ｄ"},"answer":["エ"],"explain":"いずれも契約書面の記載事項として定められています。"},{"no":"(13)","prompt":"旅行業務取扱管理者の証明書の提示、外務員の証明書携帯等に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者代理業者の外務員の証明書は、必ず当該旅行業者代理業者の所属旅行業者が発行しなければならない。","イ":"旅行業務取扱管理者が、旅行業務について旅行者と契約を締結しようとするときは、旅行者に対し、国土交通省令で定める様式による旅行業務取扱管理者の証明書を必ず提示しなければならない。","ウ":"外務員とは、勧誘員、販売員、外交員その他いかなる名称を有する者であるかを問わず、旅行業者等の役員又は使用人のうち、その営業所以外の場所でその旅行業者等のために旅行業務について取引を行う者をいう。","エ":"外務員は、いかなる場合においても、その所属する旅行業者等に代わって、旅行者との旅行業務に関する取引についての一切の裁判外の行為を行う権限を有するものとみなされる。"},"answer":["ウ"],"explain":"外務員には役員も含まれます。アは当該代理業者自身が発行し、イは旅行者から請求があったときに提示すれば足り、エは旅行者が悪意であったときは除かれます。"},{"no":"(14)","prompt":"企画旅行に参加する旅行者を募集するための広告に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"企画旅行の参加者数があらかじめ企画者が定める人員数を下回った場合に当該企画旅行を実施しないこととするときは、広告にその旨及び当該人員数を表示しなければならない。","イ":"広告には、旅行業務取扱管理者の氏名及び旅行者の依頼があれば当該旅行業務取扱管理者が最終的には説明を行う旨を表示しなければならない。","ウ":"広告において、企画者以外の者の氏名又は名称を表示する場合にあっては、文字の大きさ等に留意して、企画者の氏名又は名称の明確性を確保しなければならない。","エ":"広告には、旅行者が提供を受けることができる運送、宿泊又は食事のサービスの内容に関する事項を表示しなければならない。"},"answer":["イ"],"explain":"旅行業務取扱管理者の氏名等は取引条件説明書面の記載事項であって、募集広告の表示事項ではありません。"},{"no":"(15)","prompt":"次の記述から、旅行業者等が旅行業務について広告するとき、誇大表示をしてはならない事項として定められているもののみをすべて選んでいるものはどれか。","material":"ａ．旅行業者等の業務の範囲、資力又は信用に関する事項\nｂ．旅行地の景観、環境その他の状況に関する事項\nｃ．旅行に関するサービスの品質その他の内容に関する事項\nｄ．旅行者が旅行業者等に支払うべき対価に関する事項","choices":{"ア":"ａ，ｃ","イ":"ａ，ｂ，ｄ","ウ":"ｂ，ｃ，ｄ","エ":"ａ，ｂ，ｃ，ｄ"},"answer":["エ"],"explain":"いずれも誇大広告が禁止される事項です。このほか、旅程管理業務を行う者の同行の有無や旅行者の安全の確保に関する事項なども定められています。"},{"no":"(16)","prompt":"標識に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者代理業者は、営業所において、所属旅行業者の標識を公衆に見やすいように掲示しなければならない。","イ":"旅行業者等以外の者は、国土交通省令で定める様式の標識又はこれに類似する標識を掲示してはならない。","ウ":"旅行業者の標識には、登録番号、登録年月日及び登録の有効期間が記載事項として定められている。","エ":"標識の受託取扱企画旅行の欄は、取り扱っている企画旅行の企画者が明確となるよう記載しなければならない。"},"answer":["ア"],"explain":"旅行業者代理業者は、所属旅行業者の標識ではなく、旅行業者代理業者用の様式の標識を自ら掲示します。"},{"no":"(17)","prompt":"企画旅行の円滑な実施のための措置に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者は、旅行者からの依頼により旅行に関する計画を作成し、これにより実施する企画旅行については、2人以上の旅行者が同一の日程により行動することを要する区間における集合時刻、集合場所その他の事項に関する指示を行うことを要しない。","イ":"旅行業者は、本邦内の旅行であって、契約の締結の前に旅行者に対し、旅行地において計画に定めるサービスの提供を受けるために必要な手続の実施その他の措置を講じない旨を説明すれば、当該措置を講じることを要しない。","ウ":"旅行業者は、旅行に関する計画に定めるサービスの内容の変更を必要とする事由が生じた場合においては、その事由が旅行業者の関与し得ないものであるときを除き、代替サービスの手配及び当該サービスの提供を受けるために必要な手続の実施その他の措置を講じなければならない。","エ":"旅行業者は、旅行に関する計画に定めるサービスの旅行者への確実な提供を確保するために旅行の開始前に必要な予約その他の措置を講じなければならない。"},"answer":["エ"],"explain":"旅行開始前に予約等の措置を講じることが必要です。アは受注型でも指示が必要、イは説明に加えてその旨を記載した書面の交付も必要、ウは旅行業者の関与し得ない事由であっても代替サービスの手配等の措置が必要です。"},{"no":"(18)","prompt":"旅程管理業務を行う者に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者は、道路交通法違反により罰金刑に処せられ、その執行を受けることがなくなった日から3年しか経過していない者を、旅程管理業務を行う主任の者として選任することはできない。","イ":"国土交通省令で定める旅程管理業務に関する実務の経験は、登録研修機関が実施する旅程管理研修の課程を修了した日から1年以内に1回以上又は当該研修の課程を修了した日の前後3年以内に2回以上の旅程管理業務に従事した経験に限られる。","ウ":"企画旅行に参加する旅行者に同行して旅程管理業務を行う者として旅行業者によって選任される者が複数の場合において、当該旅程管理業務を行う者のうち主任の者は、旅程管理業務を行う主任の者の資格要件を満たすものでなければならない。","エ":"旅程管理業務を行う主任の者の指導による本邦内における旅程管理業務に相当する実務の研修を受けた経験に限り、国土交通省令で定める旅程管理業務に従事した経験とみなす。"},"answer":["ウ"],"explain":"同行する者が複数のときは、主任の者だけが資格要件を満たしていれば足ります。イの実務経験は「研修修了日の前後1年以内に1回以上」又は「修了日から3年以内に2回以上」で、期間が入れ替わっています。"},{"no":"(19)","prompt":"法第13条「禁止行為」に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者等は、宿泊のサービスを提供する者（旅館業法第3条の2第1項に規定する営業者を除く。）と取引を行う際に、当該者が住宅宿泊事業法第3条第1項の届出をした者であるかどうかの確認を怠る行為をしてはならない。","イ":"旅行業者等は、旅行業務に関し取引をした者に対し、その取引によって生じた債務の履行をいかなる場合も遅延する行為をしてはならない。","ウ":"旅行業者等は、運送サービス（専ら企画旅行の実施のために提供されるものに限る。）を提供する者に対し、輸送の安全の確保を不当に阻害する行為を行ってはならない。","エ":"旅行業者等は、旅行者に対し、旅行地において施行されている法令に違反するサービスの提供を受けることをあっせんし、又はその提供を受けることに関し便宜を供与してはならない。"},"answer":["イ"],"explain":"禁止されているのは債務の履行を「不当に」遅延する行為です。"},{"no":"(20)","prompt":"受託契約に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者は、受託契約を締結したときは、法第3条の規定にかかわらず、旅行業者代理業の登録を受けなくても、他の旅行業者が実施する企画旅行（募集型に限る。）について、当該他の旅行業者を代理して企画旅行契約を締結することができる。","イ":"第1種旅行業者は、地域限定旅行業者を委託旅行業者とする受託契約を締結することができる。","ウ":"旅行業者が受託契約を締結したときは、受託業務の取扱いを開始しようとする日までに、登録行政庁にその旨を届け出なければならない。","エ":"委託旅行業者及び受託旅行業者は、受託契約において、委託旅行業者を代理して企画旅行契約を締結することができる受託旅行業者又はその受託旅行業者代理業者の営業所を定めておかなければならない。"},"answer":["ウ"],"explain":"受託契約を締結したことについて、登録行政庁への届出は必要ありません。"},{"no":"(21)","prompt":"旅行業者代理業者に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者代理業の登録は、当該旅行業者代理業者が所属旅行業者のために旅行業務を取り扱うことを内容とする契約が効力を失ったときは、その効力を失う。","イ":"旅行業者代理業者は、所属旅行業者の登録の有効期間満了の後、引き続き旅行業者代理業を営もうとするときは、登録行政庁の行う有効期間の更新の登録を受けなければならない。","ウ":"旅行業者代理業者は、旅行業務に関し取引をしようとするときは、旅行業者代理業者である旨を取引の相手方に明示すれば、所属旅行業者の氏名又は名称を明示することを要しない。","エ":"所属旅行業者が、受託契約において受託旅行業者代理業者を定めたときは、当該受託旅行業者代理業者は、所属旅行業者に加え、委託旅行業者のためにすべての旅行業務を取り扱うことができる。"},"answer":["ア"],"explain":"所属旅行業者との契約が効力を失えば代理業の登録も失効します。イは代理業の登録に有効期間はなく、ウは所属旅行業者の氏名又は名称も明示が必要、エは委託旅行業者のために取り扱えるのは募集型企画旅行契約の締結に限られます。"},{"no":"(22)","prompt":"次の記述から、法第18条の3「業務改善命令」として、定められているもののみをすべて選んでいるものはどれか。","material":"ａ．企画旅行に関し旅行者から収受する対価を変更すること。\nｂ．旅行者に生じた損害を賠償するために必要な金額を担保することができる保険契約を締結すること。\nｃ．企画旅行の円滑な実施のための措置を確実に実施すること。\nｄ．旅行業務取扱管理者を解任すること。","choices":{"ア":"ａ，ｂ，ｃ","イ":"ａ，ｃ，ｄ","ウ":"ｂ，ｃ，ｄ","エ":"ａ，ｂ，ｃ，ｄ"},"answer":["エ"],"explain":"いずれも業務改善命令として定められています。このほか旅行業約款の変更なども命ずることができます。"},{"no":"(23)","prompt":"旅行サービス手配業に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行サービス手配業者は、旅行サービス手配業務に関し取引をする者と契約を締結したときに当該取引をする者に対し交付する書面に、旅行者に提供すべき旅行に関するサービスの内容を記載しなければならない。","イ":"旅行サービス手配業者は、営業所において、国土交通省令で定める様式の標識を、公衆に見やすいように掲示しなければならない。","ウ":"旅行サービス手配業者は、旅行サービス手配業務を取り扱う者が1人である営業所についても旅行サービス手配業務取扱管理者を選任しなければならないが、本邦内の旅行のみについて旅行サービス手配業務を取り扱う営業所にあっては、総合旅行業務取扱管理者試験又は国内旅行業務取扱管理者試験に合格した者を選任することができる。","エ":"旅行サービス手配業者は、旅行サービス手配業務に関し取引をする者に対し、その取引に関する重要な事項について、故意に事実を告げず、又は不実のことを告げる行為をしてはならない。"},"answer":["イ"],"explain":"標識の掲示義務は旅行業者等に課されているもので、旅行サービス手配業者には定められていません。"},{"no":"(24)","prompt":"次の記述のうち、旅行業協会が適正かつ確実に実施しなければならない業務として定められていないものはどれか。","choices":{"ア":"社員である旅行業者からの手配依頼により、当該旅行業者と取引をした旅行に関するサービスを提供する者に対し、その取引によって生じた債権に関し弁済をする業務","イ":"旅行者及び旅行に関するサービスを提供する者からの旅行業者等又は旅行サービス手配業者の取り扱った旅行業務又は旅行サービス手配業務に対する苦情の解決","ウ":"旅行業務及び旅行サービス手配業務に関する取引の公正の確保又は旅行業、旅行業者代理業及び旅行サービス手配業の健全な発達を図るための調査、研究及び広報","エ":"旅行業務又は旅行サービス手配業務の取扱いに従事する者に対する研修"},"answer":["ア"],"explain":"弁済業務の対象は、社員である旅行業者等と旅行業務に関し取引をした旅行者に限られ、旅行に関するサービスを提供する者は除かれます。"},{"no":"(25)","prompt":"弁済業務保証金制度に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業協会が供託している弁済業務保証金から弁済を受ける権利を実行しようとする者は、その債権について登録行政庁の認証を受けなければならない。","イ":"旅行業協会の保証社員である旅行業者の弁済限度額は、当該旅行業者が営業保証金の供託の免除の規定の適用がないとしたならば当該旅行業者が供託すべきこととなる営業保証金の額を下ることができない。","ウ":"旅行業協会は、弁済業務保証金分担金の納付を受けたときは、直ちに、その納付を受けた額に相当する額の弁済業務保証金を旅行業協会の住所の最寄りの供託所に供託しなければならない。","エ":"旅行業協会に加入しようとする旅行業者は、登録行政庁から新規登録を受けた旨の通知を受けた日から7日以内に、旅行業協会に弁済業務保証金分担金を納付しなければならない。"},"answer":["イ"],"explain":"保証社員の弁済限度額は、営業保証金の免除がないとした場合に供託すべき営業保証金の額を下ることができません。アの認証は旅行業協会が行い、ウは納付を受けた日から7日以内の供託、エは加入しようとする日までの納付です。"}],[{"no":"(1)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「適用範囲」「用語の定義」に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者が法令に反せず、かつ、旅行者の不利にならない範囲で口頭のみにより特約を結んだときは、その特約は約款に優先して適用される。","イ":"旅行業者が旅行者との間で締結する契約において、約款に定めのない事項については、法令又は一般に確立された慣習によるが、ここでいう法令とは、消費者契約法に限定される。","ウ":"「海外旅行」とは、本邦外のみの旅行をいい、「国内旅行」とは、海外旅行以外の旅行をいう。","エ":"「カード利用日」とは、旅行者又は旅行業者が契約に基づく旅行代金等の支払又は払戻債務を履行すべき日をいう。"},"answer":["エ"],"explain":"カード利用日の定義どおりです。アの特約は書面によることが必要、イの法令は消費者契約法に限られません。ウは定義が逆で、「国内旅行」が本邦内のみの旅行、「海外旅行」が国内旅行以外の旅行です。"},{"no":"(2)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行契約の内容」「手配代行者」「契約の申込み」に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"通信契約の申込みをしようとする旅行者は、旅行業者所定の申込書に所定の事項を記入の上、旅行業者が別に定める金額の申込金とともに旅行業者に提出しなければならない。","イ":"旅行業者は、契約の履行に当たって、手配の全部又は一部を本邦内又は本邦外の他の旅行業者、手配を業として行う者その他の補助者に代行させることがある。","ウ":"旅行者が旅行の参加に際し、特別な配慮を必要とする旨を、契約の申込時に申し出たときは、旅行業者は可能な範囲内でこれに応じ、この申出に基づき、旅行業者が旅行者のために講じた特別な措置に要する費用は、旅行業者の負担とする。","エ":"旅行業者は、契約において、旅行者が旅行業者の定める旅行日程に従って、運送・宿泊機関等の提供するサービスの提供を受けることができるように、手配することのみを引き受ける。"},"answer":["イ"],"explain":"手配代行者は本邦内外を問いません。アは通信契約では申込書・申込金の提出は不要、ウの特別な措置に要する費用は旅行者の負担、エは手配に加えて旅程管理も引き受けます。"},{"no":"(3)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「電話等による予約」「契約締結の拒否」に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者は、電話、郵便、ファクシミリ、インターネットその他の通信手段による契約の予約を受け付ける。この場合、予約の時点では契約は成立していない。","イ":"旅行業者は、旅行業者の定める期間内に旅行者が申込金を提出しない場合又は会員番号等を通知しない場合は、予約がなかったものとして取り扱い、取消料に相当する額の違約料を申し受ける。","ウ":"旅行業者は、応募旅行者数が募集予定数に達したときは、契約の締結に応じないことがある。","エ":"旅行業者は、業務上の都合があるとの理由で、契約の締結に応じないことがある。"},"answer":["イ"],"explain":"期間内に申込金の提出や会員番号等の通知がないときは、予約がなかったものとして取り扱うだけで、違約料を収受することはありません。"},{"no":"(4)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「契約の成立時期」「契約書面の交付」「確定書面」に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"通信契約は、旅行業者が契約の締結を承諾する旨の通知が旅行者に到達した時に成立する。","イ":"旅行業者は、契約の成立後、旅行者から請求があったときに限り、旅行者に、旅行日程、旅行サービスの内容、旅行代金その他の旅行条件及び旅行業者の責任に関する事項を記載した書面を交付する。","ウ":"旅行業者は、確定書面を交付する場合において、手配状況の確認を希望する旅行者から問い合わせがあったときは、確定書面の交付前であっても、迅速かつ適切にこれに回答する。","エ":"旅行業者が確定書面を交付した場合には、旅行業者が手配し旅程を管理する義務を負う旅行サービスの範囲は、当該確定書面に記載するところに特定される。"},"answer":["イ"],"explain":"契約書面は旅行者からの請求の有無にかかわらず、契約の成立後速やかに交付しなければなりません。"},{"no":"(5)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「契約内容の変更」「旅行代金の額の変更」に関する次の記述から、正しいもののみをすべて選んでいるものはどれか。","material":"ａ．旅行業者は、関与し得ない事由が生じた場合において、旅行の安全かつ円滑な実施を図るためやむを得ないときは、旅行者にあらかじめ速やかに理由及び因果関係を説明して、契約の内容を変更することがある。ただし、緊急の場合においてやむを得ないときは、変更後に説明する。\nｂ．旅行業者は、利用する宿泊機関について適用を受ける料金が、著しい経済情勢の変化等により、旅行の募集の際に明示した時点の料金に比べて通常想定される程度を大幅に超えて増額される場合は、その範囲内で旅行代金の額を増加することができる。\nｃ．宿泊機関が宿泊サービスの提供を行っているにもかかわらず、部屋の不足が発生したことにより、旅行業者が契約内容の一部を変更し費用の増加が生じる場合には、旅行業者は、過失がない場合に限り、その費用の範囲内において旅行代金を増額することがある。\nｄ．旅行業者は、運送・宿泊機関等の利用人員により旅行代金が異なる旨を契約書面に記載した場合において、契約の成立後に旅行業者の責に帰すべき事由によらず当該利用人員が変更になったときは、契約書面に記載したところにより旅行代金の額を変更することがある。","choices":{"ア":"ａ，ｄ","イ":"ｂ，ｃ","ウ":"ａ，ｂ，ｄ","エ":"ａ，ｂ，ｃ，ｄ"},"answer":["ア"],"explain":"経済情勢の変化等により旅行代金を変更できるのは運送機関の運賃・料金が改定された場合で、ｂの宿泊料金は対象外です。ｃの過剰予約受付等による宿泊機関の変更に伴う費用増は旅行業者の負担で、旅行代金を増額できません。"},{"no":"(6)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行者の解除権」に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者と契約を締結した旅行者は、旅行開始前、旅行開始後にかかわらず所定の取消料を当該旅行業者に支払って契約を解除することができる。","イ":"利用する運送機関の適用運賃・料金が、著しい経済情勢の変化等により通常想定される程度を大幅に超えて増額されたことにより旅行代金が増額されたときは、旅行者は旅行開始前に所定の取消料を支払うことなく契約を解除することができる。","ウ":"航空会社の運航スケジュールの変更によって、契約書面に記載された旅行終了日が変更されたときは、旅行者は旅行開始前に所定の取消料を支払うことなく契約を解除することができる。","エ":"旅行者が自宅から旅行の開始地である集合場所へ向かうために利用した交通機関が大幅に遅延したことにより、当該旅行への参加が不可能となったときは、当該旅行者は所定の取消料を支払うことなく契約を解除することができる。"},"answer":["エ"],"explain":"旅行者が利用した交通機関の遅延は旅行者側の事情であり、取消料なしで解除できる事由には当たりません。ウの旅行終了日の変更は契約内容の重要な変更に当たります。"},{"no":"(7)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の解除権等－旅行開始前の解除」に関する次の記述のうち、正しいものはどれか（いずれも解除に係る旅行者への理由説明は行うものとする。）。","choices":{"ア":"旅行業者は、観梅を目的とする国内日帰り旅行における必要な開花状況等の旅行実施条件であって、契約の締結の際に明示したものが成就しないおそれが極めて大きいときは、契約を解除することがある。","イ":"旅行業者は、旅行者から契約内容に関し、合理的な範囲を超える負担を求められたため契約を解除しようとするときは、国内日帰り旅行にあっては、旅行開始日の前日から起算してさかのぼって3日目に当たる日より前に、当該契約を解除する旨を当該旅行者に通知しなければならない。","ウ":"旅行業者は、2泊3日の国内旅行にあっては、旅行者の数が契約書面に記載した最少催行人員に達しなかったという事由で契約を解除しようとするときは、旅行開始日の前日から起算してさかのぼって23日目に当たる日より前に、旅行を中止する旨を旅行者に通知しなければならない。","エ":"旅行業者は、旅行者が契約書面に記載する期日までに旅行代金を支払わないときは、当該期日において旅行者が契約を解除したものとし、この場合において、旅行者は、旅行業者に対し、所定の取消料に相当する額の違約料を支払わなければならない。"},"answer":["ア"],"explain":"契約締結の際に明示した旅行実施条件が成就しないおそれが極めて大きいときは解除できます。イのような通知期限の定めはなく、ウは宿泊を伴う国内旅行では13日目に当たる日より前、エは当該期日の「翌日」において解除したものとされます。"},{"no":"(8)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の解除権－旅行開始後の解除」「契約解除後の帰路手配」に関する次の記述のうち、誤っているものはどれか（いずれも解除に係る旅行者への理由説明は行うものとする。）。","choices":{"ア":"旅行業者は、旅行者が必要な介助者の不在により旅行の継続に耐えられないため、旅行開始後に契約の一部を解除したときは、旅行代金のうちいまだ提供を受けていない旅行サービスに係る金額から、取消料、違約料その他の既に支払い、又はこれから支払わなければならない費用を差し引いたものを旅行者に払い戻す。","イ":"旅行業者は、添乗員が病気になったため、当該添乗員による旅程管理業務の遂行が不可能となったときは、契約の一部を解除することができる。","ウ":"旅行業者は、官公署の命令により旅行の継続が不可能となったため、旅行開始後に契約の一部を解除したときは、旅行者の求めに応じて、旅行者が当該旅行の出発地に戻るために必要な旅行サービスの手配を引き受ける。","エ":"旅行開始後、旅行地で発生した天災地変により旅行の継続が不可能となったため、旅行業者が契約の一部を解除したときは、旅行者との間の契約関係は、将来に向かってのみ消滅する。"},"answer":["イ"],"explain":"添乗員の病気は旅行業者側の事情であり、旅行開始後の解除事由として定められていません。旅行業者は代替の措置を講じる必要があります。"},{"no":"(9)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行代金の払戻し」に関する次の記述のうち、誤っているものはどれか（いずれも通信契約でないものとする。）。","choices":{"ア":"旅行開始後に、旅行地において大雪の影響で旅行の継続が不可能となったため、旅行業者が契約内容を変更し旅行日程を短縮したことにより旅行代金が減額された場合において、払い戻すべき金額が生じたときは、旅行業者は、契約書面に記載した旅行終了日の翌日から起算して30日以内に当該金額を払い戻す。","イ":"10月1日出発の3泊4日の国内旅行で旅行者が旅行開始後に病気になり、旅行の継続に耐えられないため、旅行業者が契約の一部を解除した場合において、払い戻すべき金額が生じたときは、旅行業者は、同年11月3日までに当該金額を払い戻さなければならない。","ウ":"国内日帰り旅行において、旅行者の数が最少催行人員に達しなかったため、旅行業者が旅行開始日の前日から起算してさかのぼって6日目に当たる日に旅行を中止する旨を通知して契約を解除する場合において、払い戻すべき金額が生じたときは、旅行業者は、旅行開始日までに当該金額を払い戻さなければならない。","エ":"9月8日を旅行開始日とする国内旅行において、旅行者の都合により9月6日に契約を解除した場合において、払い戻すべき金額が生じたときは、旅行業者は9月13日までに当該旅行者に対し当該金額を払い戻さなければならない。"},"answer":["ウ"],"explain":"旅行開始前の解除による払戻しの期限は「解除の翌日から起算して7日以内」で、「旅行開始日まで」ではありません。イ・エはいずれもこの期限に当てはめた正しい日付です。"},{"no":"(10)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「団体・グループ契約」「契約責任者」に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者は、契約責任者が団体・グループに同行しない場合、旅行開始後においては、あらかじめ契約責任者が選任した構成者を契約責任者とみなす。","イ":"旅行契約は、通信契約を締結した場合を除き、旅行業者が契約の締結を承諾し申込金を受理した時に成立するが、団体・グループ契約の場合においては、申込金の支払いを受けることなく当該契約の締結を承諾することがある。","ウ":"日帰りの国内旅行であって、添乗員その他の者が当該旅行に同行する場合においても、契約責任者は、旅行業者が定める日までに、構成者の名簿を旅行業者に提出しなければならない。","エ":"旅行業者は、契約責任者が構成者に対して現に負い、又は将来負うことが予測される債務又は義務については、何らの責任を負うものではない。"},"answer":["イ"],"explain":"申込金の支払いを受けずに契約の締結を承諾することがあるのは受注型企画旅行契約や手配旅行契約の団体・グループ契約の定めで、募集型企画旅行契約にはこの定めがありません。"},{"no":"(11)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅程管理」「旅行業者の指示」「添乗員等の業務」に関する次の記述から、正しいもののみをすべて選んでいるものはどれか。","material":"ａ．旅行業者は、旅程管理の措置を講じたにもかかわらず旅行サービスの内容を変更するときは、変更後の旅行サービスが当初のものと同様となるよう努めること等、契約内容の変更を最小限にとどめるよう努力する。\nｂ．旅行業者は、旅行の内容により添乗員その他の者を同行させて、旅程管理業務その他当該旅行に付随して必要と認める業務の全部を行わせることはできないが、その一部を行わせることはできる。\nｃ．旅行業者は、旅行者の安全かつ円滑な旅行の実施を確保することに努力し、旅行者が旅行中に旅行サービスを受けることができないおそれがあると認められるときは、契約に従った旅行サービスの提供を確実に受けられるために必要な措置を講ずる。\nｄ．旅行者は、旅行開始後旅行終了までの間において、団体で行動するときは、旅行を安全かつ円滑に実施するための旅行業者の指示に従わなければならない。","choices":{"ア":"ａ，ｂ","イ":"ｃ，ｄ","ウ":"ａ，ｃ，ｄ","エ":"ａ，ｂ，ｃ，ｄ"},"answer":["ウ"],"explain":"ｂは誤りで、添乗員その他の者には旅程管理業務その他の業務の全部又は一部を行わせることができます。"},{"no":"(12)","group":"標準旅行業約款（募集型企画旅行）","prompt":"募集型企画旅行契約の部「旅行業者の責任」「旅行者の責任」に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行者の過失により旅行業者が損害を被ったときは、当該旅行者は、旅行業者に対し、15万円を限度（当該旅行者に重大な過失があった場合を除く。）として賠償しなければならない。","イ":"旅行業者は、運送機関の運送サービス提供の中止により旅行者が損害を被ったときは、いかなる場合においてもその損害を賠償する責任を負わない。","ウ":"旅行者は、旅行開始後において、契約書面に記載された旅行サービスを円滑に受領するため、万が一契約書面と異なる旅行サービスが提供されたと認識したときは、旅行終了後速やかにその旨を旅行業者に申し出なければならない。","エ":"旅行業者は、契約の履行に当たって、旅行業者の故意又は過失により旅行者に損害（手荷物について生じた損害を除く。）を与えたときは、損害発生の翌日から起算して2年以内に旅行者から当該旅行業者に対して通知があったときに限り、その損害を賠償する責に任じる。"},"answer":["エ"],"explain":"手荷物以外の損害の通知期間は損害発生の翌日から起算して2年以内です。アの旅行者の賠償責任に限度額はなく、イも旅行業者に故意又は過失があれば責任を負い、ウは旅行地において速やかに申し出る必要があります。"},{"no":"(13)","group":"標準旅行業約款（受注型企画旅行）","prompt":"受注型企画旅行契約の部に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"旅行業者は、企画書面において旅行代金の内訳として企画料金の金額を明示した場合、旅行者から当該書面に記載された企画の内容に関して契約の申込みがなかった場合であっても、当該旅行者から企画料金を収受することができる。","イ":"旅行者は、旅行業者に対し、旅行日程、旅行サービスの内容その他の契約の内容を変更するよう求めることができるが、その結果、旅行代金が増額されたときは、当該増額分に加えて変更手続料金も当該旅行者の負担とする。","ウ":"「受注型企画旅行」とは、旅行業者が、旅行者からの依頼により、旅行の目的地及び日程、旅行者が提供を受けることができる運送又は宿泊のサービスの内容並びに旅行代金の額を定めた旅行に関する計画を作成し、これにより実施する旅行をいう。","エ":"旅行業者は、旅行中の旅行者が、疾病、傷害等により保護を要する状態にあると認めたときは、必要な措置を講ずることがある。この場合において、当該措置に要した費用は、当該旅行業者の責任の有無にかかわらず、旅行業者が負担する。"},"answer":["ウ"],"explain":"受注型企画旅行の定義どおりです。アは契約の申込みがなければ企画料金を収受できず、エの保護措置に要した費用は旅行業者の責に帰すべき事由がある場合を除き旅行者の負担です。"},{"no":"(14)","group":"標準旅行業約款（旅程保証）","prompt":"募集型・受注型企画旅行契約の部「旅程保証」に関する次の記述のうち、正しいものはどれか（変更補償金を支払う場合、その額は約款が定める最低額を上回っているものとする。）。","choices":{"ア":"旅行業者は、変更補償金の支払いが必要となる契約内容の重要な変更が生じた場合、当該変更が生じた日から起算して30日以内に変更補償金を旅行者に支払わなければならない。","イ":"旅行業者が旅行者に変更補償金を支払った後に、当該契約内容の重要な変更について旅行業者に責任が発生することが明らかになった場合には、旅行業者は当該変更に係る変更補償金に加え損害賠償金を支払わなければならない。","ウ":"旅行業者は、旅行者から契約内容の重要な変更があった旨の申出を受けた場合に限り、変更補償金を支払わなければならない。","エ":"旅行業者が、変更補償金の支払いが必要となる契約内容の重要な変更が1件生じたことを旅行開始日に旅行者に通知した場合、旅行業者は、旅行代金に約款に定める旅行開始後の1件あたりの率を乗じた額以上の変更補償金を旅行者に対して支払わなければならない。"},"answer":["エ"],"explain":"旅行開始日以降に通知した変更は「旅行開始後」の率が適用されます。アの支払期限は旅行終了日の翌日から起算して30日以内、イの変更補償金は損害賠償金の一部とみなされ、ウの旅行者からの申出は支払いの要件ではありません。"},{"no":"(15)","group":"標準旅行業約款（旅程保証）","prompt":"募集型・受注型企画旅行契約の部「旅程保証」に関する次の記述のうち、変更補償金の支払いを要するものはどれか（変更補償金を支払う場合、その額は約款が定める最低額を上回っているものとする。）。","choices":{"ア":"確定書面に「伊丹空港発 奄美空港行き A航空直行便」と記載したが、航空会社の過剰予約受付により、「A航空の伊丹空港発 鹿児島空港乗り継ぎで奄美空港着」に変更したとき。","イ":"利用予定列車が沿線火災の影響により大幅に遅延したため、目的地への到着が夕刻になり、確定書面に記載した美術館への入場ができなかったとき。","ウ":"旅行者の生命又は身体の安全確保のために必要な措置を講じたことにより、確定書面に利用ホテルとして記載したCホテルを、契約書面に記載のないDホテルに変更したとき。","エ":"確定書面には利用航空会社として「A航空のエコノミークラス」と記載したが、旅行開始後にA航空の過剰予約受付により座席の不足が発生したため、契約書面に記載のある「B航空のエコノミークラス」に変更したとき。"},"answer":["エ"],"explain":"運送機関の会社名の変更は補償対象で、原因が過剰予約受付のため免責されません。アは同一空港発着・同一会社の乗継便への変更で対象外、イは列車の遅延による入場不能、ウは旅行者の生命・身体の安全確保のための措置で、いずれも対象外です。"},{"no":"(16)","group":"標準旅行業約款（特別補償）","prompt":"募集型・受注型企画旅行契約の部「特別補償」「特別補償規程」に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者は、当該旅行業者の責任が生じるか否かを問わず、特別補償規程で定めるところにより、旅行者が企画旅行参加中にその生命、身体又は手荷物の上に被った一定の損害について、あらかじめ定める額の補償金及び見舞金を支払う。","イ":"特別補償規程に基づく旅行業者の補償金支払義務は、旅行業者が損害賠償責任に基づく損害賠償金を支払う場合、その損害賠償金に相当する額だけ縮減する。","ウ":"添乗員、旅行業者の使用人又は代理人による受付が行われない場合において、旅行者がサービスの提供を受ける最初の運送・宿泊機関等が船舶であるときは、当該船舶乗船時から企画旅行参加中となる。","エ":"旅行者が企画旅行参加中の事故により傷害を被り、その直接の結果として入院し、事故の日から180日以内に後遺障害が生じた場合、旅行業者は後遺障害補償金に加えて入院見舞金を支払う。"},"answer":["ウ"],"explain":"最初の運送機関が船舶の場合、企画旅行参加中となるのは乗船時ではなく乗船手続の完了時からです。"},{"no":"(17)","group":"標準旅行業約款（特別補償）","prompt":"募集型・受注型企画旅行契約の部「特別補償規程」に関する次の記述から、入院見舞金、通院見舞金又は携帯品損害補償金の支払いの対象となるものをすべて選んでいるものはどれか。","material":"ａ．国内企画旅行の日程に含まれている山岳登はん中（ピッケル、アイゼン等の登山用具を使用するもの）に発生した大地震による落石事故によって被った傷害による30日間の入院\nｂ．国内企画旅行に参加中の旅行者が、その自由行動日に、法令に定められた運転資格を持たないで自動車を運転している間に生じた事故により、当該旅行者以外の当該企画旅行参加中の旅行者が巻き添えとなって被った傷害による7日間の入院\nｃ．自由行動中に誤って落としたことにより、機能に支障をきたしたデジタルカメラ\nｄ．野球観戦ツアーに参加中の旅行者が、野球場の座席に置き忘れた双眼鏡","choices":{"ア":"ａ，ｂ","イ":"ａ，ｃ","ウ":"ｂ，ｃ","エ":"ａ，ｂ，ｄ"},"answer":["ウ"],"explain":"ｂの巻き添えとなった旅行者は補償の対象です（無資格運転をしていた本人は免責）。ｃの落下による損害も対象です。ｄの置き忘れ・紛失は対象外で、ａは国内旅行中の地震による傷害のため対象外です。"},{"no":"(18)","group":"標準旅行業約款（手配旅行）","prompt":"手配旅行契約の部に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"「旅行代金」とは、旅行業者が旅行サービスを手配するために、運賃、宿泊料その他の運送・宿泊機関等に対して支払う費用及び旅行業者所定の旅行業務取扱料金（変更手続料金及び取消手続料金を除く。）をいう。","イ":"旅行業者は、運送サービスの手配のみを目的とする契約であって、旅行代金と引換えに当該運送サービスの提供を受ける権利を表示した書面を交付するものについては、口頭による申込みを受け付けることがある。この場合において、契約は、旅行業者が契約の締結を承諾した時に成立するものとする。","ウ":"旅行業者は、書面による特約をもって、申込金の支払いを受けることなく、契約の締結の承諾のみにより契約を成立させることがある。","エ":"「手配旅行契約」とは、旅行業者が旅行者の委託により、旅行者のために代理、媒介又は取次をすること等により旅行者が運送・宿泊機関等の提供するサービスの提供を受けることができるように、手配し、旅程を管理することを引き受ける契約をいう。"},"answer":["エ"],"explain":"手配旅行契約は手配することを引き受ける契約であり、旅程管理までは引き受けません（旅程管理を引き受けるのは企画旅行契約です）。"},{"no":"(19)","group":"標準旅行業約款（手配旅行）","prompt":"手配旅行契約の部に関する次の記述から、誤っているもののみをすべて選んでいるものはどれか。","material":"ａ．旅行開始前に運送機関の運賃・料金の改訂により旅行代金の変動を生じ、旅行業者によって旅行代金が増額されたときは、旅行者は、旅行業者が得るはずであった取扱料金を支払うことなく、契約を解除することができる。\nｂ．旅行業者は、契約責任者からの求めにより、団体・グループに添乗員を同行させることがあるが、添乗員が行う添乗サービスの内容は、原則として、あらかじめ定められた旅行日程上、団体・グループ行動を行うために必要な業務とする。\nｃ．旅行業者は、旅行業者が手配するすべての旅行サービスについて乗車券類、宿泊券その他の旅行サービスの提供を受ける権利を表示した書面を旅行者に交付するときは、必ず契約書面を交付しなければならない。\nｄ．旅行者の都合により旅行開始前に契約が解除されたときは、旅行者はいまだ提供を受けていない旅行サービスに係る取消料、違約料その他の費用を負担するほか、旅行業者に対し、所定の取消手続料金及び旅行業者が得るはずであった取扱料金を支払わなければならない。","choices":{"ア":"ａ，ｃ","イ":"ｂ，ｄ","ウ":"ａ，ｂ，ｃ","エ":"ａ，ｂ，ｃ，ｄ"},"answer":["ア"],"explain":"ａは旅行代金の増額に伴って解除する場合でも取扱料金の支払いが必要です。ｃは乗車券類等の書面を交付するときは契約書面の交付に代えることができます。"},{"no":"(20)","group":"標準旅行業約款（旅行相談）","prompt":"旅行相談契約の部に関する次の記述のうち、誤っているものはどれか。","choices":{"ア":"旅行業者は、契約の成立後すみやかに、旅行者に当該契約に係る相談内容、相談料金及びその収受の方法、旅行業者の責任その他の必要な事項を記載した書面を交付しなければならない。","イ":"旅行業者は、契約の履行に当たって、故意又は過失により旅行者に損害を与えたときは、その損害発生の翌日から起算して6月以内に当該旅行業者に対して通知があったときに限り、その損害を賠償する責に任じる。","ウ":"旅行業者が、相談料金を収受することを約して、旅行者の委託により旅行地及び運送・宿泊機関等に関する情報提供のみを行う業務を引き受けることは、旅行相談契約に該当する。","エ":"旅行業者が、旅行者から電話による旅行相談契約の申込みを受け付ける場合、契約は、当該旅行業者が当該契約の締結を承諾した時に成立する。"},"answer":["ア"],"explain":"アが旅行相談契約の部の定めと異なります。イの通知期間6月、ウの情報提供のみの引受け、エの通信手段による申込みの成立時期は、いずれも約款どおりです。"},{"no":"2","group":"一般貸切旅客自動車運送事業標準運送約款","prompt":"一般貸切旅客自動車運送事業標準運送約款に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"バス会社は、バス会社の自動車の運行上の過失によって、旅客の生命又は身体を害したときは、これによって生じた損害を賠償する責に任じるが、その場合において、バス会社の旅客に対する責任は、その損害が車内において、又は旅客の乗降中に生じた場合に限られる。","イ":"バス会社は、旅行業者が企画旅行の実施のため、バス会社に旅客の運送を申し込む場合には、当該旅行業者を契約責任者として運送契約を締結する。","ウ":"バス会社は、天災その他の事由により輸送の安全の確保に支障が生ずるおそれがあるときには、運行行程の変更、一時待機、運行の中止その他の措置を講ずることがある。","エ":"運送契約は、旅客から運送申込書の提出があり、バス会社がこれを受理したときに成立する。"},"answer":["エ"],"explain":"運送契約の当事者は旅客ではなく契約責任者で、契約はバス会社が申込みを承諾し運送引受書を交付したときに成立します。"},{"no":"3","group":"フェリー標準運送約款","prompt":"海上運送法第9条第3項の規定に基づく標準運送約款（フェリーを含む一般旅客定期航路事業に関する標準運送約款）に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"フェリー会社は、手回り品その他旅客の保管する物品の滅失又は損傷により生じた損害については、フェリー会社又はその使用人に過失があったことが証明された場合に限り、旅客1人につき15万円を限度とし、これを賠償する責任を負う。","イ":"旅客は、乗下船その他船内における行動に関し、船員等が輸送の安全確保と船内秩序の維持のために行う職務上の指示に従わなければならない。","ウ":"旅客が自ら携帯又は同伴して船室に持ち込む物であって、3辺の長さの和が2メートル以下で、かつ、重量が30キログラム以下の物品は、約款に規定する「手回り品」に該当する。","エ":"フェリー会社は、旅客の乗船後に乗船券の通用期間が経過した場合は、そのまま継続して乗船する間に限り、当該乗船券の通用期間は、その間延長されたものとみなす。"},"answer":["ア"],"explain":"15万円を限度とする定めは受託手荷物についてのもので、旅客が自ら保管する手回り品の損害については限度額の定め方が異なります。"},{"no":"4","group":"JR旅客営業規則","prompt":"旅客鉄道会社（JR）の旅客営業規則に関する次の記述のうち、正しいものを1つ選びなさい。","choices":{"ア":"「乗車券類」とは、乗車券、急行券、特別車両券、寝台券及び座席指定券のみをいう。","イ":"小児のグリーン料金、寝台料金は、大人のグリーン料金、寝台料金の半額である。","ウ":"旅客の運送等の契約は、その成立について別段の意思表示があった場合を除き、旅客等が所定の運賃・料金を支払い、乗車券類等その契約に関する証票の交付を受けた時に成立する。","エ":"旅客は、小犬・猫・はと又はこれらに類する小動物（猛獣及びへびの類を除く。）であって、所定の条件を満たす場合に限り、持込区間・持込日その他持込に関する必要事項を申し出たうえで、旅客鉄道会社の承諾を受けた場合は、無料で車内に持ち込むことができる。"},"answer":["ウ"],"explain":"運送契約は運賃・料金の支払いと乗車券類等の交付によって成立します。イの小児のグリーン料金・寝台料金は大人と同額、エの小動物の持込みには手回り品料金が必要です。"},{"no":"5","group":"モデル宿泊約款","prompt":"モデル宿泊約款に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"宿泊客がフロントに預けた現金及び貴重品については、ホテル（旅館）が、その種類及び価額の明告を求めた場合であって、宿泊客がそれを行わなかったときは、ホテル（旅館）は、いかなる場合もその損害を賠償しない。","イ":"ホテル（旅館）は、宿泊客の手荷物が、宿泊に先立ってホテル（旅館）に到着した場合は、その到着前に当該ホテル（旅館）が了解したときに限って責任をもって保管し、宿泊客がフロントにおいてチェックインする際に当該手荷物を渡す。","ウ":"宿泊客が、宿泊中に宿泊契約の申込みの際に申し出ていた宿泊日を超えて宿泊の継続を申し入れた場合、ホテル（旅館）は、その申し出がなされた時点で新たな宿泊契約の申し込みがあったものとして処理する。","エ":"ホテル（旅館）は、宿泊客が連絡をしないで宿泊日当日の所定の時刻、又はあらかじめ明示された到着予定時刻を一定の時間経過しても到着しないときは、その宿泊契約は当該宿泊客により解除されたものとみなして処理することがある。"},"answer":["ア"],"explain":"明告がなかった場合でも、ホテル（旅館）の故意又は過失により滅失・毀損等が生じたときは15万円を限度として賠償します。"}],[{"no":"1(1)","group":"貸切バスの運賃・料金","prompt":"次の内容で小型車の貸切バス1台とフェリーを利用するとき、この小型バスの運賃及び料金に関する記述のうち、正しいものはどれか。","material":"＜行程＞7月1日（土）\n4:40 出庫（回送）→ 5:00 新潟駅【乗車地】発 → 6:00 新潟港発 〜フェリー2時間30分〜 8:30 両津港着 → 佐渡島\n12:40 両津港発 〜フェリー2時間30分〜 15:10 新潟港着 → 15:40 新潟駅【降車地】→（回送）16:10 帰庫\n＜資料＞\n・走行距離は44キロ（回送距離の合計12キロを含む）\n・走行時間は11時間30分（回送時間を含む）\n・旅客は大人6人・小学4年生3人・3歳の小児3人の計12人で、フェリーでは12人全員が1等船室（イス席）を利用\n・小型バスの運転者はフェリーの2等船室に乗船する","choices":{"ア":"運賃は「11時間分の時間制運賃」と「30キロ分のキロ制運賃」の合計額、料金は不要である。","イ":"運賃は「12時間分の時間制運賃」と「40キロ分のキロ制運賃」の合計額、料金は「3時間分の深夜早朝運行料金」が必要である。","ウ":"運賃は「13時間分の時間制運賃」と「44キロ分のキロ制運賃」の合計額、料金は「2時間分の深夜早朝運行料金」が必要である。","エ":"運賃は「14時間分の時間制運賃」と「50キロ分のキロ制運賃」の合計額、料金は「1時間分の深夜早朝運行料金」が必要である。"},"answer":["エ"],"explain":"時間制運賃の対象時間は、走行時間11時間30分に出庫前・帰庫後の点呼等2時間を加えた13時間30分を1時間単位に切り上げて14時間。キロ制運賃は回送を含む走行距離44キロを10キロ単位に切り上げて50キロです。出庫前の点呼から出発までが深夜早朝の時間帯にかかるため、深夜早朝運行料金が1時間分必要になります。"},{"no":"1(2)","group":"フェリーの運賃","prompt":"このフェリーの乗船1回当たりの運賃に関する記述のうち、正しいものはどれか。","material":"（前問と同じ行程・資料。旅客は大人6人・小学4年生3人・3歳の小児3人の計12人で、全員が1等船室（イス席）を利用。小型バスの運転者は2等船室に乗船し、この小型バスはフェリーで航送する。）","choices":{"ア":"「大人6人分と小児6人分の1等旅客運賃」と「小型バス1台分の自動車航送運賃」と「小型バス運転者1人分の2等旅客運賃」が必要である。","イ":"「大人6人分と小児6人分の1等旅客運賃」と「小型バス1台分の自動車航送運賃」が必要である。","ウ":"「大人6人分と小児3人分の1等旅客運賃」と「小型バス1台分の自動車航送運賃」と「小型バス運転者1人分の2等旅客運賃」が必要である。","エ":"「大人6人分と小児3人分の1等旅客運賃」と「小型バス1台分の自動車航送運賃」が必要である。"},"answer":["イ"],"explain":"自動車航送運賃には運転者1人分の2等船室旅客運賃が含まれるため、運転者の運賃を別に支払う必要はありません。また小学生3人に加え、座席（1等イス席）を使用する3歳の小児3人も小児運賃が必要なので、小児は6人分となります。"},{"no":"2","group":"宿泊料金","prompt":"宿泊に関する次の記述のうち、資料に基づき、正しいものを1つ選びなさい（モデル宿泊約款による。入湯税及び宿泊税は課税されない）。","material":"＜資料＞\n●旅館：基本宿泊料 大人1人1泊2食付 20,000円／サービス料15％／消費税10％／前日解除の違約金の比率30％\n●ホテル：基本宿泊料 シングルルーム（定員1人）1室 10,000円／サービス料15％／チェックイン午後3時・チェックアウト午前10時","choices":{"ア":"この旅館に大人1人が1泊する宿泊契約を、宿泊客の都合により宿泊日の前日に解除したとき、この旅館は6,900円の違約金を申し受ける。","イ":"この旅館に大人1人と子供用の食事と寝具の提供を伴う7歳の小学生1人の計2人が1泊するとき、宿泊客が支払うべき宿泊料金等の総額は37,500円である。","ウ":"宿泊客がこのホテルのシングルルームを、午後4時30分まで延長して使用したときの時間外追加料金は、5,000円である。","エ":"このホテルのシングルルームに、宿泊客と宿泊期間を4日とする宿泊契約が成立したとき、このホテルは申込金を30,000円とすることができる。"},"answer":["エ"],"explain":"申込金の限度は宿泊期間（3日を超えるときは3日）の基本宿泊料で、10,000円×3日＝30,000円です。アの違約金は基本宿泊料20,000円の30％＝6,000円、イの子供料金は大人の50％で総額は一致せず、ウは超過6時間30分のため室料全額10,000円となります。"},{"no":"3(1)","group":"JR乗継割引","prompt":"乗継割引に関する次の記述のうち、正しいものはどれか。","material":"ア：1日目 秋田→新青森 特急「つがる」（普通車自由席）／2日目 新青森→新函館北斗 新幹線「はやぶさ」→ 長万部 特急「北斗」\nイ：1日目 別府→小倉 特急「ソニック」→ 岡山 新幹線「さくら」／2日目 岡山→松江 特急「やくも」\nウ：勝田→東京 特急「ひたち」→ 長岡 新幹線「とき」（同日）\nエ：鯖江→金沢 特急「サンダーバード」（グリーン席）→ 東京 新幹線「かがやき」（グランクラス）（同日）","choices":{"ア":"特急「つがる」の特急料金に乗継割引が適用される。","イ":"特急「やくも」の特急料金に乗継割引が適用される。","ウ":"特急「ひたち」の特急料金に乗継割引が適用される。","エ":"特急「サンダーバード」のグリーン料金に乗継割引が適用される。"},"answer":["ア"],"explain":"在来線特急に乗車した翌日に新幹線へ乗り継ぐ場合にも乗継割引は適用されます（新幹線が先の場合は当日中の乗継が必要なので、イのやくもには適用されません）。ウの東京駅は乗継割引の対象となる乗継駅ではなく、エの乗継割引は特急料金に適用されるもので、グリーン料金は対象外です。"},{"no":"3(2)","group":"JR乗車券","prompt":"大人1人が次の経路による行程を乗車するために必要な乗車券に関する次の記述のうち、正しいものはどれか。","material":"＜行程＞釧網本線（地方交通線）\n網走駅―（営業キロ16.9／賃率換算キロ18.6）―原生花園駅―（営業キロ62.9／換算69.2）―川湯温泉駅―（営業キロ15.9／換算17.4）―摩周駅\n7月1日 網走→原生花園（途中下車せず乗車）。原生花園駅では改札口から出場して観光。\n7月1日 原生花園→川湯温泉（途中下車せず乗車）。川湯温泉駅では改札口から出場して2泊。\n7月3日 川湯温泉→摩周（途中下車せず乗車）。","choices":{"ア":"7月1日と7月3日の全乗車区間分として「16.9＋62.9＋15.9＝95.7キロ」の乗車券1枚が必要である。","イ":"7月1日の乗車分として「18.6キロ」と「69.2キロ」の乗車券各1枚、7月3日の乗車分として「17.4キロ」の乗車券1枚の計3枚が必要である。","ウ":"7月1日の乗車分として「16.9キロ」と「62.9キロ」の乗車券各1枚、7月3日の乗車分として「15.9キロ」の乗車券1枚の計3枚が必要である。","エ":"7月1日と7月3日の全乗車区間分として「18.6＋69.2＋17.4＝105.2キロ」の乗車券1枚が必要である。"},"answer":["ウ"],"explain":"営業キロ100キロ以下の乗車券では途中下車ができないため、改札を出るごとに乗車券が必要で計3枚になります。また地方交通線のみを乗車する場合の運賃は、賃率換算キロではなく営業キロで計算します。"},{"no":"3(3)①","group":"JR運賃","prompt":"次の行程で大人1人が乗車するとき、片道普通旅客運賃の計算に関する次の記述のうち、正しいものはどれか。","material":"＜行程＞\n身延駅―身延線（地方交通線・営業キロ43.5／賃率換算キロ47.8）―富士駅―東海道本線（幹線・営業キロ55.8）―根府川駅\n（注）富士駅では最初の列車の乗車日当日に乗り継ぐ。","choices":{"ア":"運賃は、「43.5キロ＋55.8キロ＝99.3キロ」を使用して計算した額となる。","イ":"運賃は、「47.8キロ＋55.8キロ＝103.6キロ」を使用して計算した額となる。","ウ":"運賃は、「43.5キロ」を使用した額と、「55.8キロ」を使用した額を合計した額となる。","エ":"運賃は、「47.8キロ」を使用した額と、「55.8キロ」を使用した額を合計した額となる。"},"answer":["イ"],"explain":"幹線と地方交通線にまたがって乗車する場合は、地方交通線の区間について賃率換算キロを用い、全区間を通算した距離で本州3社の幹線の運賃表から運賃を求めます。"},{"no":"3(3)②","group":"JR割引","prompt":"この行程における普通乗車券及び指定席特急券に関する次の記述のうち、正しいものはどれか。","choices":{"ア":"中学生以上の指定学校の学生又は生徒が「学生・生徒旅客運賃割引証」を提示して普通乗車券を購入するときは、大人普通旅客運賃が2割引になる。","イ":"中学生以上の指定学校の学生又は生徒が8人以上と、当該学校の教職員によって構成され、当該学校の教職員が引率する団体が、身延駅から富士駅間を特急「ふじかわ」に乗車する場合において、指定席特急券を購入するときは、当該特急料金は5割引になる。","ウ":"訪日観光客8人とこれと同行する旅行業者とによって構成され、責任ある代表者が引率する訪日観光団体が普通乗車券を購入するときは、大人普通旅客運賃が1割5分引になる。","エ":"学生団体及び訪日観光団体ではない20人の旅客が一緒に旅行するとき、1人分の運賃が無料になる。"},"answer":["ウ"],"explain":"訪日観光団体の普通旅客運賃は1割5分引です。アの学生割引は片道営業キロ101キロ以上の場合に限られ、イの学生団体の割引は運賃に適用され特急料金は割引されません。エの無賃扱いは普通団体で31人以上の場合に生じます。"},{"no":"3(4)","group":"JR料金","prompt":"次の経路による行程で大人1人が乗車するとき、新幹線の特急料金とグリーン料金の額の組合せについて、資料に基づき、正しいものを1つ選びなさい。","material":"＜行程＞7月15日（土）繁忙期\n岐阜羽島駅―「こだま」普通車指定席（営業キロ117.3キロ）―京都駅―「のぞみ」グリーン車指定席（営業キロ513.4キロ）―新山口駅\n（注）京都駅では新幹線の改札口を出ないで乗り継ぐ。\n＜資料＞〔ひかり〕〔こだま〕普通車指定席特急料金（通常期）岐阜羽島－京都 3,060円／岐阜羽島－新山口 5,920円／京都－新山口 5,490円\n〔のぞみ〕普通車指定席特急料金（通常期）京都－新山口 6,340円\nグリーン料金 100キロまで1,300円／200キロまで2,800円／400キロまで4,190円／600キロまで5,400円／800キロまで6,600円／801キロ以上7,790円","choices":{"ア":"特急料金 5,920円＋（6,340円－5,490円）＋200円－530円＝6,440円／グリーン料金 5,400円","イ":"特急料金 5,920円＋（6,340円－5,490円）＋200円＝6,970円／グリーン料金 5,400円","ウ":"特急料金 （3,060円＋200円－530円）＋（6,340円＋200円－530円）＝8,740円／グリーン料金 6,600円","エ":"特急料金 （3,060円＋200円）＋（6,340円＋200円）＝9,800円／グリーン料金 6,600円"},"answer":["ア"],"explain":"改札口を出ずに乗り継ぐので特急料金は通し計算し、全区間の指定席特急料金5,920円に「のぞみ」利用区間の加算額850円と繁忙期の200円を加え、グリーン車利用区間があるため530円を差し引きます。グリーン料金はグリーン車を利用する京都－新山口間の営業キロ513.4キロにより5,400円で、季節による増減はありません。"},{"no":"3(5)","group":"JR運賃・料金","prompt":"大人1人、12歳の小学生1人、3歳の幼児1人の計3人の家族が、3つの席を使用して特急列車の普通車指定席に乗車する場合において、この乗車に必要な運賃及び料金の組合せに関する次の記述のうち、正しいものはどれか。","choices":{"ア":"「1人分の大人運賃と1人分の大人指定席特急料金」、「2人分の小児運賃と2人分の小児指定席特急料金」である。","イ":"「1人分の大人運賃と1人分の大人指定席特急料金」、「1人分の小児運賃と2人分の小児指定席特急料金」である。","ウ":"「2人分の大人運賃と2人分の大人指定席特急料金」、「1人分の小児指定席特急料金」である。","エ":"「2人分の大人運賃と2人分の大人指定席特急料金」、「1人分の小児運賃と1人分の小児指定席特急料金」である。"},"answer":["ア"],"explain":"12歳でも小学生であれば小児扱いです。幼児は通常無賃ですが、指定席を1人で使用するため小児として運賃・料金が必要になり、小児は2人分となります。"},{"no":"3(6)","group":"JR","prompt":"旅客鉄道会社（JR）に関する次の記述のうち、誤っているものを1つ選びなさい。","choices":{"ア":"自転車は、手回り品に関する要件を満たしたうえで、解体し専用の袋に収納したもの又は折りたたみ式自転車において折りたたんで専用の袋に収納したものは無料で車内に持ち込むことができる。","イ":"普通乗車券を紛失した旅客が、その旨を申告して再度同じ普通乗車券を購入し、券面に「紛失再」の表示を受けた上で旅行終了駅にて「再収受証明」を受け、その翌日に紛失券を発見し同日中に両方をつけて請求したときは、発見した普通乗車券について手数料220円を支払うことで、再収受証明のある普通乗車券の運賃の払いもどしを受けることができる。","ウ":"特急「あずさ」の指定席特急券を所持する旅客が、旅客の都合により指定の列車に乗り遅れたとき、当該指定された列車の乗車日と同じ日であれば後続の特急列車の立席又は普通車の空席がある場合は空席を利用することができる。","エ":"特急券と寝台券を1枚で発行した指定券を当該列車出発前日に払い戻す場合の払いもどし手数料は、特急券の払いもどし手数料と寝台券の払いもどし手数料の合計額である。"},"answer":["エ"],"explain":"特急券と寝台券が1枚の指定券として発行されている場合の払いもどし手数料は、1枚の指定券分だけで、それぞれの手数料を合計するわけではありません。"}]]}</script>

  {key:'jitsumu',name:'国内旅行実務', short:'国内旅行実務', pass:24, full:40}
];
var YEARS = [{key:'R7', label:'令和7年度'}, {key:'R6', label:'令和6年度'}, {key:'R5', label:'令和5年度'}];
var ALL = [];
YEARS.forEach(function(y){
  SUBJECTS.forEach(function(s,i){
    (RAW[y.key][i] || []).forEach(function(q,j){
      q.subject = s.key; q.subjectName = s.short;
      q.year = y.key; q.yearLabel = y.label;
      q.id = y.key+'-'+s.key+'-'+j;
      ALL.push(q);
    });
  });
});
var curYear = YEARS[0].key;
function ofYear(y){ return ALL.filter(function(q){ return q.year===y; }); }

var KEY = 'chiiki-kako-v2';
var store = {wrong:{}, seen:{}, right:{}};
try{ var raw = localStorage.getItem(KEY); if(raw) store = Object.assign(store, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

var view = document.getElementById('view'), bar = document.getElementById('bar'),
    mainBtn = document.getElementById('mainBtn'), skipBtn = document.getElementById('skipBtn'),
    quitBtn = document.getElementById('quitBtn'), hint = document.getElementById('hint'),
    rail = document.getElementById('rail'), htitle = document.getElementById('htitle');

var S = null; // session

function esc(t){ return String(t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function rate(list){
  var done=0, ok=0;
  list.forEach(function(q){ if(store.seen[q.id]){done++; if(store.right[q.id]) ok++;} });
  return {done:done, ok:ok, total:list.length};
}

/* ---------- home ---------- */
function home(){
  S = null; bar.hidden = true; quitBtn.hidden = true; rail.style.width='0%';
  htitle.textContent = '地域限定旅行業務取扱管理者　過去問';
  var wrongList = ALL.filter(function(q){ return store.wrong[q.id]; });
  var overall = rate(ALL);
  var yearList = ofYear(curYear);
  var h = '';
  h += '<section class="hero">'+
       '<div class="kicker">令和5〜7年度 本試験</div>'+
       '<h1>地域限定旅行業務<br>取扱管理者 過去問</h1>'+
       '<p>観光庁公表の試験問題・正解をもとに、3年分177問を解説つきで出題します。</p>'+
       '<div class="sub">'+
         '<div><b>'+ALL.length+'</b>問</div>'+
         '<div><b>'+overall.done+'</b>問 解答済み</div>'+
         '<div><b>'+(overall.done? Math.round(overall.ok/overall.done*100):0)+'%</b>正答率</div>'+
       '</div></section>';

  h += '<h2 class="sec">年度を選ぶ</h2><div class="years">';
  YEARS.forEach(function(y){
    var r = rate(ofYear(y.key));
    h += '<button class="ybtn'+(y.key===curYear?' on':'')+'" data-year="'+y.key+'">'+y.label+
         '<span>'+r.done+'/'+r.total+'問</span></button>';
  });
  h += '</div>';

  h += '<h2 class="sec">'+yearLabel(curYear)+'を科目ごとに解く</h2><div class="menu">';
  SUBJECTS.forEach(function(s){
    var list = yearList.filter(function(q){return q.subject===s.key;});
    var r = rate(list);
    h += '<button class="mrow" data-mode="subject" data-key="'+s.key+'">'+
      '<span class="t"><b>'+s.name+'</b><span>'+list.length+'問　合格基準 '+s.pass+'点／'+s.full+'点</span></span>'+
      '<span class="n">'+(r.done? '<em>'+Math.round(r.ok/r.done*100)+'%</em><br>'+r.done+'/'+r.total+'問' : '未着手')+'</span></button>';
  });
  h += '</div>';

  h += '<h2 class="sec">まとめて解く</h2><div class="menu">'+
    '<button class="mrow" data-mode="all"><span class="t"><b>'+yearLabel(curYear)+'を通して解く</b><span>本試験と同じ順番・236点満点</span></span><span class="n">'+yearList.length+'問</span></button>'+
    '<button class="mrow" data-mode="random"><span class="t"><b>ランダム10問</b><span>2年分からランダムに出題します</span></span><span class="n">10問</span></button>'+
    '<button class="mrow" data-mode="wrong"'+(wrongList.length?'':' disabled')+'><span class="t"><b>まちがえた問題だけ</b><span>'+(wrongList.length? '正解できるとリストから消えます' : 'まちがえた問題がたまるとここに並びます')+'</span></span><span class="n">'+wrongList.length+'問</span></button>'+
    '</div>';

  h += '<p class="note">出典：観光庁「地域限定旅行業務取扱管理者試験問題」及び「正解及び配点」（令和5年度〜令和7年度／国土交通省観光庁ウェブサイト）。解説はこのアプリで独自に作成したものです。<br>合格基準は3科目すべてで基準点以上（旅行業法60点・約款58点・国内旅行実務24点）。'+
       '<br><button class="hbtn" id="resetBtn" style="margin-top:10px">学習記録を消す</button></p>';
  view.innerHTML = h;
  window.scrollTo(0,0);
}

function yearLabel(k){
  for(var i=0;i<YEARS.length;i++){ if(YEARS[i].key===k) return YEARS[i].label; }
  return '';
}

view.addEventListener('click', function(e){
  var yb = e.target.closest('.ybtn');
  if(yb){ curYear = yb.dataset.year; home(); return; }
  var row = e.target.closest('.mrow');
  if(row && !row.hasAttribute('disabled')){ start(row.dataset.mode, row.dataset.key); return; }
  if(e.target.id === 'resetBtn'){
    store = {wrong:{},seen:{},right:{}}; save(); home(); return;
  }
  if(e.target.id === 'againBtn'){ start(S.mode, S.key, S.year); return; }
  if(e.target.id === 'homeBtn'){ home(); return; }
  if(e.target.id === 'wrongBtn'){ start('wrong'); return; }
});

/* ---------- session ---------- */
function start(mode, key, year){
  var yr = year || curYear, list;
  if(mode==='subject') list = ofYear(yr).filter(function(q){return q.subject===key;});
  else if(mode==='all') list = ofYear(yr);
  else if(mode==='random') list = shuffle(ALL.slice()).slice(0,10);
  else list = ALL.filter(function(q){ return store.wrong[q.id]; });
  if(!list.length){ home(); return; }
  S = {mode:mode, key:key, year:yr, list:list, i:0, picked:[], graded:false, log:[]};
  quitBtn.hidden = false; bar.hidden = false;
  render();
}

quitBtn.addEventListener('click', function(){ home(); });

function render(){
  var q = S.list[S.i], multi = q.answer.length > 1;
  htitle.textContent = q.yearLabel + '　' + q.subjectName + '　' + (S.i+1) + ' / ' + S.list.length + '問';
  rail.style.width = (S.i / S.list.length * 100) + '%';
  var h = '<article class="qcard"><div class="qhead">'+
    '<span class="qno">設問 '+esc(q.no)+'</span>'+
    (multi? '<span class="qtag">複数選択</span>':'')+
    '<span class="qgrp">'+esc(q.yearLabel)+'　'+esc(q.group || q.subjectName)+'</span></div>'+
    '<p class="qtext">'+esc(q.prompt)+'</p>'+
    (q.material? '<div class="material">'+esc(q.material)+'</div>' : '')+
    '<div class="choices" id="choices">';
  Object.keys(q.choices).forEach(function(k){
    h += '<button class="choice" type="button" data-k="'+k+'" aria-pressed="false">'+
         '<span class="bub">'+k+'</span><span>'+esc(q.choices[k])+'</span></button>';
  });
  h += '</div><div id="verdict"></div></article>';
  view.innerHTML = h;
  S.picked = []; S.graded = false;
  mainBtn.textContent = '採点する'; mainBtn.disabled = true;
  skipBtn.hidden = false; skipBtn.textContent = 'とばす';
  hint.textContent = multi ? '当てはまるものをすべて選んでください' : '';
  window.scrollTo(0,0);

  document.getElementById('choices').addEventListener('click', function(e){
    var b = e.target.closest('.choice'); if(!b || S.graded) return;
    var k = b.dataset.k;
    if(multi){
      var idx = S.picked.indexOf(k);
      if(idx>=0) S.picked.splice(idx,1); else S.picked.push(k);
    } else {
      S.picked = [k];
    }
    Array.prototype.forEach.call(this.querySelectorAll('.choice'), function(el){
      el.setAttribute('aria-pressed', S.picked.indexOf(el.dataset.k)>=0 ? 'true':'false');
    });
    mainBtn.disabled = S.picked.length === 0;
  });
}

function grade(){
  var q = S.list[S.i];
  var ok = q.answer.length === S.picked.length && q.answer.every(function(k){ return S.picked.indexOf(k)>=0; });
  S.graded = true;
  store.seen[q.id] = 1;
  if(ok){ store.right[q.id] = 1; delete store.wrong[q.id]; }
  else { store.right[q.id] = 0; store.wrong[q.id] = 1; }
  save();
  S.log.push({q:q, ok:ok, picked:S.picked.slice()});

  Array.prototype.forEach.call(document.querySelectorAll('.choice'), function(el){
    var k = el.dataset.k, isAns = q.answer.indexOf(k)>=0, isPick = S.picked.indexOf(k)>=0;
    el.disabled = true;
    if(isAns) el.classList.add('correct');
    else if(isPick) el.classList.add('wrong');
    if(isAns || isPick){
      var m = document.createElement('span');
      m.className = 'mark ' + (isAns?'ok':'ng');
      m.textContent = isAns ? '○' : '×';
      el.appendChild(m);
    }
  });
  document.getElementById('verdict').innerHTML =
    '<div class="verdict reveal"><div class="vhead"><span class="res '+(ok?'ok':'ng')+'">'+(ok?'正解':'不正解')+'</span>'+
    '<span class="ans">正解　'+q.answer.join('・')+'</span></div>'+
    '<p>'+esc(q.explain)+'</p></div>';
  mainBtn.textContent = (S.i+1 < S.list.length) ? '次の問題へ' : '結果を見る';
  mainBtn.disabled = false;
  skipBtn.hidden = true;
  hint.textContent = '';
}

mainBtn.addEventListener('click', function(){
  if(!S) return;
  if(!S.graded){ grade(); return; }
  S.i++;
  if(S.i < S.list.length) render(); else result();
});
skipBtn.addEventListener('click', function(){
  if(!S || S.graded) return;
  S.log.push({q:S.list[S.i], ok:false, skipped:true});
  S.i++;
  if(S.i < S.list.length) render(); else result();
});

/* ---------- result ---------- */
function result(){
  bar.hidden = true; quitBtn.hidden = true; rail.style.width='100%';
  htitle.textContent = '結果';
  var got = 0, total = S.log.length*4;
  var per = {};
  S.log.forEach(function(l){
    var s = l.q.subject;
    per[s] = per[s] || {got:0,total:0};
    per[s].total += 4;
    if(l.ok){ got += 4; per[s].got += 4; }
  });
  var missed = S.log.filter(function(l){ return !l.ok; });
  var full = (S.mode==='all');
  var h = '<section class="score"><h2>'+(full? yearLabel(S.year)+' 本試験':'お疲れさまでした')+'</h2>'+
    '<div class="big">'+got+'<span> / '+total+'点</span></div>'+
    '<div class="brk">';
  SUBJECTS.forEach(function(s){
    if(!per[s.key]) return;
    var p = per[s.key];
    h += '<div><b>'+s.short+'</b><span class="pt">'+p.got+'</span><span style="color:var(--ink-soft)">/'+p.total+'点</span>'+
      (full? '<span class="pass '+(p.got>=s.pass?'y':'n')+'">基準'+s.pass+'点</span>' : '')+'</div>';
  });
  h += '</div></section>';
  if(missed.length){
    h += '<h2 class="sec">まちがえた '+missed.length+'問（タップで解説）</h2><div class="rvw">';
    missed.forEach(function(l){
      h += '<details><summary><span class="n">設問 '+esc(l.q.no)+'</span><span>'+esc(l.q.prompt.slice(0,34))+'…</span></summary>'+
        '<div class="body"><b>正解　'+l.q.answer.join('・')+'</b><br>'+esc(l.q.explain)+'</div></details>';
    });
    h += '</div>';
  } else {
    h += '<h2 class="sec">全問正解です</h2>';
  }
  h += '<div class="menu" style="margin-top:14px">'+
    '<button class="mrow" id="againBtn"><span class="t"><b>もう一度解く</b><span>同じ範囲をやり直します</span></span></button>'+
    (Object.keys(store.wrong).length? '<button class="mrow" id="wrongBtn"><span class="t"><b>まちがえた問題だけ解く</b><span>'+Object.keys(store.wrong).length+'問たまっています</span></span></button>':'')+
    '<button class="mrow" id="homeBtn"><span class="t"><b>トップに戻る</b><span>科目を選び直します</span></span></button></div>';
  h += '<footer>出典：観光庁「地域限定旅行業務取扱管理者試験問題」及び「正解及び配点」（令和5年度〜令和7年度）<br>解説は本アプリ独自のものです。最終的な判断は法令・約款の原文をご確認ください。</footer>';
  view.innerHTML = h;
  window.scrollTo(0,0);
}

home();
})();
</script>
</body>
</html>
